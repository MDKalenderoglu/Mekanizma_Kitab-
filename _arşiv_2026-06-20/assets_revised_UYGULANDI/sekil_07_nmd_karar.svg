<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>

  <!-- column headers -->
  <text x="268" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2563EB">Senaryo 1 — NMD'yi TETİKLER</text>
  <text x="694" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#D97706">Senaryo 2 — NMD'den KAÇAR</text>
  <line x1="480" y1="48" x2="480" y2="338" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- ===== Panel letters ===== -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <rect x="20" y="74" width="23" height="23" rx="4" fill="#1A2B4A"/><text x="31.5" y="90" text-anchor="middle">A</text>
    <rect x="20" y="160" width="23" height="23" rx="4" fill="#1A2B4A"/><text x="31.5" y="176" text-anchor="middle">B</text>
    <rect x="20" y="212" width="23" height="23" rx="4" fill="#1A2B4A"/><text x="31.5" y="228" text-anchor="middle">C</text>
    <rect x="20" y="276" width="23" height="23" rx="4" fill="#1A2B4A"/><text x="31.5" y="292" text-anchor="middle">D</text>
  </g>
  <text x="55" y="64" font-size="10" font-weight="600" fill="#64748B">A · Moleküler: PTC'nin konumu (son EEJ'e uzaklık)</text>

  <!-- ===== ROW A : transcripts ===== -->
  <!-- LEFT transcript -->
  <text x="324" y="84" text-anchor="middle" font-size="8.5" fill="#64748B">son EEJ</text>
  <line x1="324" y1="88" x2="324" y2="150" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="294" y="100" width="166" height="30" fill="#FEF3C7" opacity="0.7"/>
  <text x="377" y="146" text-anchor="middle" font-size="8" fill="#B7791F">NMD kaçış penceresi</text>
  <!-- exons -->
  <g stroke="#94A3B8" stroke-width="1.2">
    <rect x="64" y="100" width="78" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="146" y="100" width="78" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="228" y="100" width="78" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="324" y="100" width="136" height="30" rx="3" fill="#CBD5E1"/>
  </g>
  <!-- junction chevrons -->
  <g fill="#64748B"><polygon points="144,96 150,96 147,90"/><polygon points="226,96 232,96 229,90"/><polygon points="322,96 328,96 325,90"/></g>
  <text x="392" y="119" text-anchor="middle" font-size="9" fill="#475569">son ekzon</text>
  <!-- PTC upstream -->
  <line x1="185" y1="94" x2="185" y2="136" stroke="#B91C1C" stroke-width="2.4"/>
  <polygon points="185,90 180,98 190,98" fill="#B91C1C"/>
  <text x="185" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">PTC</text>
  <!-- distance brace -->
  <line x1="185" y1="158" x2="324" y2="158" stroke="#2563EB" stroke-width="1.3"/>
  <line x1="185" y1="154" x2="185" y2="162" stroke="#2563EB" stroke-width="1.3"/>
  <line x1="324" y1="154" x2="324" y2="162" stroke="#2563EB" stroke-width="1.3"/>
  <text x="254" y="172" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563EB">son EEJ'den &gt;50–55 nt yukarıda</text>

  <!-- RIGHT transcript -->
  <text x="752" y="84" text-anchor="middle" font-size="8.5" fill="#64748B">son EEJ</text>
  <line x1="752" y1="88" x2="752" y2="150" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="722" y="100" width="166" height="30" fill="#FEF3C7" opacity="0.7"/>
  <g stroke="#94A3B8" stroke-width="1.2">
    <rect x="500" y="100" width="78" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="582" y="100" width="78" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="664" y="100" width="78" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="752" y="100" width="136" height="30" rx="3" fill="#CBD5E1"/>
  </g>
  <g fill="#64748B"><polygon points="580,96 586,96 583,90"/><polygon points="662,96 668,96 665,90"/><polygon points="750,96 756,96 753,90"/></g>
  <text x="820" y="119" text-anchor="middle" font-size="9" fill="#475569">son ekzon</text>
  <!-- PTC in last exon -->
  <line x1="820" y1="94" x2="820" y2="136" stroke="#B91C1C" stroke-width="2.4"/>
  <polygon points="820,90 815,98 825,98" fill="#B91C1C"/>
  <text x="820" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">PTC</text>
  <text x="800" y="172" text-anchor="middle" font-size="9.5" font-weight="600" fill="#D97706">son ekzonda / son EEJ'e çok yakın</text>

  <!-- ===== ROW B : RNA fate ===== -->
  <rect x="120" y="186" width="296" height="30" rx="15" fill="#2563EB"/>
  <text x="268" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">mRNA yıkılır (NMD) → transkript yok</text>
  <rect x="546" y="186" width="296" height="30" rx="15" fill="#64748B"/>
  <text x="694" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">mRNA korunur → proteine çevrilir</text>

  <!-- ===== ROW C : protein ===== -->
  <rect x="120" y="230" width="296" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="268" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Protein üretilmez</text>
  <text x="268" y="266" text-anchor="middle" font-size="10.5" fill="#2456c9">fonksiyonel null (işlev kaybı)</text>

  <rect x="546" y="230" width="296" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
  <text x="694" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Kısalmış (truncated) protein üretilir</text>
  <text x="694" y="266" text-anchor="middle" font-size="10.5" fill="#a02020">C-terminal alan kaybı; çözünür kalıntı</text>

  <!-- ===== ROW D : interpretation ===== -->
  <rect x="120" y="288" width="296" height="46" rx="8" fill="#ffffff" stroke="#2563EB" stroke-width="1.8"/>
  <text x="268" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">Tipik LoF mekanizması</text>
  <text x="268" y="325" text-anchor="middle" font-size="10.5" fill="#2E3440">→ PVS1 uygulanabilir (uygun güçte)</text>

  <rect x="546" y="288" width="296" height="46" rx="8" fill="#ffffff" stroke="#D97706" stroke-width="1.8"/>
  <text x="694" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B45309">Dominant-negatif / GoF olabilir</text>
  <text x="694" y="325" text-anchor="middle" font-size="10.5" fill="#2E3440">→ PVS1'i otomatik uygulama; mekanizmayı doğrula</text>

  <!-- vertical connectors A→B→C→D -->
  <g stroke="#CBD5E1" stroke-width="1.6">
    <line x1="268" y1="174" x2="268" y2="186"/><line x1="268" y1="216" x2="268" y2="230"/><line x1="268" y1="274" x2="268" y2="288"/>
    <line x1="694" y1="174" x2="694" y2="186"/><line x1="694" y1="216" x2="694" y2="230"/><line x1="694" y1="274" x2="694" y2="288"/>
  </g>

  <!-- ===== bottom strip : mechanism -> test -> interpretation ===== -->
  <rect x="40" y="356" width="840" height="88" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="56" y="378" font-size="11" font-weight="700" fill="#1A2B4A">Mekanizma → test → yorum</text>
  <g font-size="10.5" fill="#2E3440">
    <rect x="56" y="388" width="250" height="44" rx="7" fill="#ffffff" stroke="#CBD5E1"/>
    <text x="181" y="406" text-anchor="middle" font-weight="700" fill="#1A2B4A">Mekanizma</text>
    <text x="181" y="423" text-anchor="middle">PTC'nin son EEJ'e uzaklığı</text>
    <rect x="335" y="388" width="250" height="44" rx="7" fill="#ffffff" stroke="#CBD5E1"/>
    <text x="460" y="406" text-anchor="middle" font-weight="700" fill="#1A2B4A">Test</text>
    <text x="460" y="423" text-anchor="middle">DNA dizileme PTC'yi bulur;</text>
    <rect x="614" y="388" width="250" height="44" rx="7" fill="#ffffff" stroke="#CBD5E1"/>
    <text x="739" y="406" text-anchor="middle" font-weight="700" fill="#1A2B4A">Yorum</text>
    <text x="739" y="423" text-anchor="middle">NMD(+) → PVS1 güçlü</text>
  </g>
  <text x="460" y="437" text-anchor="middle" font-size="9.5" fill="#64748B">RNA-seq / cDNA, NMD'yi ve transkript akıbetini doğrular · NMD(−) → PVS1'i mekanizmaya göre azalt</text>

  <!-- arrows between bottom segments -->
  <g fill="#94A3B8"><polygon points="308,410 320,404 320,416"/><polygon points="587,410 599,404 599,416"/></g>
</svg>
