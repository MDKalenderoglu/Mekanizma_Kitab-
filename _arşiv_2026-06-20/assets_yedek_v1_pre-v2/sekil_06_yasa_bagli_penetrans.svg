<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 6 — Yaşa Bağlı (Age-Dependent) Penetrans</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#555">Penetrans sabit bir sayı değildir; yaşla birlikte değişen bir EĞRİdir.</text>

  <!-- axes -->
  <line x1="90" y1="380" x2="820" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="380" x2="90" y2="90" stroke="#333" stroke-width="2"/>
  <!-- y labels -->
  <text x="80" y="385" text-anchor="end" font-size="11" fill="#444">0%</text>
  <text x="80" y="308" text-anchor="end" font-size="11" fill="#444">25%</text>
  <text x="80" y="235" text-anchor="end" font-size="11" fill="#444">50%</text>
  <text x="80" y="162" text-anchor="end" font-size="11" fill="#444">75%</text>
  <text x="80" y="98" text-anchor="end" font-size="11" fill="#444">100%</text>
  <text x="40" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2b4a" transform="rotate(-90 40 240)">Etkilenen taşıyıcı oranı (kümülatif)</text>
  <!-- x labels -->
  <text x="90" y="400" text-anchor="middle" font-size="11" fill="#444">0</text>
  <text x="236" y="400" text-anchor="middle" font-size="11" fill="#444">20</text>
  <text x="382" y="400" text-anchor="middle" font-size="11" fill="#444">40</text>
  <text x="528" y="400" text-anchor="middle" font-size="11" fill="#444">60</text>
  <text x="674" y="400" text-anchor="middle" font-size="11" fill="#444">80</text>
  <text x="450" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2b4a">Yaş (yıl)</text>

  <!-- gridlines -->
  <g stroke="#eee" stroke-width="1">
    <line x1="90" y1="308" x2="820" y2="308"/>
    <line x1="90" y1="235" x2="820" y2="235"/>
    <line x1="90" y1="162" x2="820" y2="162"/>
  </g>

  <!-- High-penetrance curve (e.g. tumor predisposition reaching ~90%) -->
  <path d="M90 380 C 250 375, 330 300, 430 220 C 520 150, 620 120, 760 112" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="770" y="108" font-size="11" fill="#c0392b" font-weight="700">Yüksek penetrans</text>
  <text x="770" y="124" font-size="10" fill="#c0392b">(~%90, geç başlangıç)</text>

  <!-- Reduced-penetrance curve plateau ~45% -->
  <path d="M90 380 C 260 376, 340 330, 440 295 C 560 258, 660 252, 760 250" fill="none" stroke="#2471a3" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="770" y="250" font-size="11" fill="#2471a3" font-weight="700">Eksik penetrans</text>
  <text x="770" y="266" font-size="10" fill="#2471a3">(~%45 platosu)</text>

  <!-- annotations -->
  <circle cx="236" cy="360" r="4" fill="#c0392b"/>
  <text x="245" y="350" font-size="10" fill="#666">20 yaşında çok az birey etkilenmiş</text>
  <circle cx="528" cy="158" r="4" fill="#c0392b"/>
  <text x="430" y="150" font-size="10" fill="#666">orta yaşta hızlı artış</text>

  <text x="450" y="452" text-anchor="middle" font-size="11" font-style="italic" fill="#777">Klinik çıkarım: "Bu yaşta sağlıklı" olması, varyantı dışlamaz; risk yaşla artabilir (ör. herediter kanser sendromları).</text>
</svg>
