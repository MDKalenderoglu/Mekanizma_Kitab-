<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 12 — Farklı Varyant Tipleri, Aynı Sonuç: "Tek Allel Sustu"</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#555">Nokta varyantı da tam-gen delesyonu da haploinsufficiency'de aynı %50 doz kaybına yol açar — bu yüzden tanıda ikisi de aranmalıdır.</text>

  <!-- three input mechanisms -->
  <text x="160" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#2471a3">A. Nonsense / frameshift</text>
  <rect x="60" y="105" width="200" height="42" rx="5" fill="#eaf2fb" stroke="#2980b9"/>
  <line x1="72" y1="126" x2="180" y2="126" stroke="#2980b9" stroke-width="3"/>
  <text x="190" y="123" font-size="16" font-weight="700" fill="#c0392b">✕</text>
  <text x="160" y="166" text-anchor="middle" font-size="10" fill="#666">PTC → NMD → transkript yıkılır</text>

  <text x="470" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#2471a3">B. Ekzon / tam-gen delesyonu</text>
  <rect x="370" y="105" width="200" height="42" rx="5" fill="#eaf2fb" stroke="#2980b9"/>
  <line x1="382" y1="126" x2="430" y2="126" stroke="#2980b9" stroke-width="3"/>
  <line x1="510" y1="126" x2="558" y2="126" stroke="#2980b9" stroke-width="3"/>
  <rect x="430" y="118" width="80" height="16" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="470" y="166" text-anchor="middle" font-size="10" fill="#666">allel fiziksel olarak yok (CNV)</text>

  <text x="780" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#2471a3">C. Destabilize / kanonik splice</text>
  <rect x="680" y="105" width="200" height="42" rx="5" fill="#eaf2fb" stroke="#2980b9"/>
  <line x1="692" y1="126" x2="868" y2="126" stroke="#2980b9" stroke-width="3"/>
  <circle cx="760" cy="126" r="7" fill="#e67e22"/>
  <text x="780" y="166" text-anchor="middle" font-size="10" fill="#666">protein katlanamaz / yıkılır → işlevsiz</text>

  <!-- arrows converge -->
  <path d="M160 175 C 160 210, 360 215, 455 235" fill="none" stroke="#95a5a6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M470 175 L470 230" fill="none" stroke="#95a5a6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M780 175 C 780 210, 580 215, 485 235" fill="none" stroke="#95a5a6" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#95a5a6"/>
    </marker>
  </defs>

  <!-- convergence node -->
  <rect x="300" y="245" width="340" height="56" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="470" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">Bir allel işlevsiz → yalnız 1 işlevsel kopya</text>
  <text x="470" y="290" text-anchor="middle" font-size="12" fill="#922b21">Net etki = %50 işlevsel doz (ortak son yol)</text>

  <!-- down to dosage-sensitive gene -->
  <path d="M470 301 L470 340" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="270" y="345" width="400" height="48" rx="10" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
  <text x="470" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#b9770e">Gen doz-duyarlı (HI) ise → DOMİNANT hastalık</text>
  <text x="470" y="385" text-anchor="middle" font-size="11" fill="#7e5109">tamponlu gende aynı kayıp sessizdir (resesif taşıyıcı)</text>

  <!-- test implication box -->
  <rect x="70" y="425" width="800" height="78" rx="10" fill="#eef6fb" stroke="#2980b9"/>
  <text x="90" y="448" font-size="12" font-weight="700" fill="#1a5276">Tanısal sonuç (kritik):</text>
  <text x="90" y="469" font-size="11" fill="#444">A ve C tipi varyantlar diziyle (WES/WGS) yakalanır; B tipi (ekzon/tam-gen delesyonu) çoğu kez yalnız diziyle GÖRÜLMEZ.</text>
  <text x="90" y="489" font-size="11" font-weight="700" fill="#c0392b">→ HI geninde sekanslama + doz analizi (MLPA / array-CGH / WGS-CNV) BİRLİKTE gerekir; yoksa hastaların bir kısmı kaçar.</text>
</svg>
