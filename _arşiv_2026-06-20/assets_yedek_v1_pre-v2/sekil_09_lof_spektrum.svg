<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="480" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 9 — LoF Allelik Spektrumu: Rezidüel Fonksiyon → Fenotip Şiddeti</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#555">Aynı gende farklı aleller, kalan işleve göre bir şiddet yelpazesi oluşturur (örnek: PAH/PKU).</text>

  <!-- axes -->
  <line x1="100" y1="370" x2="850" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="370" x2="100" y2="95" stroke="#333" stroke-width="2"/>
  <text x="475" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2b4a">Rezidüel (kalan) enzim/protein işlevi →</text>
  <text x="60" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2b4a" transform="rotate(-90 60 235)">Fenotip şiddeti</text>
  <text x="110" y="388" font-size="11" fill="#c0392b">%0 (null)</text>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#e67e22">orta (hipomorf)</text>
  <text x="845" y="388" text-anchor="end" font-size="11" fill="#27ae60">yüksek (≈normal)</text>

  <!-- severity curve (inverse) -->
  <path d="M120 110 C 300 130, 430 230, 560 300 C 660 350, 760 362, 840 365" fill="none" stroke="#34495e" stroke-width="3"/>

  <!-- zones -->
  <circle cx="150" cy="120" r="7" fill="#c0392b"/>
  <text x="165" y="118" font-size="12" font-weight="700" fill="#c0392b">Klasik PKU</text>
  <text x="165" y="134" font-size="10" fill="#777">iki null/ağır allel → çok düşük işlev</text>

  <circle cx="470" cy="255" r="7" fill="#e67e22"/>
  <text x="485" y="253" font-size="12" font-weight="700" fill="#e67e22">Hafif PKU</text>
  <text x="485" y="269" font-size="10" fill="#777">en az bir hipomorfik allel</text>

  <circle cx="720" cy="352" r="7" fill="#27ae60"/>
  <text x="600" y="340" font-size="12" font-weight="700" fill="#27ae60">Hafif hiperfenilalaninemi</text>
  <text x="600" y="356" font-size="10" fill="#777">yeterli rezidüel işlev → hafif/tedavi gerektirmeyebilir</text>

  <!-- eşik çizgisi -->
  <line x1="100" y1="305" x2="850" y2="305" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="845" y="300" text-anchor="end" font-size="10" fill="#2980b9">klinik eşik (semptom sınırı)</text>

  <!-- compound het note -->
  <rect x="120" y="425" width="680" height="40" rx="8" fill="#eef6fb" stroke="#2980b9"/>
  <text x="135" y="443" font-size="11" font-weight="700" fill="#1a5276">Compound heterozigot kuralı:</text>
  <text x="135" y="459" font-size="11" fill="#444">Fenotipi genellikle DAHA HAFİF (rezidüel işlevi daha yüksek) allel belirler — "daha iyi allel kazanır".</text>
</svg>
