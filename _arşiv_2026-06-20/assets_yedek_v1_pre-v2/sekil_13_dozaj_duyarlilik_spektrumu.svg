<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 13 — Dozaj Duyarlılığı Spektrumu ve Onu Ölçen Metrikler</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#555">Genler, tek kopya kaybına dayanıklılık açısından bir yelpazede dizilir; popülasyon metrikleri bu yeri öngörür.</text>

  <!-- spectrum bar -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="50%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <rect x="90" y="110" width="760" height="34" rx="6" fill="url(#grad)"/>
  <text x="100" y="133" font-size="12" font-weight="700" fill="#ffffff">Tampona dayanıklı (resesif)</text>
  <text x="840" y="133" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">Doz-duyarlı (haploinsufficient)</text>
  <polygon points="855,127 875,118 875,136" fill="#c0392b"/>

  <!-- gene class labels under bar -->
  <text x="170" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#1e8449">Çoğu enzim</text>
  <text x="170" y="188" text-anchor="middle" font-size="9.5" fill="#666">yüksek rezerv; %50 yeter</text>

  <text x="470" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#b9770e">Reseptör / taşıyıcı</text>
  <text x="470" y="188" text-anchor="middle" font-size="9.5" fill="#666">ara duyarlılık</text>

  <text x="770" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">TF, kromatin, yapısal,</text>
  <text x="770" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">gelişim genleri</text>
  <text x="770" y="200" text-anchor="middle" font-size="9.5" fill="#666">stokiyometri/eşik bağımlı</text>

  <!-- metrics table region -->
  <text x="90" y="245" font-size="13" font-weight="700" fill="#1a2b4a">Bu yeri öngören popülasyon metrikleri:</text>

  <!-- pLI -->
  <rect x="90" y="260" width="240" height="92" rx="8" fill="#f8fbfe" stroke="#2980b9"/>
  <text x="105" y="282" font-size="13" font-weight="700" fill="#2471a3">pLI</text>
  <text x="105" y="302" font-size="10.5" fill="#444">LoF intoleransı olasılığı (0–1).</text>
  <text x="105" y="320" font-size="10.5" fill="#444">pLI ≥ 0,9 → güçlü HI ipucu.</text>
  <text x="105" y="342" font-size="10" fill="#888">(Karczewski ve ark., 2020)</text>

  <!-- LOEUF -->
  <rect x="350" y="260" width="240" height="92" rx="8" fill="#f8fbfe" stroke="#2980b9"/>
  <text x="365" y="282" font-size="13" font-weight="700" fill="#2471a3">LOEUF</text>
  <text x="365" y="302" font-size="10.5" fill="#444">Gözlenen/beklenen LoF üst</text>
  <text x="365" y="318" font-size="10.5" fill="#444">güven sınırı. DÜŞÜK → intoleran.</text>
  <text x="365" y="342" font-size="10" fill="#888">sürekli ölçek; pLI'den ayrıntılı</text>

  <!-- pHaplo -->
  <rect x="610" y="260" width="240" height="92" rx="8" fill="#fdf2f2" stroke="#c0392b"/>
  <text x="625" y="282" font-size="13" font-weight="700" fill="#c0392b">pHaplo</text>
  <text x="625" y="302" font-size="10.5" fill="#444">Delesyon-intoleransı olasılığı</text>
  <text x="625" y="318" font-size="10.5" fill="#444">(CNV temelli). ≥0,86 → HI.</text>
  <text x="625" y="342" font-size="10" fill="#888">(Collins ve ark., 2022)</text>

  <!-- caution -->
  <rect x="90" y="372" width="760" height="100" rx="10" fill="#fef9e7" stroke="#e67e22"/>
  <text x="108" y="396" font-size="12" font-weight="700" fill="#b9770e">⚠ Metrikleri doğru okumak:</text>
  <text x="108" y="418" font-size="11" fill="#444">• Yüksek pLI / düşük LOEUF / yüksek pHaplo → gen büyük olasılıkla HI; "tek allel kaybı patojen olabilir" hipotezini güçlendirir.</text>
  <text x="108" y="438" font-size="11" fill="#444">• Resesif LoF genleri (her iki allel gerekir) genelde "tolerant" görünür — metrik HI'ı dışlamaz, yalnızca önceliklendirir.</text>
  <text x="108" y="458" font-size="11" font-weight="700" fill="#c0392b">• Metrik GEN düzeyinde ipucudur; tek bir varyantın patojenitesini tek başına KANITLAMAZ.</text>
</svg>
