<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft16" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a2330" flood-opacity="0.12"/>
    </filter>
    <marker id="dnG" markerWidth="13" markerHeight="13" refX="5" refY="9" orient="auto">
      <path d="M0,0 L10,0 L5,10 Z" fill="#1e8449"/>
    </marker>
    <marker id="dnR" markerWidth="13" markerHeight="13" refX="5" refY="9" orient="auto">
      <path d="M0,0 L10,0 L5,10 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1a2330">Konstitütif aktivasyon: reseptörün sürekli "açık" kalması</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#5b6b7c">GoF varyant, reseptörü ligand (sinyal) olmadan da aktif tutar — örn. FGFR3, RET</text>

  <!-- ============ LEFT PANEL: NORMAL ============ -->
  <rect x="28" y="82" width="406" height="404" rx="14" fill="#f4faf6" stroke="#27ae60" stroke-width="2"/>
  <text x="231" y="110" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e8449">NORMAL — ligandla kontrollü</text>

  <!-- ligand -->
  <ellipse cx="208" cy="150" rx="15" ry="10" fill="#e67e22"/>
  <ellipse cx="254" cy="150" rx="15" ry="10" fill="#e67e22"/>
  <text x="231" y="132" text-anchor="middle" font-size="10" fill="#cf711c" font-weight="600">ligand (büyüme faktörü)</text>

  <!-- membrane band -->
  <rect x="50" y="248" width="362" height="26" fill="#d4efe0"/>
  <text x="58" y="243" font-size="8.5" fill="#7f9b8c">hücre zarı</text>

  <!-- receptor monomers (dimer) -->
  <ellipse cx="208" cy="202" rx="18" ry="25" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <ellipse cx="254" cy="202" rx="18" ry="25" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="201" y="222" width="14" height="74" fill="#27ae60"/>
  <rect x="247" y="222" width="14" height="74" fill="#27ae60"/>
  <line x1="222" y1="318" x2="240" y2="318" stroke="#27ae60" stroke-width="5"/>
  <circle cx="208" cy="318" r="18" fill="#27ae60"/>
  <circle cx="254" cy="318" r="18" fill="#27ae60"/>
  <text x="231" y="352" text-anchor="middle" font-size="9" fill="#1e8449">kinaz alanı (ölçülü)</text>
  <!-- phosphorylation marks (few) -->
  <circle cx="186" cy="302" r="8.5" fill="#f1c40f" stroke="#c9a008" stroke-width="1"/>
  <text x="186" y="305.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5a00">P</text>
  <circle cx="276" cy="302" r="8.5" fill="#f1c40f" stroke="#c9a008" stroke-width="1"/>
  <text x="276" y="305.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5a00">P</text>

  <!-- signal arrow + chip -->
  <line x1="231" y1="362" x2="231" y2="384" stroke="#1e8449" stroke-width="3" marker-end="url(#dnG)"/>
  <rect x="146" y="392" width="170" height="30" rx="15" fill="#27ae60" filter="url(#soft16)"/>
  <text x="231" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ÖLÇÜLÜ sinyal</text>
  <text x="231" y="446" text-anchor="middle" font-size="11.5" fill="#1e8449" font-weight="600">dengeli kıkırdak büyümesi</text>
  <text x="231" y="466" text-anchor="middle" font-size="9.5" font-style="italic" fill="#7f9b8c">sinyal yalnız gerektiğinde açılır</text>

  <!-- ============ RIGHT PANEL: GoF ============ -->
  <rect x="466" y="82" width="406" height="404" rx="14" fill="#fdf2f0" stroke="#e74c3c" stroke-width="2"/>
  <text x="669" y="110" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0392b">GoF — ligand olmadan sürekli açık</text>

  <!-- no ligand symbol -->
  <circle cx="612" cy="150" r="13" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="603" y1="141" x2="621" y2="159" stroke="#c0392b" stroke-width="2.4"/>
  <text x="700" y="146" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">ligand YOK</text>
  <text x="700" y="161" text-anchor="middle" font-size="9.5" fill="#c0564a">— yine de aktif</text>

  <!-- membrane band -->
  <rect x="488" y="248" width="362" height="26" fill="#f7d9d4"/>

  <!-- receptor monomers (dimer, active) -->
  <ellipse cx="646" cy="202" rx="18" ry="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="692" cy="202" rx="18" ry="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="639" y="222" width="14" height="74" fill="#e74c3c"/>
  <rect x="685" y="222" width="14" height="74" fill="#e74c3c"/>
  <line x1="660" y1="318" x2="678" y2="318" stroke="#e74c3c" stroke-width="5"/>
  <circle cx="646" cy="318" r="18" fill="#e74c3c"/>
  <circle cx="692" cy="318" r="18" fill="#e74c3c"/>
  <!-- variant stars on kinase domains -->
  <g transform="translate(646,318)"><polygon points="0,-10 2.4,-3.2 9.5,-3.1 3.8,1.2 5.9,8.1 0,4 -5.9,8.1 -3.8,1.2 -9.5,-3.1 -2.4,-3.2" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/></g>
  <g transform="translate(692,318)"><polygon points="0,-10 2.4,-3.2 9.5,-3.1 3.8,1.2 5.9,8.1 0,4 -5.9,8.1 -3.8,1.2 -9.5,-3.1 -2.4,-3.2" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/></g>
  <text x="669" y="237" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="600">★ varyant: aktivasyonu taklit eder</text>
  <!-- phosphorylation marks (many) -->
  <circle cx="618" cy="300" r="8.5" fill="#f1c40f" stroke="#c9a008" stroke-width="1"/><text x="618" y="303.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5a00">P</text>
  <circle cx="640" cy="288" r="8.5" fill="#f1c40f" stroke="#c9a008" stroke-width="1"/><text x="640" y="291.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5a00">P</text>
  <circle cx="698" cy="288" r="8.5" fill="#f1c40f" stroke="#c9a008" stroke-width="1"/><text x="698" y="291.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5a00">P</text>
  <circle cx="720" cy="300" r="8.5" fill="#f1c40f" stroke="#c9a008" stroke-width="1"/><text x="720" y="303.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5a00">P</text>

  <!-- signal arrow + chip -->
  <line x1="669" y1="362" x2="669" y2="384" stroke="#c0392b" stroke-width="4.5" marker-end="url(#dnR)"/>
  <rect x="574" y="392" width="190" height="30" rx="15" fill="#e74c3c" filter="url(#soft16)"/>
  <text x="669" y="412" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">AŞIRI ve SÜREKLİ sinyal</text>
  <text x="669" y="446" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="600">kıkırdak büyümesi baskılanır</text>
  <text x="669" y="466" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b06157">→ akondroplazi / tanatoforik displazi</text>

  <!-- footer -->
  <text x="450" y="512" text-anchor="middle" font-size="11.5" fill="#444b54">Öğreti: fazla sinyal de az sinyal kadar zararlıdır — GoF'ta sorun miktar değil, kontrolsüz/sürekli aktivitedir.</text>
  <text x="450" y="536" text-anchor="middle" font-size="10" fill="#aab2bb">Şekil 16 — Ligand-bağımlı normal aktivasyona karşı GoF konstitütif aktivasyon (Webster &amp; Donoghue, 1996)</text>
</svg>
