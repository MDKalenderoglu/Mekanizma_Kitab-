<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 8 — Okuma Çerçevesi Kuralı (DMD/distrofin örneği)</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#555">Delesyonun ÇERÇEVEYİ koruyup korumaması fenotip ağırlığını belirler (Monaco ve ark., 1988).</text>

  <!-- NORMAL -->
  <text x="40" y="92" font-size="13" font-weight="700" fill="#2c3e50">Normal: ekzonlar düzgün eklenir, çerçeve korunur</text>
  <g>
    <rect x="60" y="100" width="80" height="26" fill="#27ae60"/><text x="100" y="118" text-anchor="middle" font-size="11" fill="#fff">Ekz 1</text>
    <rect x="140" y="100" width="80" height="26" fill="#27ae60"/><text x="180" y="118" text-anchor="middle" font-size="11" fill="#fff">Ekz 2</text>
    <rect x="220" y="100" width="80" height="26" fill="#27ae60"/><text x="260" y="118" text-anchor="middle" font-size="11" fill="#fff">Ekz 3</text>
    <rect x="300" y="100" width="80" height="26" fill="#27ae60"/><text x="340" y="118" text-anchor="middle" font-size="11" fill="#fff">Ekz 4</text>
    <rect x="380" y="100" width="80" height="26" fill="#27ae60"/><text x="420" y="118" text-anchor="middle" font-size="11" fill="#fff">Ekz 5</text>
  </g>
  <text x="500" y="118" font-size="12" fill="#27ae60" font-weight="700">→ Tam, işlevsel distrofin</text>

  <line x1="40" y1="148" x2="900" y2="148" stroke="#eee" stroke-width="1.5"/>

  <!-- IN-FRAME (Becker) -->
  <text x="40" y="180" font-size="13" font-weight="700" fill="#2980b9">İN-FRAME delesyon (Ekz 3-4 çıkar, ama kalanlar çerçeveyi korur)</text>
  <g>
    <rect x="60" y="190" width="80" height="26" fill="#3498db"/><text x="100" y="208" text-anchor="middle" font-size="11" fill="#fff">Ekz 1</text>
    <rect x="140" y="190" width="80" height="26" fill="#3498db"/><text x="180" y="208" text-anchor="middle" font-size="11" fill="#fff">Ekz 2</text>
    <!-- deleted region -->
    <rect x="220" y="190" width="160" height="26" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="300" y="208" text-anchor="middle" font-size="10" fill="#c0392b">Ekz 3-4 silinmiş</text>
    <rect x="380" y="190" width="80" height="26" fill="#3498db"/><text x="420" y="208" text-anchor="middle" font-size="11" fill="#fff">Ekz 5</text>
  </g>
  <!-- joined frame ok -->
  <text x="500" y="200" font-size="11" fill="#2980b9" font-weight="700">Ekz 2 + Ekz 5 çerçeveyi korur</text>
  <text x="500" y="216" font-size="11" fill="#2980b9">→ kısa ama YARI-İŞLEVSEL protein</text>
  <rect x="500" y="225" width="360" height="26" rx="5" fill="#eaf2fb" stroke="#2980b9"/>
  <text x="680" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5276">Daha HAFİF: Becker MD</text>

  <line x1="40" y1="270" x2="900" y2="270" stroke="#eee" stroke-width="1.5"/>

  <!-- OUT-OF-FRAME (Duchenne) -->
  <text x="40" y="302" font-size="13" font-weight="700" fill="#c0392b">OUT-OF-FRAME delesyon (Ekz 3 çıkar, çerçeve kayar)</text>
  <g>
    <rect x="60" y="312" width="80" height="26" fill="#e74c3c"/><text x="100" y="330" text-anchor="middle" font-size="11" fill="#fff">Ekz 1</text>
    <rect x="140" y="312" width="80" height="26" fill="#e74c3c"/><text x="180" y="330" text-anchor="middle" font-size="11" fill="#fff">Ekz 2</text>
    <rect x="220" y="312" width="80" height="26" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="260" y="330" text-anchor="middle" font-size="10" fill="#c0392b">Ekz 3 silinmiş</text>
    <!-- shifted frame exons -->
    <rect x="300" y="312" width="80" height="26" fill="#e74c3c" transform="skewX(-12)"/>
    <rect x="380" y="312" width="80" height="26" fill="#e74c3c" transform="skewX(-12)"/>
    <text x="345" y="330" text-anchor="middle" font-size="10" fill="#fff" transform="skewX(-12)">kaymış</text>
  </g>
  <text x="510" y="322" font-size="11" fill="#c0392b" font-weight="700">Ekz 2 + Ekz 4 çerçeveyi BOZAR</text>
  <text x="510" y="338" font-size="11" fill="#c0392b">→ erken stop → truncated/işlevsiz</text>
  <rect x="510" y="347" width="360" height="26" rx="5" fill="#fdecea" stroke="#c0392b"/>
  <text x="690" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#922b21">Daha AĞIR: Duchenne MD</text>

  <text x="470" y="408" text-anchor="middle" font-size="12" font-style="italic" fill="#555">Öğreti: Aynı gen, benzer "delesyon" — ama in-frame vs out-of-frame ayrımı fenotipi kökten değiştirir.</text>
  <text x="470" y="432" text-anchor="middle" font-size="11" fill="#777">Bu mantık ekzon-atlama (exon-skipping) tedavilerinin de temelidir: out-of-frame'i in-frame'e çevirmek.</text>
  <text x="470" y="455" text-anchor="middle" font-size="10" fill="#999">Kaynak: Monaco AP ve ark., Genomics 1988</text>
</svg>
