<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a2330" flood-opacity="0.12"/>
    </filter>
    <marker id="arrR17" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrL17" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2471a3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2330">Aynı gen, iki yön: GoF ve LoF farklı hastalık yapar</text>
  <text x="450" y="66" text-anchor="middle" font-size="13.5" fill="#5b6b7c">Varyantın yönü (kazanım mı, kayıp mı) hem hastalığı hem tedaviyi belirler</text>

  <!-- ============ ROW 1: RET (yc=170) ============ -->
  <!-- LoF disease (left) -->
  <rect x="24" y="140" width="178" height="62" rx="11" fill="#eaf3fb" stroke="#2471a3" stroke-width="1.6" filter="url(#soft)"/>
  <text x="113" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f5c8b">Hirschsprung hastalığı</text>
  <text x="113" y="186" text-anchor="middle" font-size="10" fill="#4a7ba6">gelişim defekti (gangliyon yok)</text>

  <!-- gene capsule (center) -->
  <rect x="382" y="138" width="136" height="66" rx="33" fill="#eef1f5" stroke="#7f8c9b" stroke-width="1.8" filter="url(#soft)"/>
  <text x="450" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">RET</text>
  <text x="450" y="187" text-anchor="middle" font-size="9.5" fill="#7f8c9b">reseptör tirozin kinaz</text>

  <!-- GoF disease (right) -->
  <rect x="698" y="140" width="178" height="62" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" filter="url(#soft)"/>
  <text x="787" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a93226">MEN2 — kanser sendromu</text>
  <text x="787" y="186" text-anchor="middle" font-size="9.5" fill="#c0564a">medüller tiroid Ca, feokromositoma</text>

  <!-- LoF arrow (center -> left) -->
  <text x="292" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#2471a3">LoF — işlev kaybı</text>
  <line x1="378" y1="174" x2="210" y2="174" stroke="#2471a3" stroke-width="2.4" marker-end="url(#arrL17)"/>
  <!-- GoF arrow (center -> right) -->
  <text x="608" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">GoF — konstitütif aktivasyon</text>
  <line x1="522" y1="174" x2="690" y2="174" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR17)"/>

  <!-- divider -->
  <line x1="60" y1="240" x2="840" y2="240" stroke="#e7ebf0" stroke-width="1.5"/>

  <!-- ============ ROW 2: SCN2A (yc=320) ============ -->
  <rect x="24" y="290" width="178" height="62" rx="11" fill="#eaf3fb" stroke="#2471a3" stroke-width="1.6" filter="url(#soft)"/>
  <text x="113" y="317" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f5c8b">Geç başlangıç / otizm</text>
  <text x="113" y="336" text-anchor="middle" font-size="10" fill="#4a7ba6">Na-kanal blokerinden kaçın</text>

  <rect x="382" y="288" width="136" height="66" rx="33" fill="#eef1f5" stroke="#7f8c9b" stroke-width="1.8" filter="url(#soft)"/>
  <text x="450" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#2c3e50">SCN2A</text>
  <text x="450" y="337" text-anchor="middle" font-size="9.5" fill="#7f8c9b">nöron Na⁺ kanalı (NaV1.2)</text>

  <rect x="698" y="290" width="178" height="62" rx="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" filter="url(#soft)"/>
  <text x="787" y="317" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a93226">Erken (&lt;3 ay) epilepsi</text>
  <text x="787" y="336" text-anchor="middle" font-size="9.5" fill="#c0564a">Na-kanal blokerine iyi yanıt</text>

  <text x="292" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#2471a3">LoF — kanal akımı azalır</text>
  <line x1="378" y1="324" x2="210" y2="324" stroke="#2471a3" stroke-width="2.4" marker-end="url(#arrL17)"/>
  <text x="608" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">GoF — kanal aşırı akım</text>
  <line x1="522" y1="324" x2="690" y2="324" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR17)"/>

  <!-- ============ insight box ============ -->
  <rect x="70" y="392" width="760" height="112" rx="13" fill="#fef8e9" stroke="#e29b3c" stroke-width="1.8" filter="url(#soft)"/>
  <text x="450" y="422" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c87f1a">Klinik sonuç: yön = tedavi yönü</text>
  <text x="450" y="450" text-anchor="middle" font-size="12.5" fill="#4a5460">Aynı genin GoF ve LoF varyantları zıt yönde işlev değişikliği yapar → zıt fenotip ve zıt tedavi.</text>
  <text x="450" y="474" text-anchor="middle" font-size="12.5" fill="#4a5460">SCN2A'da GoF için Na-kanal blokeri yararlı; LoF için aynı ilaç zararlı olabilir.</text>
  <text x="450" y="495" text-anchor="middle" font-size="11" font-style="italic" fill="#8a939e">Bu yüzden rapor yalnız "patojen" dememeli, varyantın yönünü (GoF/LoF) belirtmelidir.</text>

  <text x="450" y="534" text-anchor="middle" font-size="10.5" fill="#7a8492">Kaynaklar: RET — Edery ve ark. (1997); SCN2A — Berecki ve ark. (2018), Brunklaus ve ark. (2020)</text>
  <text x="450" y="558" text-anchor="middle" font-size="10" fill="#aab2bb">Şekil 17 — Aynı genin GoF ve LoF varyantları zıt fenotip ve zıt tedavi gerektirir</text>
</svg>
