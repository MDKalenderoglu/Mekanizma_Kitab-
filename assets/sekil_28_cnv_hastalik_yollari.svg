<svg viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="920" height="500" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">CNV/yapısal varyant hastalığı nasıl yapar? — beş yol</text>
  <text x="460" y="48" text-anchor="middle" font-size="10.5" fill="#64748B">Sorun yalnız "kaç kopya" değildir; konum ve bağlam da hastalık yaratır</text>

  <!-- Route 1 -->
  <rect x="30" y="62" width="860" height="62" rx="9" fill="#FFFBEB" stroke="#FCE8B6" stroke-width="1.3"/>
  <circle cx="58" cy="93" r="13" fill="#1A2B4A"/><text x="58" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="84" y="88" font-size="11.5" font-weight="700" fill="#B45309">Dozaj etkisi (en sık)</text>
  <text x="84" y="105" font-size="9.5" fill="#2E3440">delesyon → %50 (haploinsufficiency) · duplikasyon → %150 (artmış doz)</text>
  <rect x="650" y="74" width="226" height="38" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.3"/>
  <text x="763" y="91" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B45309">doz-bağımlı hastalık</text>
  <text x="763" y="105" text-anchor="middle" font-size="8.5" fill="#92742a">Bölüm 3 (HI) · Bölüm 4 (artmış doz)</text>

  <!-- Route 2 -->
  <rect x="30" y="132" width="860" height="62" rx="9" fill="#EFF4FB" stroke="#BFD3EE" stroke-width="1.3"/>
  <circle cx="58" cy="163" r="13" fill="#1A2B4A"/><text x="58" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="84" y="158" font-size="11.5" font-weight="700" fill="#1D4ED8">Gen kesintisi (disruption)</text>
  <text x="84" y="175" font-size="9.5" fill="#2E3440">kırılma noktası bir genin ortasından geçer → gen bölünür</text>
  <rect x="650" y="144" width="226" height="38" rx="7" fill="#ffffff" stroke="#2563EB" stroke-width="1.3"/>
  <text x="763" y="161" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">işlev kaybı (LoF)</text>
  <text x="763" y="175" text-anchor="middle" font-size="8.5" fill="#2456c9">dengeli SV'de bile olabilir · Bölüm 2</text>

  <!-- Route 3 -->
  <rect x="30" y="202" width="860" height="62" rx="9" fill="#FFFBEB" stroke="#FCE8B6" stroke-width="1.3"/>
  <circle cx="58" cy="233" r="13" fill="#1A2B4A"/><text x="58" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="84" y="228" font-size="11.5" font-weight="700" fill="#B45309">Gen füzyonu</text>
  <text x="84" y="245" font-size="9.5" fill="#2E3440">iki gen uç uca birleşir → kimerik (melez) protein</text>
  <rect x="650" y="214" width="226" height="38" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.3"/>
  <text x="763" y="231" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B45309">neomorfik / GoF</text>
  <text x="763" y="245" text-anchor="middle" font-size="8.5" fill="#92742a">yeni aktivite · Bölüm 6</text>

  <!-- Route 4 -->
  <rect x="30" y="272" width="860" height="62" rx="9" fill="#FFFBEB" stroke="#FCE8B6" stroke-width="1.3"/>
  <circle cx="58" cy="303" r="13" fill="#1A2B4A"/><text x="58" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="84" y="298" font-size="11.5" font-weight="700" fill="#B45309">Pozisyon etkisi / TAD bozulması</text>
  <text x="84" y="315" font-size="9.5" fill="#2E3440">sınır bozulur → enhancer yanlış gene bağlanır ("enhancer hijacking")</text>
  <rect x="650" y="284" width="226" height="38" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.3"/>
  <text x="763" y="301" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B45309">uygunsuz gen ifadesi</text>
  <text x="763" y="315" text-anchor="middle" font-size="8.5" fill="#92742a">kodlama-dışı SV · Bölüm 13</text>

  <!-- Route 5 -->
  <rect x="30" y="342" width="860" height="62" rx="9" fill="#EFF4FB" stroke="#BFD3EE" stroke-width="1.3"/>
  <circle cx="58" cy="373" r="13" fill="#1A2B4A"/><text x="58" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="84" y="368" font-size="11.5" font-weight="700" fill="#1D4ED8">Resesif maskenin kalkması</text>
  <text x="84" y="385" font-size="9.5" fill="#2E3440">delesyon, karşı alleldeki gizli resesif varyantı açığa çıkarır (unmasking)</text>
  <rect x="650" y="354" width="226" height="38" rx="7" fill="#ffffff" stroke="#2563EB" stroke-width="1.3"/>
  <text x="763" y="371" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">resesif hastalık ortaya çıkar</text>
  <text x="763" y="385" text-anchor="middle" font-size="8.5" fill="#2456c9">tek delesyon + karşı varyant</text>

  <!-- footer -->
  <text x="460" y="430" text-anchor="middle" font-size="10.5" fill="#2E3440">Öğreti: aynı boyutta bir CNV, içerdiği gene ve konuma göre zararsız da olabilir, ağır hastalık da yapabilir.</text>
  <text x="460" y="449" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">Yorumda anahtar soru: CNV hangi doz-duyarlı geni veya düzenleyici sınırı etkiliyor? (→ Şekil 29 ve dozaj puanlama)</text>
</svg>
