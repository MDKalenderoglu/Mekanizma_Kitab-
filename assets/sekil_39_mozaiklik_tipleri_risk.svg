<svg viewBox="0 0 900 525" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="525" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 12.2 — Mozaiklik tipleri ve tekrarlanma riski: hangi bölme tutulmuş?</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Tekrarlanma riskini belirleyen, varyantın hastada bulunup bulunmaması değil; germ hücrelerinde bulunup bulunmamasıdır.</text>

  <!-- ============ PANEL A — SOMATİK ============ -->
  <rect x="40" y="80" width="266" height="306" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#B91C1C">Somatik mozaiklik</text>
  <text x="58" y="124" font-size="9.5" fill="#64748B">Varyant yalnız vücut hücrelerinde</text>

  <rect x="58" y="142" width="230" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="173" y="161" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">SOMATİK DOKULAR</text>
  <text x="173" y="177" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">varyant VAR</text>

  <rect x="58" y="194" width="230" height="44" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="173" y="213" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">GERM HÜCRELERİ</text>
  <text x="173" y="229" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">varyant YOK</text>

  <line x1="58" y1="252" x2="288" y2="252" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="58" y="272" font-size="9.5" fill="#64748B">Hastada bulgu?</text>
  <text x="288" y="272" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">VAR (segmental)</text>
  <text x="58" y="294" font-size="9.5" fill="#64748B">Kanda saptanır mı?</text>
  <text x="288" y="294" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">Dokuya bağlı</text>
  <text x="58" y="316" font-size="9.5" fill="#64748B">Tipik örnek</text>
  <text x="288" y="316" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">Proteus, MAS</text>

  <rect x="58" y="330" width="230" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="173" y="347" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">TEKRARLANMA RİSKİ</text>
  <text x="173" y="362" font-size="10" font-weight="700" fill="#1A2B4A" text-anchor="middle">≈ popülasyon riski (çok düşük)</text>

  <!-- ============ PANEL B — GERMLINE ============ -->
  <rect x="317" y="80" width="266" height="306" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="329" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="339" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="357" y="105" font-size="13" font-weight="700" fill="#B91C1C">Germline mozaiklik</text>
  <text x="335" y="124" font-size="9.5" fill="#64748B">(gonadal) Varyant yalnız germ hücrelerinde</text>

  <rect x="335" y="142" width="230" height="44" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="450" y="161" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">SOMATİK DOKULAR</text>
  <text x="450" y="177" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">varyant YOK</text>

  <rect x="335" y="194" width="230" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="450" y="213" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">GERM HÜCRELERİ</text>
  <text x="450" y="229" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">varyant VAR</text>

  <line x1="335" y1="252" x2="565" y2="252" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="335" y="272" font-size="9.5" fill="#64748B">Hastada bulgu?</text>
  <text x="565" y="272" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="end">YOK — sağlıklı</text>
  <text x="335" y="294" font-size="9.5" fill="#64748B">Kanda saptanır mı?</text>
  <text x="565" y="294" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="end">HAYIR</text>
  <text x="335" y="316" font-size="9.5" fill="#64748B">Tipik örnek</text>
  <text x="565" y="316" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">Yineleyen "de novo" OI</text>

  <rect x="335" y="330" width="230" height="40" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="450" y="347" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">TEKRARLANMA RİSKİ</text>
  <text x="450" y="362" font-size="10" font-weight="700" fill="#1A2B4A" text-anchor="middle">ARTMIŞ — germ hücre oranına bağlı</text>

  <!-- ============ PANEL C — GONOZOMAL ============ -->
  <rect x="594" y="80" width="266" height="306" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="606" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="616" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="634" y="105" font-size="13" font-weight="700" fill="#B91C1C">Gonozomal mozaiklik</text>
  <text x="612" y="124" font-size="9.5" fill="#64748B">Varyant hem somatik hem germ hücrelerinde</text>

  <rect x="612" y="142" width="230" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="727" y="161" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">SOMATİK DOKULAR</text>
  <text x="727" y="177" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">varyant VAR</text>

  <rect x="612" y="194" width="230" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="727" y="213" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">GERM HÜCRELERİ</text>
  <text x="727" y="229" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">varyant VAR</text>

  <line x1="612" y1="252" x2="842" y2="252" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="612" y="272" font-size="9.5" fill="#64748B">Hastada bulgu?</text>
  <text x="842" y="272" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">VAR (sıklıkla hafif)</text>
  <text x="612" y="294" font-size="9.5" fill="#64748B">Kanda saptanır mı?</text>
  <text x="842" y="294" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">Sıklıkla evet (düşük VAF)</text>
  <text x="612" y="316" font-size="9.5" fill="#64748B">Tipik örnek</text>
  <text x="842" y="316" font-size="9.5" font-weight="700" fill="#2E3440" text-anchor="end">Segmental NF2</text>

  <rect x="612" y="330" width="230" height="40" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="727" y="347" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">TEKRARLANMA RİSKİ</text>
  <text x="727" y="362" font-size="10" font-weight="700" fill="#1A2B4A" text-anchor="middle">ARTMIŞ + hastada da bulgu var</text>

  <!-- ============ ALT BANT ============ -->
  <rect x="40" y="400" width="820" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="421" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Klinik kilit nokta: Sağlıklı bir ebeveyn, kanında hiçbir varyant saptanmasa bile germline mozaik olabilir.</text>
  <text x="450" y="440" font-size="10.5" fill="#2E3440" text-anchor="middle">Bu yüzden "de novo" denen bir varyantta bile tekrarlanma riski asla sıfır değildir.</text>

  <text x="40" y="478" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Mozaiklikte iki ayrı soru vardır ve karıştırılmamalıdır — "hastanın fenotipini ne açıklıyor?" (somatik bölme) ve "kardeşe tekrar eder mi?"</text>
  <text x="40" y="494" font-size="11.5" font-style="italic" fill="#475569">(germ hücre bölmesi). Bir hastada varyantın kanda görülmemesi, ebeveynin germline'ının temiz olduğunu göstermez.</text>
  <text x="860" y="512" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Campbell ve ark. (2014); Biesecker &amp; Spinner (2013)</text>
</svg>
