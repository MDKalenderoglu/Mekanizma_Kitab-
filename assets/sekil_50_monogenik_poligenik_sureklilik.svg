<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <defs>
    <linearGradient id="s46grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 15.1 — Monogenikten poligeniğe: tek bir süreklilik, dört durak</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Katkıda bulunan lokus sayısı arttıkça her bir lokusun etki büyüklüğü azalır; kalıtım Mendel oranlarından uzaklaşır.</text>

  <!-- ================= PANEL A: süreklilik ================= -->
  <rect x="40" y="80" width="820" height="242" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">Dört durak — aynı eksende, keskin sınır yok</text>

  <!-- Sütunlar -->
  <rect x="58" y="126" width="188" height="128" rx="10" fill="#FEF6F5" stroke="#B91C1C" stroke-width="1.6"/>
  <text x="152" y="146" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">MONOGENİK</text>
  <text x="152" y="164" font-size="9.5" fill="#64748B" text-anchor="middle">1 lokus</text>
  <circle cx="152" cy="188" r="17" fill="#B91C1C"/>
  <text x="152" y="212" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">Etki: çok büyük</text>
  <text x="152" y="228" font-size="9" fill="#2E3440" text-anchor="middle">Mendel oranları geçerli</text>
  <text x="152" y="244" font-size="9" fill="#2E3440" text-anchor="middle">Risk hesaplanabilir</text>

  <rect x="256" y="126" width="188" height="128" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"/>
  <text x="350" y="146" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">DİGENİK</text>
  <text x="350" y="164" font-size="9.5" fill="#64748B" text-anchor="middle">2 lokus — ikisi de gerekli</text>
  <circle cx="335" cy="188" r="13" fill="#B91C1C"/>
  <circle cx="365" cy="188" r="13" fill="#B91C1C"/>
  <text x="350" y="212" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">Etki: büyük (birlikte)</text>
  <text x="350" y="228" font-size="9" fill="#2E3440" text-anchor="middle">Tek başına hiçbiri yetmez</text>
  <text x="350" y="244" font-size="9" fill="#2E3440" text-anchor="middle">Mendel oranı VERMEZ</text>

  <rect x="454" y="126" width="188" height="128" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="548" y="146" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">OLİGOGENİK</text>
  <text x="548" y="164" font-size="9.5" fill="#64748B" text-anchor="middle">birkaç lokus (± modifier)</text>
  <circle cx="522" cy="188" r="11" fill="#D97706"/>
  <circle cx="548" cy="188" r="9" fill="#D97706"/>
  <circle cx="572" cy="188" r="7" fill="#D97706"/>
  <text x="548" y="212" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">Etki: orta, eşitsiz</text>
  <text x="548" y="228" font-size="9" fill="#2E3440" text-anchor="middle">Bir "ana" lokus + katkılar</text>
  <text x="548" y="244" font-size="9" fill="#2E3440" text-anchor="middle">Eksik penetrans tipiktir</text>

  <rect x="652" y="126" width="190" height="128" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="747" y="146" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">POLİGENİK</text>
  <text x="747" y="164" font-size="9.5" fill="#64748B" text-anchor="middle">yüzlerce–binlerce lokus</text>
  <g fill="#2563EB">
    <circle cx="700" cy="184" r="4"/><circle cx="716" cy="190" r="4"/><circle cx="732" cy="182" r="4"/>
    <circle cx="748" cy="192" r="4"/><circle cx="764" cy="184" r="4"/><circle cx="780" cy="190" r="4"/>
    <circle cx="708" cy="198" r="4"/><circle cx="740" cy="198" r="4"/><circle cx="772" cy="198" r="4"/>
  </g>
  <text x="747" y="212" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">Etki: her biri çok küçük</text>
  <text x="747" y="228" font-size="9" fill="#2E3440" text-anchor="middle">Toplam yük belirleyici</text>
  <text x="747" y="244" font-size="9" fill="#2E3440" text-anchor="middle">Ampirik risk kullanılır</text>

  <!-- Gradyan ok -->
  <rect x="58" y="268" width="784" height="10" rx="5" fill="url(#s46grad)"/>
  <text x="58" y="294" font-size="10" font-weight="700" fill="#B91C1C">◀ lokus başına etki BÜYÜK · sayı AZ</text>
  <text x="842" y="294" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="end">lokus başına etki KÜÇÜK · sayı ÇOK ▶</text>
  <text x="450" y="312" font-size="9.5" font-style="italic" fill="#64748B" text-anchor="middle">Bu duraklar arasında keskin bir biyolojik sınır yoktur; ayrım pratik ve tanısaldır.</text>

  <!-- ================= PANEL B: eşik / yük modeli ================= -->
  <rect x="40" y="338" width="410" height="196" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="348" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="363" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="80" y="363" font-size="13" font-weight="700" fill="#2563EB">Eşik (yük) modeli</text>

  <!-- taban -->
  <line x1="70" y1="482" x2="424" y2="482" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- Birey 1: tek büyük blok -->
  <rect x="86" y="392" width="46" height="90" rx="4" fill="#B91C1C"/>
  <text x="109" y="443" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">tek</text>
  <text x="109" y="384" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">✓</text>
  <text x="109" y="498" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">Birey 1</text>
  <text x="109" y="510" font-size="8.5" fill="#94A3B8" text-anchor="middle">tek büyük etkili</text>

  <!-- Birey 2: 4 orta blok -->
  <rect x="174" y="460" width="46" height="22" rx="3" fill="#D97706"/>
  <rect x="174" y="436" width="46" height="22" rx="3" fill="#D97706" opacity="0.88"/>
  <rect x="174" y="412" width="46" height="22" rx="3" fill="#D97706" opacity="0.76"/>
  <rect x="174" y="388" width="46" height="22" rx="3" fill="#D97706" opacity="0.64"/>
  <text x="197" y="380" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">✓</text>
  <text x="197" y="498" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">Birey 2</text>
  <text x="197" y="510" font-size="8.5" fill="#94A3B8" text-anchor="middle">birkaç orta etkili</text>

  <!-- Birey 3: 3 küçük blok (eşiğin altında) -->
  <rect x="262" y="466" width="46" height="16" rx="3" fill="#2563EB"/>
  <rect x="262" y="448" width="46" height="16" rx="3" fill="#2563EB" opacity="0.85"/>
  <rect x="262" y="430" width="46" height="16" rx="3" fill="#2563EB" opacity="0.7"/>
  <text x="285" y="422" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">✗</text>
  <text x="285" y="498" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">Birey 3</text>
  <text x="285" y="510" font-size="8.5" fill="#94A3B8" text-anchor="middle">az sayıda küçük</text>

  <!-- Birey 4: 6 küçük blok -->
  <rect x="350" y="468" width="46" height="14" rx="3" fill="#2563EB"/>
  <rect x="350" y="452" width="46" height="14" rx="3" fill="#2563EB" opacity="0.9"/>
  <rect x="350" y="436" width="46" height="14" rx="3" fill="#2563EB" opacity="0.8"/>
  <rect x="350" y="420" width="46" height="14" rx="3" fill="#2563EB" opacity="0.7"/>
  <rect x="350" y="404" width="46" height="14" rx="3" fill="#2563EB" opacity="0.6"/>
  <rect x="350" y="388" width="46" height="14" rx="3" fill="#2563EB" opacity="0.5"/>
  <text x="373" y="380" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">✓</text>
  <text x="373" y="498" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">Birey 4</text>
  <text x="373" y="510" font-size="8.5" fill="#94A3B8" text-anchor="middle">çok sayıda küçük</text>

  <!-- eşik çizgisi (blokların ÜSTÜNE çizilir) -->
  <line x1="70" y1="398" x2="424" y2="398" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="288" y="377" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">HASTALIK EŞİĞİ</text>

  <text x="56" y="526" font-size="9.5" fill="#475569">Aynı eşiğe farklı yollardan ulaşılır: tek büyük etkiyle ya da çok sayıda küçük katkının toplamıyla.</text>

  <!-- ================= PANEL C: köprü ================= -->
  <rect x="460" y="338" width="400" height="196" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="472" y="348" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="482" y="363" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="500" y="363" font-size="13" font-weight="700" fill="#2563EB">Klinikte ne değişir?</text>

  <rect x="476" y="378" width="368" height="42" rx="8" fill="#FEF6F5" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="488" y="395" font-size="10.5" font-weight="700" fill="#B91C1C">Tekrarlanma riski</text>
  <text x="488" y="410" font-size="9.5" fill="#2E3440">Mendel oranı (%25/%50) yerine ampirik/aile-özgü risk gerekir.</text>

  <rect x="476" y="426" width="368" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="488" y="443" font-size="10.5" font-weight="700" fill="#B45309">Penetrans</text>
  <text x="488" y="458" font-size="9.5" fill="#2E3440">Aynı varyantı taşıyan akraba sağlıklı olabilir → "taşıyıcı ≠ hasta".</text>

  <rect x="476" y="474" width="368" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="488" y="491" font-size="10.5" font-weight="700" fill="#1D4ED8">Varyant yorumu</text>
  <text x="488" y="506" font-size="9.5" fill="#2E3440">ACMG tek-lokus varsayar; ikinci lokus "ek bulgu" olarak sıkışır.</text>

  <text x="40" y="558" font-size="11.5" font-style="italic" fill="#475569">Öğreti: "Monogenik" ile "kompleks" iki ayrı dünya değil, tek bir eksenin iki ucudur. Bir hastalığı bu eksende nereye koyduğunuz, aileye vereceğiniz riski,</text>
  <text x="40" y="574" font-size="11.5" font-style="italic" fill="#475569">bekleyeceğiniz penetransı ve varyantı nasıl yorumlayacağınızı doğrudan belirler.</text>
  <text x="860" y="592" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Schäffer (2013); Katsanis ve ark. (2001)</text>
</svg>
