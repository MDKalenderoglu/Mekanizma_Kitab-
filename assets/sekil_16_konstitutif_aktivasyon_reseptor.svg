<svg viewBox="0 0 900 512" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft16b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="dnN" markerWidth="13" markerHeight="13" refX="5" refY="9" orient="auto"><path d="M0,0 L10,0 L5,10 Z" fill="#475569"/></marker>
    <marker markerUnits="userSpaceOnUse" id="dnR16" markerWidth="13" markerHeight="13" refX="5" refY="9" orient="auto"><path d="M0,0 L10,0 L5,10 Z" fill="#B91C1C"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="512" fill="#ffffff"/>

  <!-- ===== LEFT PANEL : NORMAL (slate) ===== -->
  <rect x="24" y="30" width="410" height="442" rx="13" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="36" y="42" width="22" height="22" rx="4" fill="#1A2B4A"/><text x="47" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">A</text>
  <text x="240" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">NORMAL — ligandla kontrollü</text>

  <!-- ligand -->
  <ellipse cx="206" cy="98" rx="14" ry="9.5" fill="#1A2B4A"/>
  <ellipse cx="252" cy="98" rx="14" ry="9.5" fill="#1A2B4A"/>
  <text x="229" y="83" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">ligand (büyüme faktörü)</text>

  <!-- membrane -->
  <rect x="46" y="226" width="366" height="24" fill="#E2E8F0"/>
  <text x="54" y="221" font-size="8.5" fill="#94A3B8">hücre zarı</text>

  <!-- receptor (dimer) -->
  <ellipse cx="206" cy="170" rx="17" ry="24" fill="#64748B"/>
  <ellipse cx="252" cy="170" rx="17" ry="24" fill="#64748B"/>
  <rect x="199" y="190" width="14" height="72" fill="#64748B"/>
  <rect x="245" y="190" width="14" height="72" fill="#64748B"/>
  <line x1="220" y1="286" x2="238" y2="286" stroke="#64748B" stroke-width="5"/>
  <circle cx="206" cy="286" r="17" fill="#64748B"/>
  <circle cx="252" cy="286" r="17" fill="#64748B"/>
  <text x="229" y="318" text-anchor="middle" font-size="9" fill="#475569">kinaz alanı (ölçülü)</text>
  <!-- P marks (few) -->
  <circle cx="185" cy="272" r="8" fill="#D97706"/><text x="185" y="275.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">P</text>
  <circle cx="273" cy="272" r="8" fill="#D97706"/><text x="273" y="275.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">P</text>

  <!-- signal -->
  <line x1="229" y1="328" x2="229" y2="350" stroke="#475569" stroke-width="3" marker-end="url(#dnN)"/>
  <rect x="146" y="358" width="166" height="28" rx="14" fill="#64748B" filter="url(#soft16b)"/>
  <text x="229" y="377" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">ÖLÇÜLÜ sinyal</text>
  <text x="229" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">dengeli kıkırdak büyümesi</text>
  <text x="229" y="431" text-anchor="middle" font-size="9.5" font-style="italic" fill="#94A3B8">sinyal yalnız gerektiğinde açılır</text>

  <!-- ===== RIGHT PANEL : GoF (red) ===== -->
  <rect x="466" y="30" width="410" height="442" rx="13" fill="#FEF6F5" stroke="#F2C9C4" stroke-width="1.5"/>
  <rect x="478" y="42" width="22" height="22" rx="4" fill="#1A2B4A"/><text x="489" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">B</text>
  <text x="682" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C">GoF — ligand olmadan sürekli açık</text>

  <!-- no ligand -->
  <circle cx="624" cy="98" r="12" fill="#ffffff" stroke="#B91C1C" stroke-width="2.2"/>
  <line x1="615.5" y1="89.5" x2="632.5" y2="106.5" stroke="#B91C1C" stroke-width="2.2"/>
  <text x="712" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">ligand YOK</text>
  <text x="712" y="108" text-anchor="middle" font-size="9" fill="#a02020">— yine de aktif</text>

  <!-- membrane -->
  <rect x="488" y="226" width="366" height="24" fill="#F6DBD7"/>

  <!-- receptor (dimer, active) -->
  <ellipse cx="648" cy="170" rx="17" ry="24" fill="#B91C1C"/>
  <ellipse cx="694" cy="170" rx="17" ry="24" fill="#B91C1C"/>
  <rect x="641" y="190" width="14" height="72" fill="#B91C1C"/>
  <rect x="687" y="190" width="14" height="72" fill="#B91C1C"/>
  <line x1="662" y1="286" x2="680" y2="286" stroke="#B91C1C" stroke-width="5"/>
  <circle cx="648" cy="286" r="17" fill="#B91C1C"/>
  <circle cx="694" cy="286" r="17" fill="#B91C1C"/>
  <!-- variant stars -->
  <g transform="translate(648,286)"><polygon points="0,-9 2.2,-2.9 8.6,-2.8 3.4,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.4,1.1 -8.6,-2.8 -2.2,-2.9" fill="#FCD34D" stroke="#92400E" stroke-width="0.9"/></g>
  <g transform="translate(694,286)"><polygon points="0,-9 2.2,-2.9 8.6,-2.8 3.4,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.4,1.1 -8.6,-2.8 -2.2,-2.9" fill="#FCD34D" stroke="#92400E" stroke-width="0.9"/></g>
  <text x="660" y="136" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B91C1C">★ varyant: aktivasyonu taklit eder</text>
  <!-- P marks (many) -->
  <circle cx="620" cy="272" r="8" fill="#D97706"/><text x="620" y="275.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">P</text>
  <circle cx="642" cy="260" r="8" fill="#D97706"/><text x="642" y="263.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">P</text>
  <circle cx="700" cy="260" r="8" fill="#D97706"/><text x="700" y="263.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">P</text>
  <circle cx="722" cy="272" r="8" fill="#D97706"/><text x="722" y="275.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">P</text>

  <!-- signal -->
  <line x1="671" y1="328" x2="671" y2="350" stroke="#B91C1C" stroke-width="4.5" marker-end="url(#dnR16)"/>
  <rect x="576" y="358" width="190" height="28" rx="14" fill="#B91C1C" filter="url(#soft16b)"/>
  <text x="671" y="377" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">AŞIRI ve SÜREKLİ sinyal</text>
  <text x="671" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#B91C1C">kıkırdak büyümesi baskılanır</text>
  <text x="671" y="431" text-anchor="middle" font-size="9.5" font-style="italic" fill="#a86b62">→ akondroplazi / tanatoforik displazi</text>

  <!-- footer teaching line -->
  <text x="450" y="494" text-anchor="middle" font-size="11.5" fill="#2E3440">Öğreti: fazla sinyal de az sinyal kadar zararlıdır — GoF'ta sorun miktar değil, kontrolsüz/sürekli aktivitedir.</text>
</svg>
