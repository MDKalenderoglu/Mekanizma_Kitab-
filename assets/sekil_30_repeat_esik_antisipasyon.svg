<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft30" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="aR30" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#B45309"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">Tekrar genişlemesi: eşik, kararsızlık ve antisipasyon</text>

  <!-- zone bar -->
  <text x="60" y="84" font-size="10.5" font-weight="700" fill="#1A2B4A">Tekrar sayısı zonları</text>
  <text x="60" y="98" font-size="8.5" fill="#64748B">(temsilî; FMR1 CGG)</text>
  <rect x="240" y="74" width="150" height="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="315" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">Normal</text>
  <rect x="390" y="74" width="110" height="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="445" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Ara</text>
  <rect x="500" y="74" width="150" height="30" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="575" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">Premutasyon</text>
  <rect x="650" y="74" width="190" height="30" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
  <text x="745" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">Tam mutasyon</text>
  <!-- ranges -->
  <text x="315" y="120" text-anchor="middle" font-size="8.5" fill="#64748B">~&lt;45</text>
  <text x="445" y="120" text-anchor="middle" font-size="8.5" fill="#64748B">~45–54</text>
  <text x="575" y="120" text-anchor="middle" font-size="8.5" fill="#92742a">~55–200</text>
  <text x="745" y="120" text-anchor="middle" font-size="8.5" fill="#a02020">&gt;200</text>
  <!-- threshold marker -->
  <line x1="650" y1="66" x2="650" y2="126" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="650" y="60" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B91C1C">hastalık eşiği</text>
  <!-- instability arrow -->
  <line x1="240" y1="140" x2="820" y2="140" stroke="#B45309" stroke-width="2" marker-end="url(#aR30)"/>
  <text x="530" y="156" text-anchor="middle" font-size="9.5" font-style="italic" fill="#92742a">kararsızlık (nesilden nesile genişleme eğilimi) artar →</text>

  <!-- anticipation -->
  <text x="460" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2B4A">Antisipasyon: tekrar büyüdükçe başlangıç erken, seyir ağır</text>

  <!-- Gen I -->
  <rect x="60" y="210" width="230" height="120" rx="11" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4" filter="url(#soft30)"/>
  <text x="175" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Nesil I</text>
  <text x="175" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#92742a">~60 tekrar (premutasyon)</text>
  <text x="175" y="286" text-anchor="middle" font-size="10" fill="#2E3440">çoğunlukla etkilenmemiş /</text>
  <text x="175" y="302" text-anchor="middle" font-size="10" fill="#2E3440">geç ve hafif (taşıyıcı)</text>

  <!-- Gen II -->
  <rect x="345" y="210" width="230" height="120" rx="11" fill="#FCE4C0" stroke="#D97706" stroke-width="1.6" filter="url(#soft30)"/>
  <text x="460" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Nesil II</text>
  <text x="460" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">~120 tekrar</text>
  <text x="460" y="286" text-anchor="middle" font-size="10" fill="#2E3440">daha erken başlangıç,</text>
  <text x="460" y="302" text-anchor="middle" font-size="10" fill="#2E3440">orta şiddet</text>

  <!-- Gen III -->
  <rect x="630" y="210" width="230" height="120" rx="11" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6" filter="url(#soft30)"/>
  <text x="745" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">Nesil III</text>
  <text x="745" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#B91C1C">&gt;200 tekrar (tam)</text>
  <text x="745" y="286" text-anchor="middle" font-size="10" fill="#2E3440">erken başlangıç,</text>
  <text x="745" y="302" text-anchor="middle" font-size="10" fill="#2E3440">ağır fenotip</text>

  <!-- arrows between gens -->
  <line x1="294" y1="270" x2="341" y2="270" stroke="#B45309" stroke-width="2.4" marker-end="url(#aR30)"/>
  <line x1="579" y1="270" x2="626" y2="270" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#aR30)"/>
  <text x="318" y="260" text-anchor="middle" font-size="8" fill="#92742a">genişler</text>
  <text x="603" y="260" text-anchor="middle" font-size="8" fill="#a02020">genişler</text>

  <!-- footer -->
  <rect x="60" y="356" width="800" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="460" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#1A2B4A">Anahtar kavramlar</text>
  <text x="460" y="402" text-anchor="middle" font-size="10" fill="#2E3440">• Eşik: belirli bir tekrar sayısının üstünde hastalık ortaya çıkar. • Premutasyon: hastalık eşiğinin altında ama kararsız → nesilde genişleyebilir.</text>
  <text x="460" y="421" text-anchor="middle" font-size="10" fill="#2E3440">• Antisipasyon: ardışık nesillerde tekrar büyür → daha erken/ağır hastalık. • Genişleme yönü ebeveyn cinsiyetine bağlı olabilir (anne/baba farkı).</text>
  <text x="460" y="439" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Not: zon aralıkları gene özgüdür; buradaki sayılar FMR1 CGG için temsilîdir (→ Şekil 32).</text>
</svg>
