<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <defs>
    <filter id="sh60" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <marker id="ok60" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#1A2B4A"/>
    </marker>
    <marker id="okg60" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 z" fill="#B45309"/>
    </marker>
  </defs>

  <text x="32" y="34" font-size="17" font-weight="700" fill="#1A2B4A">Şekil 17.3 — Kitabın omurgası: hastadan rapora, rapordan yeniden hastaya</text>
  <text x="32" y="56" font-size="11.5" fill="#64748B">Bu altı adım, kitabın bütün bölümlerinin bir araya geldiği yerdir. Zincir tek yönlü değildir: negatif ya da belirsiz sonuç, akışı ikinci adıma geri döndürür.</text>

  <!-- KUTU 1 -->
  <g filter="url(#sh60)"><rect x="32" y="86" width="170" height="186" rx="10" fill="#ffffff" stroke="#2563EB" stroke-width="1.3"/></g>
  <rect x="32" y="86" width="170" height="28" rx="10" fill="#2563EB"/>
  <rect x="32" y="104" width="170" height="10" fill="#2563EB"/>
  <text x="117" y="105" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1 · FENOTİP</text>
  <text x="46" y="136" font-size="10" font-weight="700" fill="#1A2B4A">Derin fenotipleme</text>
  <text x="46" y="154" font-size="9" fill="#2E3440">Ayırt edici bulguları</text>
  <text x="46" y="166" font-size="9" fill="#2E3440">sistematik ARA; standart</text>
  <text x="46" y="178" font-size="9" fill="#2E3440">terimlerle (HPO) kaydet.</text>
  <text x="46" y="198" font-size="9" fill="#2E3440">Aile öyküsü, pedigri,</text>
  <text x="46" y="210" font-size="9" fill="#2E3440">başlangıç yaşı, seyir.</text>
  <rect x="46" y="228" width="142" height="20" rx="6" fill="#DBEAFE"/>
  <text x="117" y="242" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">Bölüm 1</text>
  <text x="117" y="262" font-size="8.5" fill="#94A3B8" text-anchor="middle">"Ne görüyorum?"</text>

  <path d="M204 179 H208" stroke="#1A2B4A" stroke-width="1.6" fill="none" marker-end="url(#ok60)"/>

  <!-- KUTU 2 -->
  <g filter="url(#sh60)"><rect x="210" y="86" width="170" height="186" rx="10" fill="#ffffff" stroke="#B91C1C" stroke-width="1.3"/></g>
  <rect x="210" y="86" width="170" height="28" rx="10" fill="#B91C1C"/>
  <rect x="210" y="104" width="170" height="10" fill="#B91C1C"/>
  <text x="295" y="105" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2 · MEKANİZMA</text>
  <text x="224" y="136" font-size="10" font-weight="700" fill="#1A2B4A">Hipotez kur</text>
  <text x="224" y="154" font-size="9" fill="#2E3440">Klinik ipucundan aday</text>
  <text x="224" y="166" font-size="9" fill="#2E3440">mekanizmaya geç:</text>
  <text x="224" y="178" font-size="9" fill="#2E3440">kayıp · kazanım · doz ·</text>
  <text x="224" y="190" font-size="9" fill="#2E3440">splice · mozaik · imprint ·</text>
  <text x="224" y="202" font-size="9" fill="#2E3440">tekrar · mitokondriyal.</text>
  <rect x="224" y="228" width="142" height="20" rx="6" fill="#FEE2E2"/>
  <text x="295" y="242" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">Bölüm 2–15 · Şekil 17.1</text>
  <text x="295" y="262" font-size="8.5" fill="#94A3B8" text-anchor="middle">"Hangi mekanizma olabilir?"</text>

  <path d="M382 179 H386" stroke="#1A2B4A" stroke-width="1.6" fill="none" marker-end="url(#ok60)"/>

  <!-- KUTU 3 -->
  <g filter="url(#sh60)"><rect x="388" y="86" width="170" height="186" rx="10" fill="#ffffff" stroke="#B45309" stroke-width="1.3"/></g>
  <rect x="388" y="86" width="170" height="28" rx="10" fill="#B45309"/>
  <rect x="388" y="104" width="170" height="10" fill="#B45309"/>
  <text x="473" y="105" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3 · TEST</text>
  <text x="402" y="136" font-size="10" font-weight="700" fill="#1A2B4A">Mekanizmayı gören</text>
  <text x="402" y="148" font-size="10" font-weight="700" fill="#1A2B4A">testi seç</text>
  <text x="402" y="166" font-size="9" fill="#2E3440">Her mekanizmanın kendi</text>
  <text x="402" y="178" font-size="9" fill="#2E3440">test tablosu vardır: dizileme</text>
  <text x="402" y="190" font-size="9" fill="#2E3440">her şeyi görmez.</text>
  <text x="402" y="208" font-size="9" fill="#2E3440">Doku seçimi ve trio kararı</text>
  <text x="402" y="220" font-size="9" fill="#2E3440">burada verilir.</text>
  <rect x="402" y="228" width="142" height="20" rx="6" fill="#FEF3C7"/>
  <text x="473" y="242" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">Her bölümün 5. başlığı</text>
  <text x="473" y="262" font-size="8.5" fill="#94A3B8" text-anchor="middle">"Hangi test bunu yakalar?"</text>

  <path d="M560 179 H564" stroke="#1A2B4A" stroke-width="1.6" fill="none" marker-end="url(#ok60)"/>

  <!-- KUTU 4 -->
  <g filter="url(#sh60)"><rect x="566" y="86" width="170" height="186" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.3"/></g>
  <rect x="566" y="86" width="170" height="28" rx="10" fill="#475569"/>
  <rect x="566" y="104" width="170" height="10" fill="#475569"/>
  <text x="651" y="105" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4 · VARYANT</text>
  <text x="580" y="136" font-size="10" font-weight="700" fill="#1A2B4A">Varyantı tanı</text>
  <text x="580" y="154" font-size="9" fill="#2E3440">Tip (null · missense ·</text>
  <text x="580" y="166" font-size="9" fill="#2E3440">splice · CNV · tekrar),</text>
  <text x="580" y="178" font-size="9" fill="#2E3440">konum (domain/izoform),</text>
  <text x="580" y="190" font-size="9" fill="#2E3440">faz (cis/trans), VAF,</text>
  <text x="580" y="202" font-size="9" fill="#2E3440">kalıtım ve ebeveyn kökeni.</text>
  <rect x="580" y="228" width="142" height="20" rx="6" fill="#E2E8F0"/>
  <text x="651" y="242" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">Bölüm 2–13 · 15</text>
  <text x="651" y="262" font-size="8.5" fill="#94A3B8" text-anchor="middle">"Bu varyant ne yapar?"</text>

  <path d="M738 179 H742" stroke="#1A2B4A" stroke-width="1.6" fill="none" marker-end="url(#ok60)"/>

  <!-- KUTU 5 -->
  <g filter="url(#sh60)"><rect x="744" y="86" width="170" height="186" rx="10" fill="#ffffff" stroke="#1A2B4A" stroke-width="1.3"/></g>
  <rect x="744" y="86" width="170" height="28" rx="10" fill="#1A2B4A"/>
  <rect x="744" y="104" width="170" height="10" fill="#1A2B4A"/>
  <text x="829" y="105" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5 · YORUM</text>
  <text x="758" y="136" font-size="10" font-weight="700" fill="#1A2B4A">Kanıtı tart</text>
  <text x="758" y="154" font-size="9" fill="#2E3440">Hastalık varlığını seç,</text>
  <text x="758" y="166" font-size="9" fill="#2E3440">kriterleri MEKANİZMAYA</text>
  <text x="758" y="178" font-size="9" fill="#2E3440">göre seç ve güçlerini</text>
  <text x="758" y="190" font-size="9" fill="#2E3440">belirle; toplam ağırlıktan</text>
  <text x="758" y="202" font-size="9" fill="#2E3440">sınıfa geç.</text>
  <rect x="758" y="228" width="142" height="20" rx="6" fill="#E2E8F0"/>
  <text x="829" y="242" font-size="9" font-weight="700" fill="#1A2B4A" text-anchor="middle">Bölüm 14 ve 16</text>
  <text x="829" y="262" font-size="8.5" fill="#94A3B8" text-anchor="middle">"Kanıt ne kadar ağır?"</text>

  <path d="M916 179 H920" stroke="#1A2B4A" stroke-width="1.6" fill="none" marker-end="url(#ok60)"/>

  <!-- KUTU 6 -->
  <g filter="url(#sh60)"><rect x="922" y="86" width="170" height="186" rx="10" fill="#ffffff" stroke="#2563EB" stroke-width="1.3"/></g>
  <rect x="922" y="86" width="170" height="28" rx="10" fill="#2563EB"/>
  <rect x="922" y="104" width="170" height="10" fill="#2563EB"/>
  <text x="1007" y="105" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6 · DANIŞMA</text>
  <text x="936" y="136" font-size="10" font-weight="700" fill="#1A2B4A">Klinik karara çevir</text>
  <text x="936" y="154" font-size="9" fill="#2E3440">Tekrarlanma riski hastalık</text>
  <text x="936" y="166" font-size="9" fill="#2E3440">varlığına göre hesaplanır;</text>
  <text x="936" y="178" font-size="9" fill="#2E3440">izlem ve tarama planı,</text>
  <text x="936" y="190" font-size="9" fill="#2E3440">gerekiyorsa tedavi ve</text>
  <text x="936" y="202" font-size="9" fill="#2E3440">üreme seçenekleri.</text>
  <rect x="936" y="228" width="142" height="20" rx="6" fill="#DBEAFE"/>
  <text x="1007" y="242" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">Bölüm 10–12 · 14</text>
  <text x="1007" y="262" font-size="8.5" fill="#94A3B8" text-anchor="middle">"Aile için ne anlama geliyor?"</text>

  <!-- Geri besleme -->
  <path d="M1007 284 V330 H295 V286" stroke="#B45309" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#okg60)"/>
  <rect x="380" y="312" width="470" height="36" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.1"/>
  <text x="615" y="329" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">NEGATİF ya da VUS ise akış burada bitmez</text>
  <text x="615" y="342" font-size="9.5" fill="#B45309" text-anchor="middle">Kör noktaları sırayla kapat, hipotezi güncelle, yeniden analiz et (Şekil 17.2 · Şekil 16.4)</text>

  <!-- Alt şerit -->
  <rect x="32" y="366" width="1060" height="102" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="52" y="388" font-size="12" font-weight="700" fill="#1A2B4A">Zincirin kırıldığı üç tipik yer</text>
  <text x="52" y="410" font-size="10.5" fill="#2E3440"><tspan font-weight="700">1. Adım 2 atlanır:</tspan> mekanizma hipotezi kurulmadan geniş test istenir; sonuç negatif gelir ve nedeni anlaşılmaz — oysa kaçan şey testin kör noktasıdır.</text>
  <text x="52" y="428" font-size="10.5" fill="#2E3440"><tspan font-weight="700">2. Adım 5 mekanizmasız yapılır:</tspan> kriterler kontrol listesi gibi işaretlenir; PVS1 kapısı ya da hastalık varlığı seçimi atlanır, sınıf yanlış çıkar.</text>
  <text x="52" y="446" font-size="10.5" fill="#2E3440"><tspan font-weight="700">3. Geri besleme kurulmaz:</tspan> VUS ya da negatif sonuç raporlanır ve dosya kapanır; yeniden değerlendirme takvime bağlanmadığı için tanı yıllarca gecikir.</text>
  <text x="52" y="462" font-size="9.5" fill="#64748B">Bu üç kırılmanın ortak özelliği, teknolojiyle değil <tspan font-weight="700" fill="#2E3440">akıl yürütmeyle</tspan> ilgili olmalarıdır.</text>

  <rect x="32" y="480" width="1060" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="562" y="500" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Öğreti: Genetik tanı bir test sonucu değil, bir akıl yürütme zinciridir; zincirin gücü en zayıf halkası kadardır.</text>
</svg>
