<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="s48arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 15.3 — Modifiye edici lokuslar: aynı varyant, farklı hastalık ağırlığı</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Modifier, hastalığı tek başına yapmaz; ana varyantın yarattığı tabloyu hafifletir veya ağırlaştırır. Eksik penetransın ve değişken ekspresivitenin moleküler zeminidir.</text>

  <!-- ================= PANEL A: SMN2 doz modifier ================= -->
  <rect x="40" y="80" width="820" height="212" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">Doz modifier'ı — SMA'da <tspan font-style="italic">SMN2</tspan> kopya sayısı</text>
  <text x="52" y="124" font-size="9.5" fill="#64748B">Tüm hastalarda ana kusur aynıdır: <tspan font-style="italic">SMN1</tspan> kaybı. Fenotibi belirleyen, yedek kopyanın kaç adet olduğudur.</text>

  <!-- ana kusur kutusu -->
  <rect x="56" y="138" width="150" height="46" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="131" y="157" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">ANA KUSUR (sabit)</text>
  <text x="131" y="173" font-size="9.5" font-style="italic" fill="#2E3440" text-anchor="middle">SMN1 bialelik kayıp</text>

  <line x1="212" y1="161" x2="242" y2="161" stroke="#64748B" stroke-width="1.8" marker-end="url(#s48arrow)"/>

  <!-- kopya sayısı sütunları -->
  <g>
    <rect x="256" y="230" width="72" height="18" rx="3" fill="#2563EB"/>
    <rect x="256" y="210" width="72" height="18" rx="3" fill="#2563EB" opacity="0.8"/>
    <text x="292" y="200" font-size="11" font-weight="700" fill="#1A2B4A" text-anchor="middle">2 kopya</text>
    <rect x="256" y="256" width="72" height="26" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"/>
    <text x="292" y="273" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Tip I (ağır)</text>
  </g>

  <g>
    <rect x="368" y="230" width="72" height="18" rx="3" fill="#2563EB"/>
    <rect x="368" y="210" width="72" height="18" rx="3" fill="#2563EB" opacity="0.85"/>
    <rect x="368" y="190" width="72" height="18" rx="3" fill="#2563EB" opacity="0.7"/>
    <text x="404" y="180" font-size="11" font-weight="700" fill="#1A2B4A" text-anchor="middle">3 kopya</text>
    <rect x="368" y="256" width="72" height="26" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
    <text x="404" y="273" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Tip II</text>
  </g>

  <g>
    <rect x="480" y="230" width="72" height="18" rx="3" fill="#2563EB"/>
    <rect x="480" y="210" width="72" height="18" rx="3" fill="#2563EB" opacity="0.85"/>
    <rect x="480" y="190" width="72" height="18" rx="3" fill="#2563EB" opacity="0.75"/>
    <rect x="480" y="170" width="72" height="18" rx="3" fill="#2563EB" opacity="0.6"/>
    <text x="516" y="160" font-size="11" font-weight="700" fill="#1A2B4A" text-anchor="middle">4 kopya</text>
    <rect x="480" y="256" width="72" height="26" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <text x="516" y="273" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">Tip III (hafif)</text>
  </g>

  <text x="586" y="176" font-size="9.5" font-weight="700" fill="#475569">SMN2 kopya sayısı ↑</text>
  <text x="586" y="192" font-size="9.5" font-weight="700" fill="#475569">→ üretilen tam-boy protein ↑</text>
  <text x="586" y="208" font-size="9.5" font-weight="700" fill="#475569">→ fenotip HAFİFLER</text>
  <rect x="586" y="222" width="258" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="598" y="240" font-size="9.5" fill="#2E3440">Mekanizma: <tspan font-style="italic">SMN2</tspan>'nin sessiz C&gt;T değişimi ekzon 7'yi</text>
  <text x="598" y="254" font-size="9.5" fill="#2E3440">büyük ölçüde atlatır (Bölüm 7); her kopya az miktarda</text>
  <text x="598" y="268" font-size="9.5" fill="#2E3440">tam-boy SMN üretir → kopya sayısı doğrudan doz demektir.</text>

  <!-- ================= PANEL B: modifier tipleri ================= -->
  <rect x="40" y="308" width="410" height="212" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="318" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="333" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="80" y="333" font-size="13" font-weight="700" fill="#2563EB">Modifier hangi yollarla iş görür?</text>

  <rect x="56" y="348" width="378" height="38" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <text x="68" y="364" font-size="10" font-weight="700" fill="#1D4ED8">1. Yedek/paralog doz</text>
  <text x="68" y="378" font-size="9" fill="#2E3440">Aynı işi gören ikinci bir gen açığı kapatır (<tspan font-style="italic">SMN2</tspan>).</text>

  <rect x="56" y="392" width="378" height="38" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <text x="68" y="408" font-size="10" font-weight="700" fill="#1D4ED8">2. Aynı yolakta ikinci lokus</text>
  <text x="68" y="422" font-size="9" fill="#2E3440">Yolağın başka bir bileşeni tamponlar veya yükü artırır.</text>

  <rect x="56" y="436" width="378" height="38" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <text x="68" y="452" font-size="10" font-weight="700" fill="#1D4ED8">3. Düzenleyici varyant (ifade dozu)</text>
  <text x="68" y="466" font-size="9" fill="#2E3440">Enhancer/promotör varyantı hedef geni azaltır (Bölüm 13).</text>

  <rect x="56" y="480" width="378" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="245" y="499" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">4. Çevre / cinsiyet / rastlantı da modifier'dır</text>

  <!-- ================= PANEL C: CF modifier ================= -->
  <rect x="460" y="308" width="400" height="212" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="472" y="318" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="482" y="333" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="500" y="333" font-size="13" font-weight="700" fill="#2563EB">Kistik fibroz — aynı genotip, farklı akciğer</text>

  <rect x="476" y="348" width="368" height="34" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"/>
  <text x="660" y="362" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Aynı <tspan font-style="italic">CFTR</tspan> genotipi (ör. F508del homozigot)</text>
  <text x="660" y="376" font-size="9" fill="#2E3440" text-anchor="middle">— ama akciğer hastalığı ağırlığı hastadan hastaya çok değişken</text>

  <line x1="660" y1="386" x2="660" y2="400" stroke="#64748B" stroke-width="1.6" marker-end="url(#s48arrow)"/>

  <rect x="476" y="404" width="368" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="660" y="422" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">GWAS meta-analizi (6.365 hasta) → 5 modifiye edici lokus</text>
  <text x="660" y="438" font-size="9" fill="#2E3440" text-anchor="middle">MUC4/MUC20 · SLC9A3 · HLA sınıf II · AGTR2/SLC6A14 · EHF/APIP</text>
  <text x="660" y="453" font-size="9" font-style="italic" fill="#64748B" text-anchor="middle">Hiçbiri CFTR değildir; hiçbiri tek başına KF yapmaz.</text>

  <rect x="476" y="470" width="368" height="38" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="488" y="486" font-size="9.5" font-weight="700" fill="#B45309">Klinik anlam:</text>
  <text x="488" y="500" font-size="9" fill="#2E3440">Genotip prognozu tam belirlemez; modifier'lar tedavi hedefi olabilir.</text>

  <text x="40" y="548" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Modifiye edici lokuslar, Bölüm 1'de "eksik penetrans ve değişken ekspresivite" diye adlandırdığımız bulanıklığın somut moleküler karşılığıdır.</text>
  <text x="40" y="564" font-size="11.5" font-style="italic" fill="#475569">"Aynı varyant neden bu çocukta ağır, kardeşinde hafif?" sorusunun cevabı çoğu zaman ana gende değil, onun etrafındaki genetik bağlamdadır.</text>
  <text x="860" y="590" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Calucho ve ark. (2018); Corvol ve ark. (2015); Cooper ve ark. (2013)</text>
</svg>
