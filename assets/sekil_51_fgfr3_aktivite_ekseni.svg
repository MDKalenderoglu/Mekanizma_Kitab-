<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <defs>
    <filter id="sh51" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="akse51" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="22%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <marker id="ok51" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 z" fill="#1A2B4A"/>
    </marker>
  </defs>

  <text x="32" y="34" font-size="17" font-weight="700" fill="#1A2B4A">Şekil 15.2 — Tek gen, tek eksen: FGFR3 aktivite serisi</text>
  <text x="32" y="56" font-size="11.5" fill="#64748B">FGFR3 uzun kemik büyümesinin negatif düzenleyicisidir. Aktivite arttıkça büyüme baskılanır, azaldıkça serbestleşir; her basamağın ayrı bir hastalık adı vardır.</text>

  <!-- PANEL A -->
  <rect x="24" y="72" width="1072" height="296" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="36" y="82" width="22" height="22" rx="6" fill="#1A2B4A"/>
  <text x="47" y="98" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="68" y="98" font-size="13" font-weight="700" fill="#1A2B4A">Reseptör aktivitesi ekseninde altı klinik durak</text>
  <text x="1084" y="98" font-size="10" fill="#64748B" text-anchor="end">↑ sütun yüksekliği = uzun kemik büyümesi</text>

  <!-- Sütunlar (büyüme) -->
  <g>
    <rect x="132" y="118" width="64" height="122" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <rect x="292" y="140" width="64" height="100" rx="5" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
    <rect x="452" y="168" width="64" height="72" rx="5" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.2"/>
    <rect x="612" y="188" width="64" height="52" rx="5" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1.2"/>
    <rect x="772" y="204" width="64" height="36" rx="5" fill="#EF4444" stroke="#B91C1C" stroke-width="1.2"/>
    <rect x="932" y="218" width="64" height="22" rx="5" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.2"/>
  </g>

  <!-- Eksen -->
  <rect x="110" y="248" width="950" height="18" rx="9" fill="url(#akse51)" stroke="#94A3B8" stroke-width="1"/>
  <text x="112" y="284" font-size="10.5" font-weight="700" fill="#2563EB">← aktivite AZALIR (LoF)</text>
  <text x="1058" y="284" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="end">aktivite ARTAR (GoF) →</text>

  <!-- Durak etiketleri -->
  <g text-anchor="middle">
    <text x="164" y="308" font-size="11.5" font-weight="700" fill="#2563EB">CATSHL sendromu</text>
    <text x="164" y="324" font-size="10" fill="#2E3440">p.Arg621His — kısmi LoF</text>
    <text x="164" y="339" font-size="9.5" fill="#64748B">uzun boy, kamptodaktili,</text>
    <text x="164" y="352" font-size="9.5" fill="#64748B">skolyoz, işitme kaybı</text>

    <text x="324" y="308" font-size="11.5" font-weight="700" fill="#475569">NORMAL</text>
    <text x="324" y="324" font-size="10" fill="#2E3440">ligand-bağımlı sinyal</text>
    <text x="324" y="339" font-size="9.5" fill="#64748B">büyüme plağı dengede</text>

    <text x="484" y="308" font-size="11.5" font-weight="700" fill="#B91C1C">Hipokondroplazi</text>
    <text x="484" y="324" font-size="10" fill="#2E3440">p.Asn540Lys</text>
    <text x="484" y="339" font-size="9.5" fill="#64748B">hafif orantısız kısalık;</text>
    <text x="484" y="352" font-size="9.5" fill="#64748B">sık gözden kaçar</text>

    <text x="644" y="308" font-size="11.5" font-weight="700" fill="#B91C1C">Akondroplazi</text>
    <text x="644" y="324" font-size="10" fill="#2E3440">p.Gly380Arg (~%98)</text>
    <text x="644" y="339" font-size="9.5" fill="#64748B">rizomelik kısalık,</text>
    <text x="644" y="352" font-size="9.5" fill="#64748B">makrosefali; yaşar</text>

    <text x="804" y="308" font-size="11.5" font-weight="700" fill="#B91C1C">SADDAN</text>
    <text x="804" y="324" font-size="10" fill="#2E3440">p.Lys650Met</text>
    <text x="804" y="339" font-size="9.5" fill="#64748B">ağır displazi + akantozis</text>
    <text x="804" y="352" font-size="9.5" fill="#64748B">nigrikans + gelişim geriliği</text>

    <text x="964" y="308" font-size="11.5" font-weight="700" fill="#7F1D1D">Tanatoforik displazi</text>
    <text x="964" y="324" font-size="10" fill="#2E3440">p.Arg248Cys · p.Lys650Glu</text>
    <text x="964" y="339" font-size="9.5" fill="#64748B">neonatal letal;</text>
    <text x="964" y="352" font-size="9.5" fill="#64748B">dar toraks, solunum yetmezliği</text>
  </g>

  <!-- PANEL B -->
  <rect x="24" y="384" width="524" height="150" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <rect x="36" y="394" width="22" height="22" rx="6" fill="#1A2B4A"/>
  <text x="47" y="410" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="68" y="410" font-size="13" font-weight="700" fill="#2563EB">Sol uç: freni gevşetmek</text>
  <text x="40" y="436" font-size="10.5" fill="#2E3440">FGFR3 bir “fren”dir. Fren zayıflarsa uzun kemikler daha uzun</text>
  <text x="40" y="452" font-size="10.5" fill="#2E3440">büyür: kısmi işlev kaybı taşıyan ailede uzun boy, kamptodaktili</text>
  <text x="40" y="468" font-size="10.5" fill="#2E3440">ve işitme kaybı görülür — kısa boylu displazilerin tam tersi.</text>
  <text x="40" y="492" font-size="10" fill="#64748B">Fenotip, Fgfr3 nakavt faresini birebir tekrarlar; bu, insan</text>
  <text x="40" y="506" font-size="10" fill="#64748B">varyantının yönünü doğrulayan en güçlü kanıttır.</text>
  <text x="40" y="524" font-size="9.5" fill="#94A3B8">Kaynak: Toydemir ve ark. (2006)</text>

  <line x1="560" y1="392" x2="560" y2="526" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 5"/>

  <rect x="572" y="384" width="524" height="150" rx="12" fill="#FEF6F5" stroke="#B91C1C" stroke-width="1.4"/>
  <rect x="584" y="394" width="22" height="22" rx="6" fill="#1A2B4A"/>
  <text x="595" y="410" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="616" y="410" font-size="13" font-weight="700" fill="#B91C1C">Sağ uç: freni sıkıştırmak</text>
  <text x="588" y="436" font-size="10.5" fill="#2E3440">Aktive edici varyantlar reseptörü ligandtan bağımsız hâle getirir;</text>
  <text x="588" y="452" font-size="10.5" fill="#2E3440">aktivite ne kadar yüksekse büyüme plağı o kadar baskılanır ve</text>
  <text x="588" y="468" font-size="10.5" fill="#2E3440">tablo hipokondroplaziden tanatoforik displaziye doğru ağırlaşır.</text>
  <text x="588" y="492" font-size="10" fill="#64748B">Aynı kodon farklı amino asitle değişince hastalık da değişir:</text>
  <text x="588" y="506" font-size="10" fill="#64748B">p.Lys650Met → SADDAN, p.Lys650Glu → tanatoforik displazi.</text>
  <text x="588" y="524" font-size="9.5" fill="#94A3B8">Kaynak: Webster ve ark. (1996)</text>

  <!-- Mekanizma → test → yorum şeridi -->
  <rect x="24" y="546" width="1072" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="40" y="568" font-size="10.5" font-weight="700" fill="#1A2B4A">MEKANİZMA</text>
  <text x="132" y="568" font-size="10.5" fill="#2E3440">reseptör aktivite düzeyi</text>
  <path d="M280 562 H310" stroke="#1A2B4A" stroke-width="1.4" marker-end="url(#ok51)"/>
  <text x="322" y="568" font-size="10.5" font-weight="700" fill="#1A2B4A">TEST</text>
  <text x="368" y="568" font-size="10.5" fill="#2E3440">hedefli FGFR3 dizileme (hotspot) veya WES</text>
  <path d="M660 562 H690" stroke="#1A2B4A" stroke-width="1.4" marker-end="url(#ok51)"/>
  <text x="702" y="568" font-size="10.5" font-weight="700" fill="#1A2B4A">YORUM</text>
  <text x="764" y="568" font-size="10.5" fill="#2E3440">PS1/PM5 aynı kodonda bile HANGİ hastalık için sorulmalıdır</text>

  <rect x="24" y="592" width="1072" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="560" y="612" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Öğreti: Allelik seri rastgele bir liste değildir; çoğu zaman tek bir ölçülebilir eksen (burada reseptör aktivitesi) boyunca dizilir.</text>
</svg>
