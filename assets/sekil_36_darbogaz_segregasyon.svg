<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <defs>
    <filter id="s36shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="s36o1"><rect x="134" y="312" width="30" height="46" rx="6"/></clipPath>
    <clipPath id="s36o2"><rect x="182" y="312" width="30" height="46" rx="6"/></clipPath>
    <clipPath id="s36o3"><rect x="230" y="312" width="30" height="46" rx="6"/></clipPath>
    <clipPath id="s36o4"><rect x="278" y="312" width="30" height="46" rx="6"/></clipPath>
    <clipPath id="s36o5"><rect x="326" y="312" width="30" height="46" rx="6"/></clipPath>
    <clipPath id="s36mom"><rect x="195" y="138" width="100" height="30" rx="8"/></clipPath>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 11.3 — Darboğaz ve segregasyon: yüzde neden öngörülemez biçimde değişir</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Heteroplazmi sabit bir sayı değildir: eşey hücrelerinde darboğazla kuşaklar arasında sıçrar, somatik dokularda ise yaşla birlikte kayar.</text>

  <!-- ================= PANEL A ================= -->
  <rect x="40" y="80" width="410" height="360" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">Germline darboğaz: kardeşler neden farklı?</text>

  <!-- Anne -->
  <text x="245" y="128" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">ANNE — oosit havuzu</text>
  <rect x="195" y="138" width="100" height="30" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <g clip-path="url(#s36mom)"><rect x="195" y="138" width="50" height="30" fill="#FEE2E2"/></g>
  <rect x="195" y="138" width="100" height="30" rx="8" fill="none" stroke="#2563EB" stroke-width="1.8"/>
  <line x1="245" y1="138" x2="245" y2="168" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="245" y="185" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">%50 mutant mtDNA</text>

  <!-- Darboğaz kum saati -->
  <polygon points="150,196 340,196 268,240 222,240" fill="#E2E8F0" opacity="0.75" stroke="#CBD5E1" stroke-width="1.2"/>
  <polygon points="222,266 268,266 350,304 140,304" fill="#E2E8F0" opacity="0.75" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="198" y="242" width="94" height="22" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="245" y="257" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">DARBOĞAZ</text>

  <!-- Oositler -->
  <g>
    <rect x="134" y="312" width="30" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <g clip-path="url(#s36o1)"><rect x="134" y="356" width="30" height="2" fill="#B91C1C"/></g>
    <rect x="134" y="312" width="30" height="46" rx="6" fill="none" stroke="#2563EB" stroke-width="1.6"/>

    <rect x="182" y="312" width="30" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <g clip-path="url(#s36o2)"><rect x="182" y="349" width="30" height="9" fill="#B91C1C"/></g>
    <rect x="182" y="312" width="30" height="46" rx="6" fill="none" stroke="#2563EB" stroke-width="1.6"/>

    <rect x="230" y="312" width="30" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <g clip-path="url(#s36o3)"><rect x="230" y="335" width="30" height="23" fill="#B91C1C"/></g>
    <rect x="230" y="312" width="30" height="46" rx="6" fill="none" stroke="#2563EB" stroke-width="1.6"/>

    <rect x="278" y="312" width="30" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <g clip-path="url(#s36o4)"><rect x="278" y="321" width="30" height="37" fill="#B91C1C"/></g>
    <rect x="278" y="312" width="30" height="46" rx="6" fill="none" stroke="#2563EB" stroke-width="1.6"/>

    <rect x="326" y="312" width="30" height="46" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
    <g clip-path="url(#s36o5)"><rect x="326" y="314" width="30" height="44" fill="#B91C1C"/></g>
    <rect x="326" y="312" width="30" height="46" rx="6" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  </g>

  <text x="149" y="374" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">%5</text>
  <text x="197" y="374" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">%20</text>
  <text x="245" y="374" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">%50</text>
  <text x="293" y="374" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">%80</text>
  <text x="341" y="374" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">%95</text>
  <text x="245" y="390" font-size="9.5" font-style="italic" fill="#64748B" text-anchor="middle">olgun oositlerde mutant yükü</text>

  <text x="52" y="407" font-size="9.5" fill="#475569">Az sayıda mtDNA molekülü yeni oosit havuzunu kurar; bu örnekleme,</text>
  <text x="52" y="421" font-size="9.5" fill="#475569">yüzdeyi kuşaklar arasında sıçratır. Sonuç: aynı annenin çocukları</text>
  <text x="52" y="435" font-size="9.5" fill="#475569">çok farklı yük taşır → risk Mendel oranıyla hesaplanamaz.</text>

  <!-- ================= PANEL B ================= -->
  <rect x="470" y="80" width="390" height="360" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="482" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="492" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="510" y="105" font-size="13" font-weight="700" fill="#2563EB">Mitotik segregasyon: yüzde dokuya göre kayar</text>

  <!-- Eksenler -->
  <line x1="530" y1="150" x2="530" y2="330" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="530" y1="330" x2="830" y2="330" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="508" y="240" font-size="10" fill="#475569" text-anchor="middle" transform="rotate(-90 508 240)">heteroplazmi %</text>

  <!-- Eğriler -->
  <path d="M 530 204 L 830 200" fill="none" stroke="#B91C1C" stroke-width="2.8"/>
  <path d="M 530 234 L 830 228" fill="none" stroke="#D97706" stroke-width="2.8"/>
  <path d="M 530 216 C 640 224, 730 262, 830 294" fill="none" stroke="#2563EB" stroke-width="2.8"/>

  <text x="836" y="204" font-size="9.5" font-weight="700" fill="#B91C1C">kas</text>
  <text x="836" y="232" font-size="9.5" font-weight="700" fill="#D97706">idrar</text>
  <text x="836" y="298" font-size="9.5" font-weight="700" fill="#2563EB">kan</text>

  <text x="530" y="346" font-size="9.5" fill="#64748B">doğum</text>
  <text x="680" y="346" font-size="9.5" fill="#64748B" text-anchor="middle">çocukluk</text>
  <text x="830" y="346" font-size="9.5" fill="#64748B" text-anchor="end">erişkin</text>

  <text x="482" y="368" font-size="9.5" fill="#475569">Bölünen hücrelerde (kan) mutant mtDNA oranı yaşla düşme eğilimindedir;</text>
  <text x="482" y="382" font-size="9.5" fill="#475569">bölünmeyen dokularda (kas) ve idrar epitelinde ise korunur.</text>

  <rect x="482" y="392" width="366" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="494" y="409" font-size="9.5" font-weight="700" fill="#B45309">Klinik sonuç:</text>
  <text x="494" y="423" font-size="9" fill="#2E3440">Kanda düşük/negatif sonuç tanıyı DIŞLAMAZ — idrar epiteli veya kas seçilir.</text>

  <!-- Öğreti footer -->
  <text x="40" y="464" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Darboğaz kuşaklar arası, mitotik segregasyon ise yaşam boyu belirsizlik yaratır. Birincisi genetik danışmada "kesin risk veremiyoruz" demenin,</text>
  <text x="40" y="480" font-size="11.5" font-style="italic" fill="#475569">ikincisi ise "yanlış dokuda ölçüm yanlış sonuç verir" demenin moleküler gerekçesidir.</text>
  <text x="860" y="496" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Stewart &amp; Chinnery (2015); Parikh ve ark. (2015)</text>
</svg>
