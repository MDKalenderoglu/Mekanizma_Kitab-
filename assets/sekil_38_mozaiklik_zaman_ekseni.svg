  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 12.1 — Mozaikliğin zaman ekseni: varyant ne zaman oluştuysa oraya dağılır</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Postzigotik bir varyantın hangi hücrelerde bulunacağını belirleyen tek değişken, embriyogenezin hangi anında ortaya çıktığıdır.</text>

