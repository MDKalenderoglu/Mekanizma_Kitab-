  <text x="455" y="341" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Germline TUTULABİLİR</text>
  <text x="332" y="362" font-size="9.5" fill="#475569">Segmental/yamalı dağılım (Blaschko).</text>
  <text x="332" y="376" font-size="9.5" fill="#475569">Klinik: tipik mozaik sendrom tablosu.</text>

