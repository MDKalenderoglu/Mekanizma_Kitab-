  <text x="52" y="362" font-size="9.5" fill="#475569">Yaygın dağılım; kanda bile saptanır.</text>
  <text x="52" y="376" font-size="9.5" fill="#475569">Klinik: konstitüsyonel hastalığa yakın.</text>

