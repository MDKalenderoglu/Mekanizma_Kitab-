  <text x="730" y="341" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">Germline TUTULMAZ</text>
  <text x="612" y="362" font-size="9.5" fill="#475569">Tek dokuya sınırlı (ör. beyin, deri).</text>
  <text x="612" y="376" font-size="9.5" fill="#475569">Klinik: fokal lezyon; kanda GÖRÜNMEZ.</text>

  <!-- ============ ALT BANT ============ -->
  <rect x="40" y="402" width="820" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="450" y="424" font-size="11.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">Kural: Varyant ne kadar ERKEN oluşursa o kadar çok hücre soyuna dağılır — ve germline'a ulaşma olasılığı o kadar artar.</text>
  <text x="450" y="443" font-size="10.5" fill="#2E3440" text-anchor="middle">Bu tek cümle hem hangi dokuyu test edeceğinizi hem de aileye vereceğiniz tekrarlanma riskini belirler.</text>

  <text x="40" y="484" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Mozaiklikte "varyant var mı?" sorusu eksiktir; doğru soru "varyant hangi hücrelerde ve hangi oranda var?"dır. Zamanlama, dağılımı;</text>
  <text x="40" y="500" font-size="11.5" font-style="italic" fill="#475569">dağılım hem fenotipi hem test edilecek dokuyu hem de tekrarlanma riskini belirler.</text>
  <text x="860" y="518" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Biesecker &amp; Spinner (2013); Happle (1987)</text>
</svg>
