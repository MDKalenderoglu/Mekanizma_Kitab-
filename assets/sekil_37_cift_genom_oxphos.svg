<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <defs>
    <filter id="s37shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
    <marker id="s37arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 11.4 — Çift genom kontrolü: OXPHOS'u iki ayrı genom birlikte kurar</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Solunum zincirinin alt birimlerinin büyük çoğunluğu nükleer genomdan kodlanır; bu yüzden mitokondriyal hastalıkların çoğu maternal değil, Mendel kalıtımlıdır.</text>

  <!-- ================= PANEL A ================= -->
  <rect x="40" y="80" width="820" height="220" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">OXPHOS komplekslerinde alt birimlerin genom kaynağı (yaklaşık sayılar)</text>

  <!-- Lejant -->
  <rect x="640" y="118" width="16" height="11" rx="2" fill="#2563EB"/>
  <text x="662" y="127" font-size="10" fill="#2E3440">nükleer genom kodlu</text>
  <rect x="640" y="134" width="16" height="11" rx="2" fill="#B91C1C"/>
  <text x="662" y="143" font-size="10" fill="#2E3440">mtDNA kodlu</text>

  <!-- Eksenler -->
  <line x1="110" y1="130" x2="110" y2="270" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="110" y1="270" x2="830" y2="270" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="90" y="200" font-size="10" fill="#475569" text-anchor="middle" transform="rotate(-90 90 200)">alt birim sayısı</text>

  <!-- Kompleks I: ~45 toplam, 7 mtDNA -->
  <rect x="130" y="168" width="70" height="102" fill="#2563EB"/>
  <rect x="130" y="150" width="70" height="18" fill="#B91C1C"/>
  <text x="165" y="142" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">~45</text>
  <text x="206" y="163" font-size="9.5" font-weight="700" fill="#B91C1C">7 mtDNA</text>

  <!-- Kompleks II: 4 toplam, 0 mtDNA -->
  <rect x="275" y="259" width="70" height="11" fill="#2563EB"/>
  <text x="310" y="251" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">4</text>
  <text x="351" y="268" font-size="9.5" font-weight="700" fill="#1D4ED8">0 mtDNA</text>

  <!-- Kompleks III: ~11 toplam, 1 mtDNA -->
  <rect x="420" y="243" width="70" height="27" fill="#2563EB"/>
  <rect x="420" y="240" width="70" height="3" fill="#B91C1C"/>
  <text x="455" y="232" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">~11</text>
  <text x="496" y="248" font-size="9.5" font-weight="700" fill="#B91C1C">1 mtDNA</text>

  <!-- Kompleks IV: ~14 toplam, 3 mtDNA -->
  <rect x="565" y="241" width="70" height="29" fill="#2563EB"/>
  <rect x="565" y="233" width="70" height="8" fill="#B91C1C"/>
  <text x="600" y="225" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">~14</text>
  <text x="641" y="242" font-size="9.5" font-weight="700" fill="#B91C1C">3 mtDNA</text>

  <!-- Kompleks V: ~17 toplam, 2 mtDNA -->
  <rect x="710" y="230" width="70" height="40" fill="#2563EB"/>
  <rect x="710" y="225" width="70" height="5" fill="#B91C1C"/>
  <text x="745" y="217" font-size="10.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">~17</text>
  <text x="786" y="233" font-size="9.5" font-weight="700" fill="#B91C1C">2 mtDNA</text>

  <!-- Kompleks etiketleri -->
  <text x="165" y="286" font-size="10.5" font-weight="700" fill="#2E3440" text-anchor="middle">Kompleks I</text>
  <text x="310" y="286" font-size="10.5" font-weight="700" fill="#2E3440" text-anchor="middle">Kompleks II</text>
  <text x="455" y="286" font-size="10.5" font-weight="700" fill="#2E3440" text-anchor="middle">Kompleks III</text>
  <text x="600" y="286" font-size="10.5" font-weight="700" fill="#2E3440" text-anchor="middle">Kompleks IV</text>
  <text x="745" y="286" font-size="10.5" font-weight="700" fill="#2E3440" text-anchor="middle">Kompleks V</text>

  <!-- ================= PANEL B ================= -->
  <rect x="40" y="315" width="410" height="165" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="325" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="340" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="80" y="340" font-size="13" font-weight="700" fill="#2563EB">Aynı fenotip → farklı kalıtım</text>

  <rect x="56" y="352" width="180" height="40" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"/>
  <text x="146" y="369" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">mtDNA'da varyant</text>
  <text x="146" y="384" font-size="9.5" fill="#2E3440" text-anchor="middle">(ör. MT-ATP6 m.8993T&gt;G)</text>

  <rect x="254" y="352" width="180" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="344" y="369" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Nükleer gende varyant</text>
  <text x="344" y="384" font-size="9.5" fill="#2E3440" text-anchor="middle">(ör. SURF1, NDUFS4)</text>

  <line x1="146" y1="392" x2="146" y2="412" stroke="#64748B" stroke-width="1.6" marker-end="url(#s37arrowSlate)"/>
  <line x1="344" y1="392" x2="344" y2="412" stroke="#64748B" stroke-width="1.6" marker-end="url(#s37arrowSlate)"/>

  <rect x="56" y="414" width="180" height="30" rx="8" fill="#FEF6F5" stroke="#B91C1C" stroke-width="1.4"/>
  <text x="146" y="434" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">MATERNAL kalıtım</text>
  <rect x="254" y="414" width="180" height="30" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <text x="344" y="434" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">OTOZOMAL RESESİF</text>

  <text x="146" y="464" font-size="9.5" fill="#475569" text-anchor="middle">Risk: tüm çocuklara geçer (% değişken)</text>
  <text x="344" y="464" font-size="9.5" fill="#475569" text-anchor="middle">Risk: her gebelikte %25</text>

  <!-- ================= PANEL C ================= -->
  <rect x="470" y="315" width="390" height="165" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="482" y="325" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="492" y="340" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="510" y="340" font-size="13" font-weight="700" fill="#2563EB">Bu yüzden tek test yetmez</text>

  <rect x="486" y="352" width="176" height="42" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"/>
  <text x="574" y="369" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">mtDNA dizileme</text>
  <text x="574" y="384" font-size="9.5" fill="#2E3440" text-anchor="middle">heteroplazmi % + delesyon</text>

  <rect x="672" y="352" width="176" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="760" y="369" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Nükleer WES / WGS</text>
  <text x="760" y="384" font-size="9.5" fill="#2E3440" text-anchor="middle">~1500 mitokondriyal gen</text>

  <line x1="574" y1="394" x2="574" y2="414" stroke="#64748B" stroke-width="1.6" marker-end="url(#s37arrowSlate)"/>
  <line x1="760" y1="394" x2="760" y2="414" stroke="#64748B" stroke-width="1.6" marker-end="url(#s37arrowSlate)"/>

  <rect x="486" y="416" width="362" height="46" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="667" y="435" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">Leigh sendromu: 75'ten fazla farklı gen</text>
  <text x="667" y="451" font-size="9.5" fill="#2E3440" text-anchor="middle">Mekanizma ortak (OXPHOS yetmezliği), lokus farklı — Lake ve ark. (2016)</text>

  <!-- Öğreti footer -->
  <text x="40" y="504" font-size="11.5" font-style="italic" fill="#475569">Öğreti: "Mitokondriyal hastalık" bir kalıtım kalıbı değil, bir organel yetmezliğidir. Fenotip mitokondriyaldir; kalıtım ise varyantın hangi genomda</text>
  <text x="40" y="520" font-size="11.5" font-style="italic" fill="#475569">olduğuna bağlıdır — ve bu ayrım, hem doğru testi hem de aileye verilecek tekrarlanma riskini tümüyle değiştirir.</text>
  <text x="860" y="534" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Gorman ve ark. (2016); Lake ve ark. (2016)</text>
</svg>
