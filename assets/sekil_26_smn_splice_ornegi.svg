<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft26" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="aB26" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto"><path d="M0,0 L12,0 L6,11 Z" fill="#2563EB"/></marker>
    <marker markerUnits="userSpaceOnUse" id="aR26" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto"><path d="M0,0 L12,0 L6,11 Z" fill="#B91C1C"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="480" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">Sessiz bir nükleotid neden hastalık yapar? — SMN1 vs SMN2 ve ekzon 7</text>

  <!-- ===== PANEL A : SMN1 ===== -->
  <rect x="24" y="46" width="424" height="356" rx="13" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="36" y="58" width="22" height="22" rx="4" fill="#1A2B4A"/><text x="47" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">A</text>
  <text x="246" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">SMN1 — sağlıklı (ekzon 7'de C)</text>

  <!-- exons -->
  <rect x="60" y="100" width="100" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/><text x="110" y="120" text-anchor="middle" font-size="10" fill="#1D4ED8">Ekzon 6</text>
  <rect x="172" y="100" width="100" height="30" rx="5" fill="#BFD9FB" stroke="#2563EB" stroke-width="1.6"/><text x="222" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">Ekzon 7</text>
  <rect x="284" y="100" width="100" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/><text x="334" y="120" text-anchor="middle" font-size="10" fill="#1D4ED8">Ekzon 8</text>
  <circle cx="222" cy="92" r="9" fill="#16a34a"/><text x="222" y="95.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">C</text>
  <text x="222" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">ESE sağlam</text>

  <line x1="222" y1="158" x2="222" y2="192" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB26)"/>
  <text x="222" y="178" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">ekzon 7 DAHİL edilir</text>

  <!-- mRNA joined -->
  <rect x="96" y="206" width="78" height="28" rx="4" fill="#2563EB"/><text x="135" y="224" text-anchor="middle" font-size="9" fill="#fff">Ekzon 6</text>
  <rect x="176" y="206" width="78" height="28" rx="4" fill="#2563EB"/><text x="215" y="224" text-anchor="middle" font-size="9" fill="#fff">Ekzon 7</text>
  <rect x="256" y="206" width="78" height="28" rx="4" fill="#2563EB"/><text x="295" y="224" text-anchor="middle" font-size="9" fill="#fff">Ekzon 8</text>

  <rect x="64" y="262" width="320" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="224" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">Tam SMN proteini ✓</text>
  <text x="224" y="306" text-anchor="middle" font-size="10" fill="#2456c9">motor nöron sağlıklı</text>

  <text x="224" y="350" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">SMN1 kaybı (homozigot) → SMA;</text>
  <text x="224" y="365" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">peki neden SMN2 kurtaramıyor? →</text>

  <!-- ===== PANEL B : SMN2 ===== -->
  <rect x="472" y="46" width="424" height="356" rx="13" fill="#FEF6F5" stroke="#F2C9C4" stroke-width="1.5"/>
  <rect x="484" y="58" width="22" height="22" rx="4" fill="#1A2B4A"/><text x="495" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">B</text>
  <text x="694" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#B91C1C">SMN2 — sessiz C&gt;T (kodon 280)</text>

  <rect x="508" y="100" width="100" height="30" rx="5" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/><text x="558" y="120" text-anchor="middle" font-size="10" fill="#B91C1C">Ekzon 6</text>
  <rect x="620" y="100" width="100" height="30" rx="5" fill="#FAD4D0" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="4 2"/><text x="670" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">Ekzon 7</text>
  <rect x="732" y="100" width="100" height="30" rx="5" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.3"/><text x="782" y="120" text-anchor="middle" font-size="10" fill="#B91C1C">Ekzon 8</text>
  <circle cx="670" cy="92" r="9" fill="#B91C1C"/><text x="670" y="95.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">T</text>
  <text x="670" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#B91C1C">ESE zayıflar (sessiz değişim!)</text>

  <line x1="670" y1="158" x2="670" y2="192" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#aR26)"/>
  <text x="670" y="178" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C">ekzon 7 ATLANIR</text>

  <!-- mRNA skipped: E6-E8 -->
  <rect x="556" y="206" width="78" height="28" rx="4" fill="#B91C1C"/><text x="595" y="224" text-anchor="middle" font-size="9" fill="#fff">Ekzon 6</text>
  <rect x="636" y="206" width="78" height="28" rx="4" fill="#B91C1C"/><text x="675" y="224" text-anchor="middle" font-size="9" fill="#fff">Ekzon 8</text>
  <text x="760" y="224" text-anchor="middle" font-size="8.5" font-style="italic" fill="#a02020">(ekzon 7 yok)</text>

  <rect x="512" y="262" width="344" height="60" rx="9" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="684" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B91C1C">SMNΔ7 — kararsız / işlevsiz ✗</text>
  <text x="684" y="306" text-anchor="middle" font-size="10" fill="#a02020">SMN1 kaybını telafi edemez → SMA</text>

  <text x="684" y="350" text-anchor="middle" font-size="9.5" font-style="italic" fill="#92742a">Tedavi (antisense/risdiplam) ekzon 7</text>
  <text x="684" y="365" text-anchor="middle" font-size="9.5" font-style="italic" fill="#92742a">dahil edilmesini ARTIRIR → SMN ↑</text>

  <!-- footer -->
  <rect x="120" y="416" width="680" height="50" rx="10" fill="#FFFBEB" stroke="#FCE8B6" stroke-width="1.3"/>
  <text x="460" y="438" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B45309">Öğreti: tek bir "sessiz" nükleotid (C→T), bir ekzonik düzenleyiciyi (ESE) bozarak ekzon atlatır.</text>
  <text x="460" y="456" text-anchor="middle" font-size="9.5" fill="#2E3440">Mekanizmayı bilmek tedaviyi açar: splicing'i düzelten ilaçlar SMA'da hastalık seyrini değiştirir (Lorson ve ark., 1999).</text>
</svg>
