<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="440" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 1.4 — Allelik Heterojenite vs Lokus Heterojenitesi</text>
  <line x1="490" y1="50" x2="490" y2="400" stroke="#eee" stroke-width="2"/>

  <!-- ===== ALLELIK HETEROJENITE (sol) ===== -->
  <text x="245" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#8e44ad">ALLELİK HETEROJENİTE</text>
  <text x="245" y="96" text-anchor="middle" font-size="12" fill="#444">AYNI gen — FARKLI varyantlar</text>

  <!-- single gene bar with multiple variant marks -->
  <rect x="70" y="130" width="350" height="34" rx="6" fill="#dcd0ec" stroke="#8e44ad" stroke-width="2"/>
  <text x="245" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#5b2c82">Gen X</text>
  <!-- variant marks -->
  <g>
    <polygon points="110,130 104,116 116,116" fill="#c0392b"/><text x="110" y="110" text-anchor="middle" font-size="9" fill="#c0392b">nonsense</text>
    <polygon points="180,130 174,116 186,116" fill="#e67e22"/><text x="180" y="110" text-anchor="middle" font-size="9" fill="#e67e22">missense</text>
    <polygon points="255,130 249,116 261,116" fill="#16a085"/><text x="255" y="110" text-anchor="middle" font-size="9" fill="#16a085">frameshift</text>
    <polygon points="330,130 324,116 336,116" fill="#2980b9"/><text x="330" y="110" text-anchor="middle" font-size="9" fill="#2980b9">splice</text>
    <polygon points="390,130 384,116 396,116" fill="#7f8c8d"/><text x="390" y="110" text-anchor="middle" font-size="9" fill="#7f8c8d">delesyon</text>
  </g>
  <!-- arrows converge -->
  <path d="M245 175 L245 215" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowP)"/>
  <rect x="135" y="220" width="220" height="40" rx="8" fill="#f4ecfa" stroke="#8e44ad" stroke-width="2"/>
  <text x="245" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#5b2c82">AYNI fenotip</text>

  <text x="245" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Klinik sonuç:</text>
  <text x="245" y="320" text-anchor="middle" font-size="11" fill="#444">Tek-varyant testi taşıyıcıyı kaçırabilir.</text>
  <text x="245" y="337" text-anchor="middle" font-size="11" fill="#444">Genin TAMAMI dizilenmeli (gen tarama).</text>
  <text x="245" y="362" text-anchor="middle" font-size="10" font-style="italic" fill="#777">Örn: CFTR'de ~2000 varyant; DMD; NF1</text>

  <!-- ===== LOKUS HETEROJENITESI (sag) ===== -->
  <text x="730" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#2471a3">LOKUS HETEROJENİTESİ</text>
  <text x="730" y="96" text-anchor="middle" font-size="12" fill="#444">FARKLI genler — AYNI/benzer fenotip</text>

  <!-- multiple gene bars each with a variant -->
  <g>
    <rect x="560" y="120" width="150" height="26" rx="5" fill="#d4e6f1" stroke="#2471a3" stroke-width="2"/>
    <text x="635" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5276">Gen A</text>
    <polygon points="600,120 594,108 606,108" fill="#c0392b"/>
    <rect x="560" y="155" width="150" height="26" rx="5" fill="#d4e6f1" stroke="#2471a3" stroke-width="2"/>
    <text x="635" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5276">Gen B</text>
    <polygon points="660,155 654,143 666,143" fill="#16a085"/>
    <rect x="560" y="190" width="150" height="26" rx="5" fill="#d4e6f1" stroke="#2471a3" stroke-width="2"/>
    <text x="635" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5276">Gen C</text>
    <polygon points="620,190 614,178 626,178" fill="#e67e22"/>
  </g>
  <!-- arrows from each converge -->
  <path d="M710 133 C 770 150, 770 220, 745 232" stroke="#2471a3" stroke-width="1.6" fill="none"/>
  <path d="M710 168 C 760 185, 760 215, 745 230" stroke="#2471a3" stroke-width="1.6" fill="none"/>
  <path d="M710 203 C 760 215, 760 222, 745 232" stroke="#2471a3" stroke-width="1.6" fill="none"/>
  <rect x="635" y="230" width="190" height="40" rx="8" fill="#eaf2fb" stroke="#2471a3" stroke-width="2"/>
  <text x="730" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5276">AYNI fenotip</text>

  <text x="730" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Klinik sonuç:</text>
  <text x="730" y="325" text-anchor="middle" font-size="11" fill="#444">Tek gen testi yetersiz; PANEL / EKZOM gerekir.</text>
  <text x="730" y="342" text-anchor="middle" font-size="11" fill="#444">Genler çoğu kez AYNI yolakta buluşur.</text>
  <text x="730" y="367" text-anchor="middle" font-size="10" font-style="italic" fill="#777">Örn: retinitis pigmentosa, epileptik ensefalopati</text>

  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrowP" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8e44ad"/>
    </marker>
  </defs>
  <text x="490" y="425" text-anchor="middle" font-size="11" font-style="italic" fill="#777">İki kavram birlikte bulunabilir: aynı fenotip hem farklı genlerden hem de her gende farklı varyantlardan kaynaklanabilir.</text>
</svg>
