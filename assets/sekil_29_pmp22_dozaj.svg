<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft29" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="aB29" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#2563EB"/></marker>
    <marker markerUnits="userSpaceOnUse" id="aR29" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#B45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">Aynı lokus, zıt doz, zıt hastalık — PMP22 (17p12)</text>
  <text x="450" y="50" text-anchor="middle" font-size="10.5" fill="#64748B">Yan dizilerdeki tekrarlar (NAHR) hem delesyonu hem duplikasyonu resiprokal olarak üretir</text>

  <!-- center locus -->
  <rect x="376" y="180" width="148" height="64" rx="32" fill="#F1F5F9" stroke="#64748B" stroke-width="1.8" filter="url(#soft29)"/>
  <text x="450" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">PMP22</text>
  <text x="450" y="226" text-anchor="middle" font-size="8.5" fill="#64748B">miyelin doz-duyarlı gen</text>

  <!-- LEFT : deletion / HNPP -->
  <text x="150" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">DELESYON — 1 kopya (doz ↓)</text>
  <line x1="372" y1="200" x2="248" y2="200" stroke="#2563EB" stroke-width="2.4" marker-end="url(#aB29)"/>
  <!-- gene copies left: 1 -->
  <rect x="120" y="180" width="26" height="40" rx="4" fill="#93C5FD" stroke="#2563EB"/>
  <text x="180" y="195" font-size="9" fill="#2456c9">tek PMP22 kopyası</text>
  <text x="180" y="208" font-size="9" fill="#2456c9">→ yetersiz miyelin proteini</text>
  <rect x="60" y="244" width="240" height="74" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="180" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">HNPP</text>
  <text x="180" y="286" text-anchor="middle" font-size="9.5" fill="#2456c9">basınca duyarlı herediter nöropati</text>
  <text x="180" y="302" text-anchor="middle" font-size="8.5" fill="#64748b">haploinsufficiency (Bölüm 3)</text>

  <!-- RIGHT : duplication / CMT1A -->
  <text x="750" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">DUPLİKASYON — 3 kopya (doz ↑)</text>
  <line x1="528" y1="200" x2="652" y2="200" stroke="#B45309" stroke-width="2.4" marker-end="url(#aR29)"/>
  <rect x="700" y="180" width="20" height="40" rx="3" fill="#D97706"/>
  <rect x="724" y="180" width="20" height="40" rx="3" fill="#D97706"/>
  <rect x="748" y="180" width="20" height="40" rx="3" fill="#D97706"/>
  <text x="640" y="240" font-size="9" fill="#92742a">üç PMP22 kopyası → fazla protein</text>
  <rect x="600" y="244" width="240" height="74" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="720" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">CMT1A</text>
  <text x="720" y="286" text-anchor="middle" font-size="9.5" fill="#92742a">demiyelinizan Charcot–Marie–Tooth tip 1A</text>
  <text x="720" y="302" text-anchor="middle" font-size="8.5" fill="#92742a">artmış doz (Bölüm 4 ile koşut)</text>

  <!-- footer -->
  <rect x="120" y="350" width="660" height="74" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="450" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#1A2B4A">Öğreti: doz-duyarlı bir gende kopya sayısının yönü hastalığı belirler</text>
  <text x="450" y="393" text-anchor="middle" font-size="9.5" fill="#2E3440">Aynı 17p12 bölgesi: kopya kaybı → HNPP, kopya kazancı → CMT1A. İkisi de aynı NAHR mekanizmasının resiprokal ürünüdür.</text>
  <text x="450" y="411" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Bu, GoF/LoF "aynı gen, iki yön" temasının (Şekil 17) doz düzeyindeki karşılığıdır (Lupski ve ark., 1991).</text>
</svg>
