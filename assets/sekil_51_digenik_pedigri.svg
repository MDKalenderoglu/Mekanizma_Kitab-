<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 15.2 — Digenik kalıtımın pedigri imzası: iki sağlıklı ebeveyn, hasta çocuk</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Temsili şema; klasik örnek: retinitis pigmentosa'da <tspan font-style="italic">RDS</tspan> (peripherin) ve <tspan font-style="italic">ROM1</tspan> — yalnız çift heterozigotlar hastalanır (Kajiwara ve ark., 1994).</text>

  <!-- ================= PANEL A: pedigri ================= -->
  <rect x="40" y="80" width="480" height="330" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">Pedigri: hastalık "yoktan" ortaya çıkmış gibi görünür</text>

  <!-- Ebeveynler -->
  <rect x="140" y="140" width="34" height="34" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
  <circle cx="357" cy="157" r="17" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
  <line x1="174" y1="157" x2="340" y2="157" stroke="#475569" stroke-width="1.8"/>

  <text x="157" y="130" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">BABA — sağlıklı</text>
  <rect x="106" y="182" width="102" height="20" rx="5" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4"/>
  <text x="157" y="196" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">RDS het.</text>
  <text x="157" y="216" font-size="9" fill="#64748B" text-anchor="middle">ROM1 normal</text>

  <text x="357" y="130" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">ANNE — sağlıklı</text>
  <rect x="306" y="182" width="102" height="20" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="357" y="196" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">ROM1 het.</text>
  <text x="357" y="216" font-size="9" fill="#64748B" text-anchor="middle">RDS normal</text>

  <!-- Kardeş çizgisi -->
  <line x1="257" y1="157" x2="257" y2="238" stroke="#475569" stroke-width="1.8"/>
  <line x1="140" y1="238" x2="374" y2="238" stroke="#475569" stroke-width="1.8"/>
  <line x1="140" y1="238" x2="140" y2="256" stroke="#475569" stroke-width="1.8"/>
  <line x1="218" y1="238" x2="218" y2="256" stroke="#475569" stroke-width="1.8"/>
  <line x1="296" y1="238" x2="296" y2="256" stroke="#475569" stroke-width="1.8"/>
  <line x1="374" y1="238" x2="374" y2="256" stroke="#475569" stroke-width="1.8"/>

  <!-- Çocuklar -->
  <rect x="124" y="256" width="32" height="32" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="140" y="304" font-size="8.5" font-weight="700" fill="#B91C1C" text-anchor="middle">RDS het.</text>
  <text x="140" y="316" font-size="8.5" fill="#64748B" text-anchor="middle">sağlıklı</text>

  <circle cx="218" cy="272" r="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="218" y="304" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">ROM1 het.</text>
  <text x="218" y="316" font-size="8.5" fill="#64748B" text-anchor="middle">sağlıklı</text>

  <rect x="280" y="256" width="32" height="32" fill="#1A2B4A" stroke="#B91C1C" stroke-width="2.4"/>
  <text x="296" y="304" font-size="8.5" font-weight="700" fill="#B91C1C" text-anchor="middle">RDS + ROM1</text>
  <text x="296" y="316" font-size="8.5" font-weight="700" fill="#B91C1C" text-anchor="middle">HASTA</text>

  <circle cx="374" cy="272" r="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="374" y="304" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">ikisi de yok</text>
  <text x="374" y="316" font-size="8.5" fill="#64748B" text-anchor="middle">sağlıklı</text>

  <rect x="56" y="336" width="448" height="62" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="68" y="354" font-size="10.5" font-weight="700" fill="#B45309">Neden kafa karıştırır?</text>
  <text x="68" y="370" font-size="9.5" fill="#2E3440">Her iki ebeveyn de sağlıklı → resesif düşünülür. Ama risk iki AYRI</text>
  <text x="68" y="384" font-size="9.5" fill="#2E3440">lokustan hesaplanır; bu temsili eşleşmede 1/2 × 1/2 = %25 çıkar.</text>

  <!-- ================= PANEL B: karşılaştırma ================= -->
  <rect x="536" y="80" width="324" height="330" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="548" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="558" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="576" y="105" font-size="13" font-weight="700" fill="#2563EB">Genotip → fenotip tablosu</text>

  <!-- tablo başlığı -->
  <rect x="552" y="122" width="292" height="24" rx="5" fill="#1A2B4A"/>
  <text x="618" y="138" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">RDS</text>
  <text x="712" y="138" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">ROM1</text>
  <text x="800" y="138" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Fenotip</text>

  <rect x="552" y="150" width="292" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="618" y="169" font-size="9.5" fill="#2E3440" text-anchor="middle">normal</text>
  <text x="712" y="169" font-size="9.5" fill="#2E3440" text-anchor="middle">normal</text>
  <text x="800" y="169" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">sağlıklı</text>

  <rect x="552" y="184" width="292" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="618" y="203" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">het.</text>
  <text x="712" y="203" font-size="9.5" fill="#2E3440" text-anchor="middle">normal</text>
  <text x="800" y="203" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">sağlıklı</text>

  <rect x="552" y="218" width="292" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="618" y="237" font-size="9.5" fill="#2E3440" text-anchor="middle">normal</text>
  <text x="712" y="237" font-size="9.5" font-weight="700" fill="#2563EB" text-anchor="middle">het.</text>
  <text x="800" y="237" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">sağlıklı</text>

  <rect x="552" y="252" width="292" height="34" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="618" y="273" font-size="9.5" font-weight="700" fill="#B91C1C" text-anchor="middle">het.</text>
  <text x="712" y="273" font-size="9.5" font-weight="700" fill="#2563EB" text-anchor="middle">het.</text>
  <text x="800" y="273" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">HASTA</text>

  <text x="698" y="308" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">Kural: 1 + 1 = hastalık</text>
  <text x="698" y="324" font-size="9.5" fill="#2E3440" text-anchor="middle">Hiçbir tek varyant tek başına yeterli değil.</text>

  <rect x="552" y="336" width="292" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="564" y="354" font-size="10" font-weight="700" fill="#1A2B4A">Mekanizma ipucu</text>
  <text x="564" y="370" font-size="9.5" fill="#2E3440">İki protein aynı yapıda birlikte çalışır</text>
  <text x="564" y="384" font-size="9.5" fill="#2E3440">(fotoreseptör disk kenarı) → ortak doz eşiği.</text>

  <!-- ================= PANEL C: dikkat ================= -->
  <rect x="40" y="426" width="820" height="100" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="436" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="451" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="80" y="451" font-size="13" font-weight="700" fill="#B91C1C">Dikkat: "iki gende varyant var" ≠ "digenik kalıtım"</text>

  <rect x="56" y="464" width="256" height="48" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="68" y="481" font-size="10" font-weight="700" fill="#B91C1C">Yanlış çıkarım</text>
  <text x="68" y="496" font-size="9" fill="#2E3440">"WES'te iki VUS bulundu, demek ki</text>
  <text x="68" y="507" font-size="9" fill="#2E3440">hastalık digenik."</text>

  <rect x="322" y="464" width="256" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="334" y="481" font-size="10" font-weight="700" fill="#B45309">Neden yanlış?</text>
  <text x="334" y="496" font-size="9" fill="#2E3440">Her sağlıklı genomda çok sayıda nadir</text>
  <text x="334" y="507" font-size="9" fill="#2E3440">varyant vardır; rastlantı kaçınılmazdır.</text>

  <rect x="588" y="464" width="256" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="481" font-size="10" font-weight="700" fill="#1D4ED8">Ne gerekir?</text>
  <text x="600" y="496" font-size="9" fill="#2E3440">Ailede birlikte ayrışma + biyolojik bağ</text>
  <text x="600" y="507" font-size="9" fill="#2E3440">(ortak yolak/kompleks) + tekrarlanma.</text>

  <text x="40" y="556" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Digenik kalıtımın pedigri imzası, "iki sağlıklı ebeveynden hasta çocuk" olmasıdır — ama bu imza otozomal resesif kalıtımla birebir aynıdır.</text>
  <text x="40" y="572" font-size="11.5" font-style="italic" fill="#475569">İkisini ayıran şey pedigri değil, iki varyantın FARKLI lokuslarda olması ve tek başlarına hastalık yapmadıklarının gösterilmesidir.</text>
  <text x="860" y="590" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Kajiwara ve ark. (1994); Schäffer (2013)</text>
</svg>
