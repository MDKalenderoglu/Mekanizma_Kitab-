  <text x="32" y="34" font-size="17" font-weight="700" fill="#1A2B4A">Şekil 18.4 — Sekiz senaryo panosu: başvurudan mekanizmaya, mekanizmadan teste</text>
  <text x="32" y="56" font-size="11.5" fill="#64748B">Her kart, 7. başlıkta ayrıntılandırılan bir olgunun omurgasıdır: başvuru tablosu, düşünülen mekanizma, o mekanizmayı görebilen test ve tek cümlelik ders.</text>
