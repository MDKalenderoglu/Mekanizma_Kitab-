<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">İşlev kazanımının (gain-of-function) dört yolu</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#555">Ortak nokta: protein NORMALDEN FAZLA, UYGUNSUZ veya YENİ bir iş yapar — eksik değil, aşırı/yanlış aktivite</text>

  <!-- Panel 1: Artmış aktivite -->
  <rect x="30" y="80" width="385" height="190" rx="10" fill="#fdf3f2" stroke="#e74c3c" stroke-width="2"/>
  <text x="222" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">1) Artmış aktivite (hiperaktivite)</text>
  <text x="222" y="126" text-anchor="middle" font-size="11.5" fill="#555">Aynı işi yapar ama çok daha güçlü/hızlı</text>
  <!-- normal -->
  <text x="110" y="150" text-anchor="middle" font-size="11" fill="#16a085">Normal</text>
  <circle cx="110" cy="185" r="22" fill="#27ae60"/>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">+</text>
  <text x="110" y="230" text-anchor="middle" font-size="10.5" fill="#555">ölçülü çıktı</text>
  <text x="222" y="190" text-anchor="middle" font-size="20" fill="#c0392b">➜</text>
  <!-- gof -->
  <text x="334" y="150" text-anchor="middle" font-size="11" fill="#c0392b">GoF</text>
  <circle cx="334" cy="185" r="22" fill="#e74c3c"/>
  <text x="334" y="190" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">+++</text>
  <text x="334" y="230" text-anchor="middle" font-size="10.5" fill="#c0392b">aşırı çıktı</text>
  <text x="222" y="256" text-anchor="middle" font-size="10.5" fill="#777" font-style="italic">örn. enzim/fosfataz aşırı aktivitesi (PTPN11/SHP-2)</text>

  <!-- Panel 2: Konstitütif aktivasyon -->
  <rect x="445" y="80" width="385" height="190" rx="10" fill="#fdf3f2" stroke="#e74c3c" stroke-width="2"/>
  <text x="637" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">2) Konstitütif (sürekli) aktivasyon</text>
  <text x="637" y="126" text-anchor="middle" font-size="11.5" fill="#555">Açma-kapama anahtarı AÇIK takılır</text>
  <!-- normal switch off needs ligand -->
  <text x="525" y="150" text-anchor="middle" font-size="11" fill="#16a085">Normal: sinyal gerekir</text>
  <rect x="495" y="160" width="60" height="34" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="525" y="182" text-anchor="middle" font-size="11" fill="#16a085">KAPALI</text>
  <text x="525" y="218" text-anchor="middle" font-size="9.5" fill="#555">ligand yoksa sessiz</text>
  <text x="637" y="185" text-anchor="middle" font-size="20" fill="#c0392b">➜</text>
  <text x="748" y="150" text-anchor="middle" font-size="11" fill="#c0392b">GoF: sinyalsiz açık</text>
  <rect x="718" y="160" width="60" height="34" rx="6" fill="#e74c3c"/>
  <text x="748" y="182" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">AÇIK</text>
  <text x="748" y="218" text-anchor="middle" font-size="9.5" fill="#c0392b">ligand olmadan sürekli</text>
  <text x="637" y="256" text-anchor="middle" font-size="10.5" fill="#777" font-style="italic">örn. reseptör tirozin kinaz (FGFR3, RET); iyon kanalı</text>

  <!-- Panel 3: Ektopik / uygunsuz -->
  <rect x="30" y="290" width="385" height="190" rx="10" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="222" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e44ad">3) Uygunsuz yer/zaman (ektopik aktivite)</text>
  <text x="222" y="336" text-anchor="middle" font-size="11.5" fill="#555">Doğru protein ama yanlış doku/dönemde</text>
  <line x1="70" y1="430" x2="375" y2="430" stroke="#bbb" stroke-width="1.5"/>
  <text x="70" y="448" font-size="10" fill="#555">zaman / doku →</text>
  <rect x="120" y="400" width="55" height="28" fill="#27ae60" opacity="0.85"/>
  <text x="147" y="419" text-anchor="middle" font-size="9.5" fill="#fff">doğru yer</text>
  <rect x="280" y="385" width="55" height="43" fill="#8e44ad" opacity="0.85"/>
  <text x="307" y="378" text-anchor="middle" font-size="9.5" fill="#8e44ad">uygunsuz</text>
  <text x="222" y="470" text-anchor="middle" font-size="10.5" fill="#777" font-style="italic">örn. düzenleyici/translokasyon ile yanlış ifade</text>

  <!-- Panel 4: Yeni işlev (neomorf) -->
  <rect x="445" y="290" width="385" height="190" rx="10" fill="#fef5ec" stroke="#e67e22" stroke-width="2"/>
  <text x="637" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#d35400">4) Yeni/değişmiş işlev (neomorfik)</text>
  <text x="637" y="336" text-anchor="middle" font-size="11.5" fill="#555">Protein normalde yapmadığı bir işi yapar</text>
  <circle cx="540" cy="400" r="24" fill="#27ae60"/>
  <text x="540" y="404" text-anchor="middle" font-size="10" fill="#fff">eski iş</text>
  <text x="600" y="405" text-anchor="middle" font-size="20" fill="#e67e22">➜</text>
  <polygon points="690,376 716,420 664,420" fill="#e67e22"/>
  <text x="690" y="410" text-anchor="middle" font-size="9.5" fill="#fff">YENİ iş</text>
  <text x="637" y="455" text-anchor="middle" font-size="10.5" fill="#777" font-style="italic">Bölüm 6 (neomorfik) ile köprü; toksik kazanım dahil</text>

  <text x="430" y="520" text-anchor="middle" font-size="11.5" fill="#444">Öğreti: GoF varyantlar dominanttır, sıklıkla <tspan font-weight="bold">hotspot</tspan> bölgelerde kümelenir ve LoF beklentisi (PVS1) BURADA geçerli değildir.</text>
  <text x="430" y="544" text-anchor="middle" font-size="10" fill="#999">Şekil 4.1 — İşlev kazanımı mekanizmalarının dört temel tipi</text>
</svg>
