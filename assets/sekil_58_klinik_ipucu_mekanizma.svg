<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="780" fill="#ffffff"/>
  <defs><filter id="sh58" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.10"/></filter></defs>
  <text x="32" y="34" font-size="17" font-weight="700" fill="#1A2B4A">Şekil 18.1 — Klinik ipucundan mekanizmaya: hastadan geriye doğru okumak</text>
  <text x="32" y="56" font-size="11.5" fill="#64748B">Kitabın önceki bölümleri mekanizmadan kliniğe ilerledi. Klinik pratik ise ters yönde çalışır: elinizde bir hasta vardır ve doğru mekanizma hipotezi doğru testi seçtirir.</text>
  <rect x="32" y="72" width="1056" height="28" rx="7" fill="#1A2B4A"/>
  <text x="52" y="91" font-size="10.5" font-weight="700" fill="#ffffff">KLİNİK İPUCU</text>
  <text x="500" y="91" font-size="10.5" font-weight="700" fill="#ffffff">DÜŞÜNÜLECEK MEKANİZMA</text>
  <text x="700" y="91" font-size="10.5" font-weight="700" fill="#ffffff">BÖLÜM</text>
  <text x="768" y="91" font-size="10.5" font-weight="700" fill="#ffffff">İLK TANISAL ADIM</text>
  <rect x="32" y="108" width="1056" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
  <rect x="32" y="108" width="5" height="44" rx="2.5" fill="#B45309"/>
  <text x="52" y="127" font-size="11" font-weight="700" fill="#1A2B4A">Segmental · çizgisel (Blaschko) · asimetrik tutulum</text>
  <text x="52" y="142" font-size="9.5" fill="#64748B">mozaik pigmentasyon, tek taraflı aşırı büyüme</text>
  <rect x="486" y="119" width="196" height="22" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="584" y="134" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">MOZAİKLİK</text>
  <text x="722" y="134" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">12</text>
  <text x="768" y="134" font-size="10" fill="#2E3440">Etkilenmiş DOKUDAN derin dizileme (kan yanıltır)</text>
  <rect x="32" y="158" width="1056" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.9"/>
  <rect x="32" y="158" width="5" height="44" rx="2.5" fill="#B91C1C"/>
  <text x="52" y="177" font-size="11" font-weight="700" fill="#1A2B4A">Kuşaklar boyunca erkenleşen ve ağırlaşan tablo</text>
  <text x="52" y="192" font-size="9.5" fill="#64748B">anticipasyon; anne/babadan geçişte fark</text>
  <rect x="486" y="169" width="196" height="22" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="584" y="184" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">TEKRAR GENİŞLEMESİ</text>
  <text x="722" y="184" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">9</text>
  <text x="768" y="184" font-size="10" fill="#2E3440">Hedefli tekrar analizi — standart dizileme görmez</text>
  <rect x="32" y="208" width="1056" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.9"/>
  <rect x="32" y="208" width="5" height="44" rx="2.5" fill="#B91C1C"/>
  <text x="52" y="227" font-size="11" font-weight="700" fill="#1A2B4A">Maternal kalıtım + çok sistemli tutulum + laktat ↑</text>
  <text x="52" y="242" font-size="9.5" fill="#64748B">kas, beyin, göz, işitme, endokrin birlikte</text>
  <rect x="486" y="219" width="196" height="22" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="584" y="234" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">MİTOKONDRİYAL</text>
  <text x="722" y="234" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">11</text>
  <text x="768" y="234" font-size="10" fill="#2E3440">mtDNA dizileme (uygun doku) + nükleer gen paneli</text>
