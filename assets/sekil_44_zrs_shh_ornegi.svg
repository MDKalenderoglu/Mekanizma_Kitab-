<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="s44arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="s44arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 13.3 — ZRS: 1 Mb uzaktaki tek bir baz, elin şeklini nasıl değiştirir?</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Kodlamayan bir varyantın işlev KAZANIMI yapabildiğinin en net örneği: SHH proteini tümüyle normaldir, değişen yalnızca nerede üretildiğidir.</text>

  <!-- ============ PANEL A: lokus mimarisi ============ -->
  <rect x="40" y="80" width="820" height="126" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">Lokus mimarisi — düzenleyici, başka bir genin intronunda saklıdır</text>

  <line x1="80" y1="160" x2="830" y2="160" stroke="#CBD5E1" stroke-width="3"/>

  <!-- SHH geni -->
  <rect x="96" y="150" width="96" height="20" rx="4" fill="#2563EB"/>
  <text x="144" y="164" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">SHH</text>
  <text x="144" y="188" font-size="9.5" fill="#64748B" text-anchor="middle">hedef gen (7q36)</text>

  <!-- mesafe -->
  <line x1="196" y1="136" x2="654" y2="136" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="196" y1="131" x2="196" y2="141" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="654" y1="131" x2="654" y2="141" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="425" y="130" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">≈ 1.000.000 baz (1 Mb)</text>

  <!-- LMBR1 geni -->
  <rect x="560" y="150" width="200" height="20" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="612" y="164" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">LMBR1</text>
  <text x="660" y="188" font-size="9.5" fill="#64748B" text-anchor="middle">(başka bir gen — intron 5)</text>

  <!-- ZRS -->
  <rect x="636" y="148" width="36" height="24" rx="5" fill="#D97706"/>
  <text x="654" y="164" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ZRS</text>

  <text x="80" y="200" font-size="9.5" fill="#475569">ZRS, SHH'den 1 Mb uzakta ve başka bir genin içinde yer alır — bu yüzden hem ekzom hem de "gen çevresi" odaklı analizler onu tümüyle ıskalar.</text>

  <!-- ============ PANEL B: NORMAL ============ -->
  <rect x="40" y="222" width="400" height="240" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="232" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="247" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="80" y="247" font-size="13" font-weight="700" fill="#2563EB">NORMAL — ZRS yalnız arka kenarı açar</text>

  <!-- Uzuv tomurcuğu -->
  <path d="M 120 290 C 200 268, 320 280, 356 330 C 320 384, 200 396, 120 374 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="238" y="278" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">ANTERİOR (başparmak tarafı)</text>
  <text x="238" y="410" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">POSTERİOR (serçe tarafı)</text>

  <!-- ZPA -->
  <ellipse cx="180" cy="366" rx="42" ry="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="180" y="371" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">SHH açık (ZPA)</text>

  <!-- Anterior sessiz -->
  <ellipse cx="180" cy="300" rx="42" ry="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="180" y="305" font-size="9.5" font-weight="700" fill="#94A3B8" text-anchor="middle">SHH kapalı</text>

  <!-- El -->
  <g stroke="#475569" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="290" y1="306" x2="290" y2="334"/>
    <line x1="304" y1="300" x2="304" y2="334"/>
    <line x1="318" y1="298" x2="318" y2="334"/>
    <line x1="332" y1="302" x2="332" y2="334"/>
    <line x1="346" y1="314" x2="346" y2="334"/>
  </g>
  <rect x="284" y="334" width="68" height="22" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="318" y="376" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">5 parmak</text>

  <text x="56" y="436" font-size="9.5" fill="#475569">ZRS, SHH'yi yalnızca uzuv tomurcuğunun ARKA kenarında (ZPA)</text>
  <text x="56" y="450" font-size="9.5" fill="#475569">etkinleştirir; bu asimetri parmak sayısını ve kimliğini belirler.</text>

  <!-- Ayraç -->
  <line x1="450" y1="232" x2="450" y2="452" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ============ PANEL C: VARYANT ============ -->
  <rect x="460" y="222" width="400" height="240" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="472" y="232" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="482" y="247" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="500" y="247" font-size="13" font-weight="700" fill="#B91C1C">ZRS VARYANTI — ön kenar da açılır</text>

  <path d="M 540 290 C 620 268, 740 280, 776 330 C 740 384, 620 396, 540 374 Z" fill="#FEF6F5" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="658" y="278" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">ANTERİOR (başparmak tarafı)</text>
  <text x="658" y="410" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">POSTERİOR (serçe tarafı)</text>

  <ellipse cx="600" cy="366" rx="42" ry="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="600" y="371" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">SHH açık (ZPA)</text>

  <ellipse cx="604" cy="302" rx="50" ry="18" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="604" y="306" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">SHH EKTOPİK açık</text>
  <text x="516" y="307" font-size="14" fill="#FCD34D" stroke="#92400E" stroke-width="0.6" text-anchor="middle">★</text>
  <line x1="526" y1="303" x2="550" y2="303" stroke="#B91C1C" stroke-width="1.3"/>

  <g stroke="#475569" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="700" y1="306" x2="700" y2="334"/>
    <line x1="714" y1="300" x2="714" y2="334"/>
    <line x1="728" y1="298" x2="728" y2="334"/>
    <line x1="742" y1="302" x2="742" y2="334"/>
    <line x1="756" y1="314" x2="756" y2="334"/>
  </g>
  <line x1="686" y1="312" x2="686" y2="334" stroke="#B91C1C" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="680" y="334" width="82" height="22" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="721" y="376" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">FAZLA parmak</text>

  <text x="476" y="436" font-size="9.5" fill="#475569">Tek bir baz değişimi, ZRS'yi ön kenarda da etkin kılar. SHH orada</text>
  <text x="476" y="450" font-size="9.5" fill="#475569">olmaması gereken yerde üretilir → preaksiyel polidaktili.</text>

  <!-- ============ ALT ŞERİT ============ -->
  <rect x="40" y="478" width="820" height="40" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="300" y1="484" x2="300" y2="512" stroke="#CBD5E1" stroke-width="1.3"/>
  <line x1="590" y1="484" x2="590" y2="512" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="170" y="495" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">MEKANİZMA</text>
  <text x="170" y="509" font-size="10" fill="#2E3440" text-anchor="middle">ektopik ifade = işlev kazanımı</text>
  <text x="445" y="495" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">TEST</text>
  <text x="445" y="509" font-size="10" fill="#2E3440" text-anchor="middle">WGS gerekir — ekzom ZRS'yi görmez</text>
  <text x="725" y="495" font-size="9.5" font-weight="700" fill="#1A2B4A" text-anchor="middle">YORUM</text>
  <text x="725" y="509" font-size="10" fill="#2E3440" text-anchor="middle">PVS1 uygulanamaz; PS3/PP3 öne çıkar</text>

  <text x="40" y="542" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Protein dizisinin korunmuş olması, mekanizmanın masum olduğu anlamına gelmez. Hastalığı yapan şey ürünün kendisi değil, yanlış yerde üretilmesidir.</text>
  <text x="860" y="556" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Lettice ve ark. (2003); Gurnett ve ark. (2007)</text>
</svg>
