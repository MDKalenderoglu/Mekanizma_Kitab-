<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 682" width="1120" height="682" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="682" fill="#ffffff"/>
  <defs><filter id="sh57" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.10"/></filter></defs>
  <text x="32" y="34" font-size="17" font-weight="700" fill="#1A2B4A">Şekil 17.4 — VUS'u çözme haritası: hangi ek veri hangi kriteri açar?</text>
  <text x="32" y="56" font-size="11.5" fill="#64748B">VUS bir sonuç değil, bir eksik-kanıt durumudur. Her satır, laboratuvarın veya klinisyenin üretebileceği somut bir veriyi ve onun açtığı kriteri gösterir.</text>
  <rect x="32" y="74" width="1056" height="28" rx="7" fill="#1A2B4A"/>
  <text x="52" y="93" font-size="10.5" font-weight="700" fill="#ffffff">EK VERİ / EYLEM</text>
  <text x="404" y="93" font-size="10.5" font-weight="700" fill="#ffffff">AÇILAN KRİTER</text>
  <text x="590" y="93" font-size="10.5" font-weight="700" fill="#ffffff">TİPİK GÜÇ</text>
  <text x="748" y="93" font-size="10.5" font-weight="700" fill="#ffffff">NOT VE KOŞUL</text>
  <g filter="url(#sh57)"><rect x="32" y="110" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="110" width="5" height="56" rx="2.5" fill="#B91C1C"/>
  <text x="52" y="134" font-size="11.5" font-weight="700" fill="#1A2B4A">Ebeveyn örneği (trio analizi)</text>
  <text x="52" y="151" font-size="9.5" fill="#64748B">varyantın de novo olup olmadığı ve fazın belirlenmesi</text>
  <rect x="392" y="127" width="176" height="22" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="480" y="142" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">PS2 / PM6 · PM3</text>
  <text x="590" y="142" font-size="10.5" font-weight="700" fill="#2E3440">Güçlü → Orta</text>
  <text x="748" y="134" font-size="9.5" fill="#2E3440">Ebeveynlik doğrulanmışsa PS2, doğrulanmamışsa PM6.</text>
  <text x="748" y="150" font-size="9.5" fill="#2E3440">Ebeveyn mozaikliği bu kanıtı zayıflatır (Bölüm 12).</text>
  <g filter="url(#sh57)"><rect x="32" y="172" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="172" width="5" height="56" rx="2.5" fill="#B91C1C"/>
  <text x="52" y="196" font-size="11.5" font-weight="700" fill="#1A2B4A">Genişletilmiş aile — segregasyon</text>
  <text x="52" y="213" font-size="9.5" fill="#64748B">etkilenmiş ve etkilenmemiş akrabaların genotiplenmesi</text>
  <rect x="392" y="189" width="176" height="22" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="480" y="204" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">PP1 / BS4</text>
  <text x="590" y="204" font-size="10.5" font-weight="700" fill="#2E3440">Destekleyici → Güçlü</text>
  <text x="748" y="196" font-size="9.5" fill="#2E3440">Nicel bir kanıttır: her ek bilgilendirici menzil</text>
  <text x="748" y="212" font-size="9.5" fill="#2E3440">kanıt gücünü artırır (Jarvik &amp; Browning, 2016).</text>
  <g filter="url(#sh57)"><rect x="32" y="234" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="234" width="5" height="56" rx="2.5" fill="#B91C1C"/>
  <text x="52" y="258" font-size="11.5" font-weight="700" fill="#1A2B4A">RNA analizi (doğru dokuda)</text>
  <text x="52" y="275" font-size="9.5" fill="#64748B">transkript sonucunun doğrudan ölçülmesi</text>
  <rect x="392" y="251" width="176" height="22" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="480" y="266" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">PS3 + PVS1 gücü</text>
  <text x="590" y="266" font-size="10.5" font-weight="700" fill="#2E3440">Güçlü</text>
  <text x="748" y="258" font-size="9.5" fill="#2E3440">Öngörüyü ölçüme çevirir; splice varyantlarında</text>
  <text x="748" y="274" font-size="9.5" fill="#2E3440">PVS1 basamağını da netleştirir (Walker ve ark., 2023).</text>
  <g filter="url(#sh57)"><rect x="32" y="296" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="296" width="5" height="56" rx="2.5" fill="#B91C1C"/>
  <text x="52" y="320" font-size="11.5" font-weight="700" fill="#1A2B4A">Fonksiyonel test · çoklu-varyant analizi</text>
  <text x="52" y="337" font-size="9.5" fill="#64748B">protein/hücre düzeyinde işlev ölçümü (MAVE dahil)</text>
  <rect x="392" y="313" width="176" height="22" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="480" y="328" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">PS3 / BS3</text>
  <text x="590" y="328" font-size="10.5" font-weight="700" fill="#2E3440">Destekleyici → Güçlü</text>
  <text x="748" y="320" font-size="9.5" fill="#2E3440">Analiz doğrulanmış olmalı ve gücü OddsPath ile</text>
  <text x="748" y="336" font-size="9.5" fill="#2E3440">hesaplanmalıdır (Brnich 2019; Gelman ve ark., 2019).</text>
  <g filter="url(#sh57)"><rect x="32" y="358" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="358" width="5" height="56" rx="2.5" fill="#1D4ED8"/>
  <text x="52" y="382" font-size="11.5" font-weight="700" fill="#1A2B4A">Popülasyon frekansı (hastalığa özgü eşik)</text>
  <text x="52" y="399" font-size="9.5" fill="#64748B">gnomAD frekansının prevalans/penetransla karşılaştırılması</text>
  <rect x="392" y="375" width="176" height="22" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
  <text x="480" y="390" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">PM2 / BS1 / BA1</text>
  <text x="590" y="390" font-size="10.5" font-weight="700" fill="#2E3440">Orta → Tek başına</text>
  <text x="748" y="382" font-size="9.5" fill="#2E3440">Eşik keyfî seçilmez; prevalans, kalıtım, penetrans ve</text>
  <text x="748" y="398" font-size="9.5" fill="#2E3440">alelik heterojeniteden hesaplanır (Whiffin ve ark., 2017).</text>
  <g filter="url(#sh57)"><rect x="32" y="420" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="420" width="5" height="56" rx="2.5" fill="#B45309"/>
  <text x="52" y="444" font-size="11.5" font-weight="700" fill="#1A2B4A">Kalibre edilmiş in silico öngörü</text>
  <text x="52" y="461" font-size="9.5" fill="#64748B">tek bir aracın kalibre edilmiş eşik aralığına göre kullanımı</text>
  <rect x="392" y="437" width="176" height="22" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="480" y="452" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">PP3 / BP4</text>
  <text x="590" y="452" font-size="10.5" font-weight="700" fill="#2E3440">Destekleyici → Orta</text>
  <text x="748" y="444" font-size="9.5" fill="#2E3440">“Birden çok araç aynı yönde” yaklaşımı geçersizdir;</text>
  <text x="748" y="460" font-size="9.5" fill="#2E3440">kalibre eşik kullanılmalıdır (Pejaver ve ark., 2022).</text>
  <g filter="url(#sh57)"><rect x="32" y="482" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="482" width="5" height="56" rx="2.5" fill="#B45309"/>
  <text x="52" y="506" font-size="11.5" font-weight="700" fill="#1A2B4A">Derin fenotipleme</text>
  <text x="52" y="523" font-size="9.5" fill="#64748B">hastalığa özgü ayırt edici bulguların sistematik aranması</text>
  <rect x="392" y="499" width="176" height="22" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="480" y="514" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">PP4 (+ hastalık seçimi)</text>
  <text x="590" y="514" font-size="10.5" font-weight="700" fill="#2E3440">Destekleyici</text>
  <text x="748" y="506" font-size="9.5" fill="#2E3440">Allelik seride asıl işlevi kriter açmak değil,</text>
  <text x="748" y="522" font-size="9.5" fill="#2E3440">DOĞRU hastalık varlığını seçmektir (Bölüm 14).</text>
  <g filter="url(#sh57)"><rect x="32" y="544" width="1056" height="56" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/></g>
  <rect x="32" y="544" width="5" height="56" rx="2.5" fill="#475569"/>
  <text x="52" y="568" font-size="11.5" font-weight="700" fill="#1A2B4A">Veri paylaşımı · yeniden analiz</text>
  <text x="52" y="585" font-size="9.5" fill="#64748B">ClinVar/veri tabanı taraması, olgu eşleştirme, periyodik gözden geçirme</text>
  <rect x="392" y="561" width="176" height="22" rx="7" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
  <text x="480" y="576" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">PS4 / PM3 birikimi</text>
  <text x="590" y="576" font-size="10.5" font-weight="700" fill="#2E3440">Değişken</text>
  <text x="748" y="568" font-size="9.5" fill="#2E3440">VUS'ların önemli kısmı zamanla çözülür; yeniden</text>
  <text x="748" y="584" font-size="9.5" fill="#2E3440">değerlendirme bir plan olmalıdır (Rehm ve ark., 2015).</text>
  <rect x="32" y="612" width="1056" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="560" y="632" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Öğreti: “VUS” raporun sonu değil, bir sonraki adımın adresidir. Doğru soru “bu varyant patojen mi?” değil, “hangi veri eksik?”tir.</text>
  <text x="1088" y="662" font-size="9" fill="#94A3B8" text-anchor="end">Kriter tanımları: Richards ve ark. (2015)</text>
</svg>
