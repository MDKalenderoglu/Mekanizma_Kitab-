<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 1.5 — Penetrans vs Ekspresivite (en sık karıştırılan iki kavram)</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#555">Her iki panelde de 8 kişi AYNI patojen varyantı taşıyor.</text>

  <!-- divider -->
  <line x1="490" y1="70" x2="490" y2="440" stroke="#ddd" stroke-width="2"/>

  <!-- ===== PANEL 1: PENETRANS ===== -->
  <text x="245" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">PENETRANS</text>
  <text x="245" y="112" text-anchor="middle" font-size="12" fill="#333">"Taşıyanların KAÇI hastalanıyor?"</text>
  <text x="245" y="130" text-anchor="middle" font-size="11" fill="#777" font-style="italic">→ var / yok sorusu (kişi sayısı)</text>

  <!-- 8 figures: 6 affected (red), 2 unaffected (gray) -->
  <!-- row of person icons -->
  <g>
    <!-- helper: each person = circle head + rounded body -->
    <!-- affected -->
    <g fill="#e74c3c">
      <circle cx="80" cy="175" r="13"/><rect x="67" y="190" width="26" height="38" rx="9"/>
      <circle cx="130" cy="175" r="13"/><rect x="117" y="190" width="26" height="38" rx="9"/>
      <circle cx="180" cy="175" r="13"/><rect x="167" y="190" width="26" height="38" rx="9"/>
      <circle cx="230" cy="175" r="13"/><rect x="217" y="190" width="26" height="38" rx="9"/>
      <circle cx="280" cy="175" r="13"/><rect x="267" y="190" width="26" height="38" rx="9"/>
      <circle cx="330" cy="175" r="13"/><rect x="317" y="190" width="26" height="38" rx="9"/>
    </g>
    <!-- unaffected carriers -->
    <g fill="#bdc3c7">
      <circle cx="380" cy="175" r="13"/><rect x="367" y="190" width="26" height="38" rx="9"/>
      <circle cx="430" cy="175" r="13"/><rect x="417" y="190" width="26" height="38" rx="9"/>
    </g>
  </g>
  <text x="205" y="255" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="700">6 kişi HASTA</text>
  <text x="405" y="255" text-anchor="middle" font-size="11" fill="#7f8c8d" font-weight="700">2 kişi sağlıklı</text>
  <text x="405" y="271" text-anchor="middle" font-size="10" fill="#7f8c8d">(taşıyıcı ama hiç bulgu yok)</text>

  <rect x="120" y="295" width="250" height="34" rx="6" fill="#fdecea" stroke="#e74c3c"/>
  <text x="245" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">Penetrans = 6/8 = %75 (eksik penetrans)</text>

  <text x="245" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="700">Klinik örnek:</text>
  <text x="245" y="380" text-anchor="middle" font-size="11" fill="#444">Ailede BRCA1 patojen varyantı taşıyan</text>
  <text x="245" y="396" text-anchor="middle" font-size="11" fill="#444">bazı bireyler kanser olur, bazıları olmaz.</text>
  <text x="245" y="418" text-anchor="middle" font-size="11" fill="#c0392b" font-style="italic">Sağlıklı ebeveynde varyant bulunması</text>
  <text x="245" y="433" text-anchor="middle" font-size="11" fill="#c0392b" font-style="italic">varyantı "benign" yapmaz.</text>

  <!-- ===== PANEL 2: EKSPRESIVITE ===== -->
  <text x="735" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#2471a3">EKSPRESİVİTE</text>
  <text x="735" y="112" text-anchor="middle" font-size="12" fill="#333">"Hastalananlarda NE KADAR şiddetli?"</text>
  <text x="735" y="130" text-anchor="middle" font-size="11" fill="#777" font-style="italic">→ derece / biçim sorusu (şiddet)</text>

  <!-- 4 affected figures, all colored, with severity bars; here ALL 8 affected = tam penetrans ama degisken siddet -->
  <g>
    <!-- all affected (blue tones varying) showing all 8 sick but different severity -->
    <g>
      <circle cx="565" cy="175" r="13" fill="#aed6f1"/><rect x="552" y="190" width="26" height="38" rx="9" fill="#aed6f1"/>
      <circle cx="615" cy="175" r="13" fill="#85c1e9"/><rect x="602" y="190" width="26" height="38" rx="9" fill="#85c1e9"/>
      <circle cx="665" cy="175" r="13" fill="#5dade2"/><rect x="652" y="190" width="26" height="38" rx="9" fill="#5dade2"/>
      <circle cx="715" cy="175" r="13" fill="#3498db"/><rect x="702" y="190" width="26" height="38" rx="9" fill="#3498db"/>
      <circle cx="765" cy="175" r="13" fill="#2e86c1"/><rect x="752" y="190" width="26" height="38" rx="9" fill="#2e86c1"/>
      <circle cx="815" cy="175" r="13" fill="#21618c"/><rect x="802" y="190" width="26" height="38" rx="9" fill="#21618c"/>
      <circle cx="865" cy="175" r="13" fill="#1a4f72"/><rect x="852" y="190" width="26" height="38" rx="9" fill="#1a4f72"/>
      <circle cx="915" cy="175" r="13" fill="#0e3950"/><rect x="902" y="190" width="26" height="38" rx="9" fill="#0e3950"/>
    </g>
  </g>
  <!-- severity gradient bar -->
  <defs>
    <linearGradient id="sev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aed6f1"/><stop offset="1" stop-color="#0e3950"/>
    </linearGradient>
  </defs>
  <rect x="552" y="245" width="376" height="14" rx="7" fill="url(#sev)"/>
  <text x="560" y="278" font-size="11" fill="#2471a3">hafif</text>
  <text x="735" y="278" text-anchor="middle" font-size="11" fill="#2471a3">orta</text>
  <text x="905" y="278" text-anchor="end" font-size="11" fill="#0e3950">çok ağır</text>

  <rect x="610" y="295" width="250" height="34" rx="6" fill="#eaf2fb" stroke="#2471a3"/>
  <text x="735" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#2471a3">Penetrans %100 ama şiddet değişken</text>

  <text x="735" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="700">Klinik örnek:</text>
  <text x="735" y="380" text-anchor="middle" font-size="11" fill="#444">Aynı NF1 varyantını taşıyan akrabalarda</text>
  <text x="735" y="396" text-anchor="middle" font-size="11" fill="#444">yalnız sütlü-kahve lekesinden ağır</text>
  <text x="735" y="412" text-anchor="middle" font-size="11" fill="#444">tümörlere kadar değişen tablo görülür.</text>
  <text x="735" y="433" text-anchor="middle" font-size="11" fill="#2471a3" font-style="italic">Aynı genotip → farklı şiddet.</text>
</svg>
