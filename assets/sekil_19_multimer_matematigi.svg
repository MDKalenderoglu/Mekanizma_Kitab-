<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="soft19" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">Neden DN, haploinsufficiency'den daha ağırdır? — "tümü-sağlam kompleks" matematiği</text>

  <!-- column guides -->
  <text x="250" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748B">MEKANİZMA</text>
  <text x="500" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748B">KOMPLEKS BİRLEŞİMİ (½ varyant)</text>
  <text x="772" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748B">TÜMÜ-SAĞLAM KOMPLEKS</text>

  <!-- ===== ROW 1 : Haploinsufficiency ===== -->
  <rect x="24" y="70" width="852" height="78" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="40" y="98" font-size="12" font-weight="700" fill="#1D4ED8">Haploinsufficiency</text>
  <text x="40" y="116" font-size="9.5" fill="#475569">null alel — varyant ÜRÜN yok</text>
  <text x="40" y="134" font-size="9.5" fill="#475569">(tek monomer; zehirleme yok)</text>
  <!-- assembly: one normal subunit, one absent -->
  <circle cx="445" cy="109" r="15" fill="#2563EB"/>
  <circle cx="495" cy="109" r="15" fill="#ffffff" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="495" y="113" text-anchor="middle" font-size="11" fill="#94A3B8">∅</text>
  <text x="540" y="113" font-size="9.5" fill="#475569">sağlam ürün korunur</text>
  <!-- bar 50% -->
  <rect x="650" y="100" width="180" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="650" y="100" width="90" height="18" rx="4" fill="#2563EB"/>
  <text x="772" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">≈ %50 işlev</text>

  <!-- ===== ROW 2 : DN dimer ===== -->
  <rect x="24" y="156" width="852" height="78" rx="10" fill="#FEF6F5" stroke="#F2C9C4" stroke-width="1.3"/>
  <text x="40" y="184" font-size="12" font-weight="700" fill="#B91C1C">DN — dimer (2 alt birim)</text>
  <text x="40" y="202" font-size="9.5" fill="#a02020">tümü-sağlam olasılığı = (½)² </text>
  <text x="40" y="220" font-size="9.5" fill="#a02020">örn. transkripsiyon faktörü dimerleri</text>
  <!-- 4 dimers: NN, NV, VN, VV -->
  <g>
    <circle cx="420" cy="195" r="9" fill="#2563EB"/><circle cx="438" cy="195" r="9" fill="#2563EB"/>
    <circle cx="468" cy="195" r="9" fill="#2563EB"/><circle cx="486" cy="195" r="9" fill="#B91C1C"/>
    <circle cx="516" cy="195" r="9" fill="#B91C1C"/><circle cx="534" cy="195" r="9" fill="#2563EB"/>
    <circle cx="564" cy="195" r="9" fill="#B91C1C"/><circle cx="582" cy="195" r="9" fill="#B91C1C"/>
  </g>
  <text x="429" y="218" text-anchor="middle" font-size="8.5" fill="#16a34a" font-weight="700">✓</text>
  <text x="477" y="218" text-anchor="middle" font-size="8.5" fill="#B91C1C">✗</text>
  <text x="525" y="218" text-anchor="middle" font-size="8.5" fill="#B91C1C">✗</text>
  <text x="573" y="218" text-anchor="middle" font-size="8.5" fill="#B91C1C">✗</text>
  <!-- bar 25% -->
  <rect x="650" y="186" width="180" height="18" rx="4" fill="#FEE2E2"/>
  <rect x="650" y="186" width="45" height="18" rx="4" fill="#B91C1C"/>
  <text x="772" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">≈ %25 (¼)</text>

  <!-- ===== ROW 3 : DN trimer ===== -->
  <rect x="24" y="242" width="852" height="78" rx="10" fill="#FEF6F5" stroke="#F2C9C4" stroke-width="1.3"/>
  <text x="40" y="270" font-size="12" font-weight="700" fill="#B91C1C">DN — trimer (3 alt birim)</text>
  <text x="40" y="288" font-size="9.5" fill="#a02020">tümü-sağlam olasılığı = (½)³</text>
  <text x="40" y="306" font-size="9.5" fill="#a02020">örn. kollajen üçlü sarmalı (OI)</text>
  <!-- trimer triangle normal + poisoned -->
  <g>
    <circle cx="455" cy="270" r="8" fill="#2563EB"/><circle cx="443" cy="288" r="8" fill="#2563EB"/><circle cx="467" cy="288" r="8" fill="#2563EB"/>
    <text x="455" y="312" text-anchor="middle" font-size="8.5" fill="#16a34a" font-weight="700">✓ (yalnız bu)</text>
  </g>
  <g>
    <circle cx="545" cy="270" r="8" fill="#B91C1C"/><circle cx="533" cy="288" r="8" fill="#2563EB"/><circle cx="557" cy="288" r="8" fill="#2563EB"/>
  </g>
  <g>
    <circle cx="610" cy="270" r="8" fill="#2563EB"/><circle cx="598" cy="288" r="8" fill="#B91C1C"/><circle cx="622" cy="288" r="8" fill="#B91C1C"/>
  </g>
  <text x="588" y="312" text-anchor="middle" font-size="8.5" fill="#B91C1C">… ≥1 varyant içeren tüm trimerler ✗</text>
  <!-- bar ~12% -->
  <rect x="650" y="272" width="180" height="18" rx="4" fill="#FEE2E2"/>
  <rect x="650" y="272" width="23" height="18" rx="4" fill="#B91C1C"/>
  <text x="772" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">≈ %12 (⅛)</text>

  <!-- ===== ROW 4 : DN tetramer ===== -->
  <rect x="24" y="328" width="852" height="78" rx="10" fill="#FEF6F5" stroke="#F2C9C4" stroke-width="1.3"/>
  <text x="40" y="356" font-size="12" font-weight="700" fill="#B91C1C">DN — tetramer (4 alt birim)</text>
  <text x="40" y="374" font-size="9.5" fill="#a02020">tümü-sağlam olasılığı = (½)⁴</text>
  <text x="40" y="392" font-size="9.5" fill="#a02020">örn. p53 tetrameri (Li-Fraumeni)</text>
  <!-- tetramer 2x2 normal -->
  <circle cx="445" cy="358" r="8" fill="#2563EB"/><circle cx="463" cy="358" r="8" fill="#2563EB"/>
  <circle cx="445" cy="376" r="8" fill="#2563EB"/><circle cx="463" cy="376" r="8" fill="#2563EB"/>
  <text x="454" y="400" text-anchor="middle" font-size="8.5" fill="#16a34a" font-weight="700">✓ (1/16)</text>
  <text x="560" y="372" text-anchor="middle" font-size="9.5" fill="#B91C1C">diğer 15 kombinasyonun tümü zehirlenir ✗</text>
  <!-- bar ~6% -->
  <rect x="650" y="358" width="180" height="18" rx="4" fill="#FEE2E2"/>
  <rect x="650" y="358" width="12" height="18" rx="4" fill="#B91C1C"/>
  <text x="772" y="396" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">≈ %6 (1/16)</text>

  <!-- severity arrow -->
  <line x1="14" y1="74" x2="14" y2="404" stroke="#D97706" stroke-width="2.4"/>
  <polygon points="14,408 9,398 19,398" fill="#D97706"/>
  <text x="11" y="240" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B45309" transform="rotate(-90 11 240)">artan şiddet →</text>

  <!-- footer -->
  <rect x="24" y="416" width="852" height="44" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="450" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Öğreti: null alel yalnız ürünü azaltır (%50); DN varyant ürünü hem üretir hem sağlamı zehirler.</text>
  <text x="450" y="451" text-anchor="middle" font-size="9.5" fill="#92742a">Kompleks ne kadar çok alt birimliyse "tümü-sağlam" oranı o kadar düşer. Oranlar rastgele birleşme + ½ varyant varsayımıyla temsilîdir.</text>
</svg>
