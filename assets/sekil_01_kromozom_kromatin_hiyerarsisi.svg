<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="460" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">Şekil 1 — DNA'dan Kromozoma: Paketlenme Hiyerarşisi</text>

  <!-- 1. KROMOZOM -->
  <g>
    <!-- iki kardeş kromatid (X şeklinde metafaz kromozomu) -->
    <path d="M120 90 Q105 150 130 195 Q105 240 120 300" stroke="#3b6fb6" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M170 90 Q185 150 160 195 Q185 240 170 300" stroke="#5a8bd0" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- sentromer bandı -->
    <ellipse cx="145" cy="195" rx="40" ry="14" fill="#c0392b" opacity="0.85"/>
    <text x="145" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">Kromozom</text>
    <text x="145" y="370" text-anchor="middle" font-size="11" fill="#444">(metafaz)</text>
    <!-- etiketler -->
    <text x="250" y="100" font-size="11" fill="#c0392b">Sentromer</text>
    <line x1="190" y1="195" x2="248" y2="105" stroke="#c0392b" stroke-width="1"/>
    <text x="40" y="78" font-size="11" fill="#7f5300">Telomer (uçlar)</text>
    <line x1="120" y1="88" x2="80" y2="80" stroke="#7f5300" stroke-width="1"/>
    <text x="55" y="320" font-size="11" fill="#3b6fb6">Kardeş kromatidler</text>
    <line x1="125" y1="290" x2="95" y2="312" stroke="#3b6fb6" stroke-width="1"/>
  </g>
  <text x="305" y="200" font-size="26" fill="#888">→</text>

  <!-- 2. KROMATIN LIFI (coil) -->
  <g>
    <path d="M345 110 C 420 130, 360 170, 430 190 C 360 210, 420 250, 350 270 C 420 290, 360 320, 430 340"
          stroke="#7b539e" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.85"/>
    <text x="390" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">Kromatin lifi</text>
    <text x="390" y="393" text-anchor="middle" font-size="11" fill="#444">(yoğun sarılı DNA+protein)</text>
  </g>
  <text x="470" y="200" font-size="26" fill="#888">→</text>

  <!-- 3. NUKLEOZOM (beads on a string) -->
  <g>
    <line x1="520" y1="195" x2="690" y2="195" stroke="#2c3e50" stroke-width="2.5"/>
    <g fill="#27ae60" stroke="#1e6b40" stroke-width="1.5">
      <circle cx="545" cy="195" r="17"/>
      <circle cx="600" cy="195" r="17"/>
      <circle cx="655" cy="195" r="17"/>
    </g>
    <text x="605" y="265" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">Nükleozomlar</text>
    <text x="605" y="283" text-anchor="middle" font-size="11" fill="#444">"ipe dizili boncuklar"</text>
    <!-- histon etiketi -->
    <text x="545" y="150" text-anchor="middle" font-size="11" fill="#1e6b40">Histon oktameri</text>
    <line x1="545" y1="178" x2="545" y2="158" stroke="#1e6b40" stroke-width="1"/>
    <text x="690" y="170" font-size="11" fill="#2c3e50">DNA ipliği</text>
    <line x1="680" y1="188" x2="690" y2="174" stroke="#2c3e50" stroke-width="1"/>
  </g>
  <text x="710" y="200" font-size="26" fill="#888">→</text>

  <!-- 4. DNA cift sarmal -->
  <g>
    <path d="M770 110 C 820 140, 820 170, 770 200 C 820 230, 820 260, 770 290 C 820 320, 820 350, 770 380"
          stroke="#2980b9" stroke-width="3.5" fill="none"/>
    <path d="M830 110 C 780 140, 780 170, 830 200 C 780 230, 780 260, 830 290 C 780 320, 780 350, 830 380"
          stroke="#16a085" stroke-width="3.5" fill="none"/>
    <!-- baz ciftleri rungs -->
    <g stroke="#9b59b6" stroke-width="2">
      <line x1="788" y1="128" x2="812" y2="128"/>
      <line x1="797" y1="155" x2="803" y2="155"/>
      <line x1="788" y1="188" x2="812" y2="188"/>
      <line x1="797" y1="218" x2="803" y2="218"/>
      <line x1="788" y1="248" x2="812" y2="248"/>
      <line x1="797" y1="278" x2="803" y2="278"/>
      <line x1="788" y1="308" x2="812" y2="308"/>
    </g>
    <text x="800" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">DNA çift sarmalı</text>
    <text x="800" y="426" text-anchor="middle" font-size="11" fill="#444">baz çiftleri (A-T, G-C)</text>
  </g>

  <!-- alt not -->
  <text x="490" y="450" text-anchor="middle" font-size="11" fill="#777" font-style="italic">Aynı DNA dizisi, hücre döngüsüne ve aktiviteye göre gevşek (ökromatin, aktif) ya da sıkı (heterokromatin, sessiz) paketlenir.</text>
</svg>
