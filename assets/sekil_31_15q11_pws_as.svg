<svg viewBox="0 0 920 542" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="920" height="542" fill="#ffffff"/>
  <defs>
    <filter id="s31shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1A2B4A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Başlık -->
  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 10.3 — 15q11–q13: tek bölge, iki hastalık (Prader-Willi ve Angelman)</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Aynı imprintli bölgede kaybın hangi ebeveyn kopyasında olduğuna göre iki farklı sendrom ortaya çıkar.</text>

  <!-- Lokus şeması -->
  <text x="40" y="105" font-size="12" font-weight="700" fill="#1A2B4A">15q11–q13</text>
  <rect x="120" y="80" width="700" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="132" y="88" width="440" height="30" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="352" y="107" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">MKRN3 · NDN · SNRPN · SNORD116  (paternal-ifadeli küme)</text>
  <rect x="584" y="88" width="224" height="30" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="696" y="107" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">UBE3A · maternal (beyin)</text>

  <!-- ============ PWS PANELİ ============ -->
  <rect x="40" y="150" width="392" height="330" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2" filter="url(#s31shadow)"/>
  <rect x="40" y="150" width="392" height="42" rx="12" fill="#DBEAFE"/>
  <rect x="40" y="176" width="392" height="16" fill="#DBEAFE"/>
  <text x="56" y="172" font-size="14" font-weight="700" fill="#1D4ED8">PRADER-WILLI SENDROMU</text>
  <text x="56" y="188" font-size="10.5" fill="#475569">paternal katkının KAYBI → paternal-ifadeli genler yok</text>

  <!-- PWS route 1 -->
  <rect x="56" y="204" width="360" height="44" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="68" y="223" font-size="11.5" font-weight="700" fill="#1A2B4A">Paternal 15q11–q13 delesyonu</text>
  <text x="68" y="239" font-size="9.8" fill="#64748B">en sık neden; genellikle de novo</text>
  <text x="404" y="230" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="end">%65–75</text>

  <!-- PWS route 2 -->
  <rect x="56" y="254" width="360" height="44" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="68" y="273" font-size="11.5" font-weight="700" fill="#1A2B4A">Maternal UPD15</text>
  <text x="68" y="289" font-size="9.8" fill="#64748B">iki kopya da anneden → paternal alel yok</text>
  <text x="404" y="280" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="end">%20–30</text>

  <!-- PWS route 3 -->
  <rect x="56" y="304" width="360" height="44" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="68" y="323" font-size="11.5" font-weight="700" fill="#1A2B4A">İmprinting defekti (ID)</text>
  <text x="68" y="339" font-size="9.8" fill="#64748B">metilasyon hatası; ~%15'i mikrodelesyon</text>
  <text x="404" y="330" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="end">%1–3</text>

  <!-- PWS sonuç -->
  <rect x="56" y="360" width="360" height="104" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
  <text x="68" y="381" font-size="11" font-weight="700" fill="#1D4ED8">FENOTİP</text>
  <text x="68" y="401" font-size="10.5" fill="#1E293B">Neonatal ağır hipotoni + zayıf emme + beslenme</text>
  <text x="68" y="417" font-size="10.5" fill="#1E293B">güçlüğü; sonra hiperfaji, morbid obezite,</text>
  <text x="68" y="433" font-size="10.5" fill="#1E293B">boy kısalığı, hipogonadizm, gelişim geriliği,</text>
  <text x="68" y="449" font-size="10.5" fill="#1E293B">davranışsal fenotip. SNORD116 anahtar bölge.</text>

  <!-- ============ AS PANELİ ============ -->
  <rect x="470" y="150" width="410" height="330" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2" filter="url(#s31shadow)"/>
  <rect x="470" y="150" width="410" height="42" rx="12" fill="#FEF3C7"/>
  <rect x="470" y="176" width="410" height="16" fill="#FEF3C7"/>
  <text x="486" y="172" font-size="14" font-weight="700" fill="#B45309">ANGELMAN SENDROMU</text>
  <text x="486" y="188" font-size="10.5" fill="#475569">maternal katkının KAYBI → UBE3A (beyin) yok</text>

  <!-- AS route 1 -->
  <rect x="486" y="200" width="378" height="40" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="498" y="217" font-size="11.5" font-weight="700" fill="#1A2B4A">Maternal 15q11–q13 delesyonu</text>
  <text x="498" y="232" font-size="9.8" fill="#64748B">en sık; en ağır fenotip</text>
  <text x="852" y="225" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="end">~%70</text>

  <!-- AS route 2 -->
  <rect x="486" y="246" width="378" height="40" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="498" y="263" font-size="11.5" font-weight="700" fill="#1A2B4A">UBE3A patojenik varyantı</text>
  <text x="498" y="278" font-size="9.8" fill="#64748B">tek gen; kalıtsal olabilir (annede taşıyıcı)</text>
  <text x="852" y="271" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="end">~%10</text>

  <!-- AS route 3 -->
  <rect x="486" y="292" width="378" height="40" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="498" y="309" font-size="11.5" font-weight="700" fill="#1A2B4A">Paternal UPD15</text>
  <text x="498" y="324" font-size="9.8" fill="#64748B">iki kopya babadan; daha hafif fenotip</text>
  <text x="852" y="317" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="end">~%2–5</text>

  <!-- AS route 4 -->
  <rect x="486" y="338" width="378" height="40" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="498" y="355" font-size="11.5" font-weight="700" fill="#1A2B4A">İmprinting defekti (ID)</text>
  <text x="498" y="370" font-size="9.8" fill="#64748B">metilasyon hatası</text>
  <text x="852" y="363" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="end">~%2–5</text>

  <!-- AS sonuç -->
  <rect x="486" y="392" width="378" height="72" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="498" y="413" font-size="11" font-weight="700" fill="#B45309">FENOTİP</text>
  <text x="498" y="433" font-size="10.5" fill="#1E293B">Ağır gelişim geriliği, konuşma yokluğu, ataksik</text>
  <text x="498" y="449" font-size="10.5" fill="#1E293B">yürüyüş, nöbet/EEG bozukluğu, uygunsuz gülme.</text>

  <!-- Öğreti footer -->
  <text x="40" y="502" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Metilasyon testi hem PWS hem AS'yi (imprint anormalliğini) yakalar; ancak alt-tipi (delesyon / UPD / ID /</text>
  <text x="40" y="519" font-size="11.5" font-style="italic" fill="#475569">mutasyon) ayırmak ek testler gerektirir — bu ayrım genetik danışmada tekrarlanma riskini belirler.</text>
  <text x="880" y="536" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynak: Cassidy (2012) · Lalande (2007)</text>
</svg>
