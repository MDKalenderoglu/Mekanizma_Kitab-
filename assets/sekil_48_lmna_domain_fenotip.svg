<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <defs>
    <filter id="sh52" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <marker id="okb52" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#2563EB"/>
    </marker>
    <marker id="okr52" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <text x="32" y="34" font-size="17" font-weight="700" fill="#1A2B4A">Şekil 14.3 — Konum fenotibi yazar: LMNA ve laminopatiler</text>
  <text x="32" y="56" font-size="11.5" fill="#64748B">Tek gen, on beşten fazla hastalık. Varyantın proteinin hangi bölgesine düştüğü, hangi dokunun hastalanacağını büyük ölçüde belirler.</text>

  <!-- PANEL A -->
  <rect x="24" y="72" width="1072" height="282" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="36" y="82" width="22" height="22" rx="6" fill="#1A2B4A"/>
  <text x="47" y="98" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="68" y="98" font-size="13" font-weight="700" fill="#1A2B4A">Lamin A/C domain haritası ve fenotip kümeleri</text>

  <!-- Fenotip kümeleri (üstte) -->
  <g stroke="#2563EB" stroke-width="1.4" fill="none">
    <path d="M160 176 V150 H560 V176"/>
  </g>
  <rect x="214" y="112" width="292" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="360" y="127" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">ÇİZGİLİ KAS ve KALP</text>
  <text x="360" y="141" font-size="9.5" fill="#1D4ED8" text-anchor="middle">EDMD · LGMD1B · dilate KMP + ileti hastalığı</text>

  <g stroke="#D97706" stroke-width="1.4" fill="none">
    <path d="M620 176 V150 H820 V176"/>
  </g>
  <rect x="602" y="112" width="236" height="34" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="720" y="127" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">YAĞ DOKUSU</text>
  <text x="720" y="141" font-size="9.5" fill="#B45309" text-anchor="middle">Dunnigan tipi kısmi lipodistrofi (p.Arg482)</text>

  <g stroke="#B91C1C" stroke-width="1.4" fill="none">
    <path d="M960 176 V150 H1010 V176"/>
  </g>
  <rect x="864" y="112" width="224" height="34" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  <text x="976" y="127" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">PREMATÜR YAŞLANMA</text>
  <text x="976" y="141" font-size="9.5" fill="#B91C1C" text-anchor="middle">HGPS — ekzon 11, c.1824C&gt;T (p.Gly608Gly)</text>

  <!-- Protein çubuğu -->
  <g filter="url(#sh52)">
    <rect x="110" y="176" width="50" height="40" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <rect x="160" y="176" width="400" height="40" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <rect x="560" y="176" width="60" height="40" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <rect x="620" y="176" width="200" height="40" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <rect x="820" y="176" width="190" height="40" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <rect x="1010" y="176" width="40" height="40" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
  </g>
  <g stroke="#2563EB" stroke-width="1" opacity="0.5">
    <line x1="260" y1="180" x2="260" y2="212"/>
    <line x1="360" y1="180" x2="360" y2="212"/>
    <line x1="460" y1="180" x2="460" y2="212"/>
  </g>
  <text x="135" y="201" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">baş</text>
  <text x="360" y="201" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">çubuk (rod) domaini — sarmal 1A · 1B · 2A · 2B</text>
  <text x="590" y="201" font-size="9" fill="#64748B" text-anchor="middle">bağ.</text>
  <text x="720" y="201" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Ig-benzeri domain</text>
  <text x="915" y="201" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">C-ucu kuyruk (ekzon 11–12)</text>
  <text x="1030" y="196" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle">CaaX</text>
  <text x="1030" y="208" font-size="8.5" fill="#B91C1C" text-anchor="middle">farnesil</text>

  <!-- Varyant yıldızları -->
  <g fill="#FCD34D" stroke="#92400E" stroke-width="1">
    <path d="M720 232 l3.4 7.0 7.7 1.1 -5.6 5.4 1.4 7.6 -6.9 -3.6 -6.9 3.6 1.4 -7.6 -5.6 -5.4 7.7 -1.1 Z"/>
    <path d="M975 232 l3.4 7.0 7.7 1.1 -5.6 5.4 1.4 7.6 -6.9 -3.6 -6.9 3.6 1.4 -7.6 -5.6 -5.4 7.7 -1.1 Z"/>
  </g>
  <text x="720" y="268" font-size="9.5" fill="#64748B" text-anchor="middle">p.Arg482Trp/Gln</text>
  <text x="975" y="268" font-size="9.5" fill="#64748B" text-anchor="middle">c.1824C&gt;T</text>
  <text x="360" y="240" font-size="9.5" fill="#64748B" text-anchor="middle">kas fenotipli varyantlar bu bölgeye dağınık yerleşir — tek bir hotspot yoktur</text>

  <text x="40" y="296" font-size="10.5" fill="#2E3440">Lamin A/C bütün post-mitotik hücrelerde ifade edilir; buna rağmen hastalıklar doku-seçicidir. Bunun nedeni, proteinin farklı bölgelerinin farklı</text>
  <text x="40" y="312" font-size="10.5" fill="#2E3440">ortaklarla çalışmasıdır: çubuk domaini lamina polimerizasyonunu ve mekanik dayanıklılığı taşır (sürekli gerilen kasta kritiktir), Ig-benzeri domain</text>
  <text x="40" y="328" font-size="10.5" fill="#2E3440">ise SREBP-1 gibi transkripsiyon ortaklarıyla etkileşir (yağ dokusunda kritiktir). Aynı gen, farklı arayüz, farklı hastalık.</text>
  <text x="40" y="346" font-size="9.5" fill="#94A3B8">Kaynaklar: Worman (2012); Bertrand ve ark. (2011); Eriksson ve ark. (2003)</text>

  <!-- PANEL B -->
  <rect x="24" y="366" width="1072" height="204" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="36" y="376" width="22" height="22" rx="6" fill="#1A2B4A"/>
  <text x="47" y="392" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="68" y="392" font-size="13" font-weight="700" fill="#1A2B4A">Aynı gende bambaşka bir mekanizma: HGPS'de sessiz bir değişim yeni bir protein üretir</text>

  <text x="40" y="434" font-size="11" font-weight="700" fill="#2563EB">NORMAL</text>
  <g>
    <rect x="120" y="410" width="172" height="46" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="206" y="430" font-size="10" fill="#1D4ED8" text-anchor="middle">prelamin A sentezlenir</text>
    <text x="206" y="444" font-size="9.5" fill="#1D4ED8" text-anchor="middle">(öncü protein)</text>

    <rect x="308" y="410" width="172" height="46" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="394" y="430" font-size="10" fill="#1D4ED8" text-anchor="middle">C-ucu CaaX motifi</text>
    <text x="394" y="444" font-size="9.5" fill="#1D4ED8" text-anchor="middle">farnesillenir (zara tutunur)</text>

    <rect x="496" y="410" width="172" height="46" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="582" y="430" font-size="10" fill="#1D4ED8" text-anchor="middle">ZMPSTE24 son parçayı</text>
    <text x="582" y="444" font-size="9.5" fill="#1D4ED8" text-anchor="middle">keser: kesim yeri mevcut</text>

    <rect x="684" y="410" width="172" height="46" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="770" y="430" font-size="10" fill="#1D4ED8" text-anchor="middle">farnesil grubu ATILIR</text>
    <text x="770" y="444" font-size="9.5" fill="#1D4ED8" text-anchor="middle">protein serbestleşir</text>

    <rect x="872" y="410" width="172" height="46" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.2"/>
    <text x="958" y="430" font-size="10" font-weight="700" fill="#1A2B4A" text-anchor="middle">matür lamin A</text>
    <text x="958" y="444" font-size="9.5" fill="#2E3440" text-anchor="middle">düzgün nükleer lamina</text>
  </g>
  <g stroke="#2563EB" stroke-width="1.4" fill="none" marker-end="url(#okb52)">
    <path d="M292 433 H304"/>
    <path d="M480 433 H492"/>
    <path d="M668 433 H680"/>
    <path d="M856 433 H868"/>
  </g>

  <text x="40" y="508" font-size="11" font-weight="700" fill="#B91C1C">HGPS</text>
  <g>
    <rect x="120" y="484" width="172" height="46" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
    <text x="206" y="504" font-size="10" fill="#B91C1C" text-anchor="middle">c.1824C&gt;T — amino asidi</text>
    <text x="206" y="518" font-size="9.5" fill="#B91C1C" text-anchor="middle">DEĞİŞTİRMEYEN değişim</text>

    <rect x="308" y="484" width="172" height="46" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
    <text x="394" y="504" font-size="10" fill="#B91C1C" text-anchor="middle">ekzon 11 içindeki kriptik</text>
    <text x="394" y="518" font-size="9.5" fill="#B91C1C" text-anchor="middle">splice bölgesi güçlenir</text>

    <rect x="496" y="484" width="172" height="46" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
    <text x="582" y="504" font-size="10" fill="#B91C1C" text-anchor="middle">50 amino asit silinir:</text>
    <text x="582" y="518" font-size="9.5" fill="#B91C1C" text-anchor="middle">ZMPSTE24 kesim yeri YOK</text>

    <rect x="684" y="484" width="172" height="46" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
    <text x="770" y="504" font-size="10" fill="#B91C1C" text-anchor="middle">farnesil KALICI olarak</text>
    <text x="770" y="518" font-size="9.5" fill="#B91C1C" text-anchor="middle">proteinde kalır</text>

    <rect x="872" y="484" width="172" height="46" rx="8" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.2"/>
    <text x="958" y="504" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">PROGERİN birikir</text>
    <text x="958" y="518" font-size="9.5" fill="#FEE2E2" text-anchor="middle">bozuk çekirdek zarfı</text>
  </g>
  <g stroke="#B91C1C" stroke-width="1.4" fill="none" marker-end="url(#okr52)">
    <path d="M292 507 H304"/>
    <path d="M480 507 H492"/>
    <path d="M668 507 H680"/>
    <path d="M856 507 H868"/>
  </g>

  <text x="40" y="554" font-size="10" fill="#2E3440">Bu, kitabın üç bölümünü tek varyantta birleştirir: sessiz görünen bir değişim <tspan font-weight="700">splicing</tspan> yoluyla (Bölüm 7) yeni bir ürün doğurur; ürün yabanıl-tipi de bozduğu için</text>
  <text x="40" y="566" font-size="10" fill="#2E3440">mekanizma basit bir işlev kaybı değil <tspan font-weight="700">dominant-negatif/neomorfik</tspan> karakterdedir (Bölüm 5–6). Aynı gendeki kas varyantları ise bu yolu hiç kullanmaz.</text>

  <rect x="24" y="582" width="1072" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="560" y="602" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">Öğreti: Bir gende “varyant konumu” yalnız ağırlığı değil, hastalığın kimliğini ve mekanizmasını da değiştirebilir.</text>
</svg>
