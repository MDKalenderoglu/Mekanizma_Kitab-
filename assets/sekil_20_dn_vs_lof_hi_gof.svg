<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">Dört mekanizmayı ayırmak: "tam delesyon/null ne yapıyor?" anahtar sorudur</text>

  <!-- column headers -->
  <rect x="180" y="42" width="180" height="40" rx="8" fill="#EFF4FB" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="270" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">Resesif LoF</text>
  <text x="270" y="75" text-anchor="middle" font-size="9" fill="#64748B">(iki kopya işlevsiz)</text>

  <rect x="364" y="42" width="180" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
  <text x="454" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">Haploinsufficiency</text>
  <text x="454" y="75" text-anchor="middle" font-size="9" fill="#2456c9">(%50 yetmez)</text>

  <rect x="548" y="42" width="180" height="40" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="638" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B91C1C">Dominant-negatif</text>
  <text x="638" y="75" text-anchor="middle" font-size="9" fill="#a02020">(bu bölüm)</text>

  <rect x="732" y="42" width="180" height="40" rx="8" fill="#FEF6F5" stroke="#D97706" stroke-width="1.3"/>
  <text x="822" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B45309">Gain-of-function</text>
  <text x="822" y="75" text-anchor="middle" font-size="9" fill="#92742a">(fazla/yeni aktivite)</text>

  <!-- row labels + cells -->
  <!-- Row 1: net etki -->
  <rect x="20" y="90" width="156" height="44" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="28" y="116" font-size="10.5" font-weight="700" fill="#1A2B4A">Net moleküler etki</text>
  <text x="270" y="110" text-anchor="middle" font-size="9.5" fill="#2E3440">her iki kopya</text>
  <text x="270" y="124" text-anchor="middle" font-size="9.5" fill="#2E3440">işlevsiz</text>
  <text x="454" y="110" text-anchor="middle" font-size="9.5" fill="#2E3440">tek kopya ürünü</text>
  <text x="454" y="124" text-anchor="middle" font-size="9.5" fill="#2E3440">yetersiz kalır</text>
  <text x="638" y="110" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C">varyant ürün</text>
  <text x="638" y="124" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C">sağlamı zehirler</text>
  <text x="822" y="110" text-anchor="middle" font-size="9.5" fill="#2E3440">artmış / yeni</text>
  <text x="822" y="124" text-anchor="middle" font-size="9.5" fill="#2E3440">aktivite</text>

  <!-- Row 2: kalıtım -->
  <rect x="20" y="140" width="156" height="38" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="28" y="163" font-size="10.5" font-weight="700" fill="#1A2B4A">Tipik kalıtım</text>
  <text x="270" y="163" text-anchor="middle" font-size="9.5" fill="#2E3440">otozomal resesif</text>
  <text x="454" y="163" text-anchor="middle" font-size="9.5" fill="#2E3440">dominant</text>
  <text x="638" y="163" text-anchor="middle" font-size="9.5" fill="#2E3440">dominant</text>
  <text x="822" y="163" text-anchor="middle" font-size="9.5" fill="#2E3440">dominant</text>

  <!-- Row 3: deletion test (HIGHLIGHT) -->
  <rect x="20" y="184" width="156" height="58" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="28" y="206" font-size="10.5" font-weight="700" fill="#B45309">Tam delesyon/null</text>
  <text x="28" y="220" font-size="10.5" font-weight="700" fill="#B45309">ne yapar?</text>
  <text x="28" y="235" font-size="8.5" font-style="italic" fill="#92742a">(anahtar ayraç)</text>
  <text x="270" y="210" text-anchor="middle" font-size="9.5" fill="#2E3440">hastalığı</text>
  <text x="270" y="224" text-anchor="middle" font-size="9.5" fill="#2E3440">zaten null yapar</text>
  <rect x="366" y="188" width="176" height="50" rx="6" fill="#DBEAFE" opacity="0.5"/>
  <text x="454" y="208" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">null = hastalık</text>
  <text x="454" y="222" text-anchor="middle" font-size="9" fill="#2456c9">(delesyon fenotip yapar)</text>
  <rect x="550" y="188" width="176" height="50" rx="6" fill="#FEE2E2"/>
  <text x="638" y="206" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C">null genelde DAHA</text>
  <text x="638" y="220" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C">HAFİF / sağlıklı</text>
  <text x="638" y="233" text-anchor="middle" font-size="8.5" fill="#a02020">(zehir kaybolur)</text>
  <text x="822" y="208" text-anchor="middle" font-size="9.5" fill="#2E3440">null sağlıklı veya</text>
  <text x="822" y="222" text-anchor="middle" font-size="9.5" fill="#2E3440">farklı/zıt fenotip</text>

  <!-- Row 4: severity -->
  <rect x="20" y="248" width="156" height="38" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="28" y="271" font-size="10.5" font-weight="700" fill="#1A2B4A">Şiddet (HI'ya göre)</text>
  <text x="270" y="271" text-anchor="middle" font-size="9.5" fill="#94A3B8">—</text>
  <text x="454" y="271" text-anchor="middle" font-size="9.5" fill="#2E3440">referans</text>
  <text x="638" y="271" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C">çoğu kez DAHA AĞIR</text>
  <text x="822" y="271" text-anchor="middle" font-size="9.5" fill="#94A3B8">— (yöne bağlı)</text>

  <!-- Row 5: ACMG -->
  <rect x="20" y="292" width="156" height="52" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="28" y="315" font-size="10.5" font-weight="700" fill="#1A2B4A">ACMG / PVS1</text>
  <text x="28" y="330" font-size="10.5" font-weight="700" fill="#1A2B4A">ipucu</text>
  <text x="270" y="315" text-anchor="middle" font-size="9" fill="#2E3440">PVS1 uygulanır</text>
  <text x="270" y="329" text-anchor="middle" font-size="8.5" fill="#64748B">(LoF mekanizma)</text>
  <text x="454" y="315" text-anchor="middle" font-size="9" fill="#2E3440">PVS1 uygulanır</text>
  <text x="454" y="329" text-anchor="middle" font-size="8.5" fill="#64748B">(LoF = hastalık)</text>
  <rect x="550" y="296" width="176" height="44" rx="6" fill="#FEE2E2"/>
  <text x="638" y="313" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">PVS1'e DİKKAT!</text>
  <text x="638" y="327" text-anchor="middle" font-size="8.5" fill="#a02020">null, DN'i taklit etmeyebilir</text>
  <text x="822" y="315" text-anchor="middle" font-size="9" fill="#2E3440">PVS1 uygulanmaz</text>
  <text x="822" y="329" text-anchor="middle" font-size="8.5" fill="#64748B">PM1/PS3 öne çıkar</text>

  <!-- vertical separators -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="362" y1="90" x2="362" y2="344"/><line x1="546" y1="90" x2="546" y2="344"/><line x1="730" y1="90" x2="730" y2="344"/>
  </g>

  <!-- footer takeaway -->
  <rect x="20" y="356" width="900" height="124" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="40" y="380" font-size="12.5" font-weight="700" fill="#1A2B4A">Anahtar ayraç — tam gen delesyonu (null) ne yapıyor?</text>
  <text x="40" y="404" font-size="10.5" fill="#2E3440">• Delesyon hastalığı <tspan font-weight="700" fill="#1D4ED8">kopyalıyorsa</tspan> → mekanizma haploinsufficiency / LoF'tur (eksiklik hastalığı).</text>
  <text x="40" y="426" font-size="10.5" fill="#2E3440">• Delesyon <tspan font-weight="700" fill="#B91C1C">sağlıklıysa veya daha hafif/farklı</tspan> fenotip yapıyorsa → DN veya GoF düşün (hastalık "yokluktan" değil, varyant ürünün <tspan font-weight="700">varlığından</tspan> doğar).</text>
  <text x="40" y="448" font-size="10.5" fill="#2E3440">• Pratik sonuç: DN'li bir gende kısaltıcı/null varyanta <tspan font-weight="700" fill="#B45309">otomatik PVS1 verme</tspan>; çünkü o gende null, hastalık mekanizmasını temsil etmeyebilir.</text>
  <text x="40" y="470" font-size="9.5" font-style="italic" fill="#64748B">Örnek: COL1A1 null alel → hafif OI tip I; COL1A1 yapısal (glisin) varyant → ağır OI (DN). Aynı gen, zıt ağırlık.</text>
</svg>
