<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="680" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 15.4 — “Bu hastalık digenik” demek için ne gerekir?</text>
  <text x="40" y="56" font-size="12" fill="#64748B">İki gende varyant bulunması başlangıç gözlemidir; zorunlu digenik nedensellik, altı bağımsız kanıt sorusuyla sınanır.</text>

  <rect x="40" y="80" width="440" height="410" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">Altı basamaklı digenik iddia kontrolü</text>
  <text x="56" y="126" font-size="9" font-style="italic" fill="#64748B">🏷️ Pedagojik sentez; resmî ACMG/ClinGen puanlama sistemi değildir.</text>

  <rect x="56" y="140" width="408" height="48" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
  <circle cx="80" cy="164" r="12" fill="#475569"/>
  <text x="80" y="169" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="102" y="159" font-size="10" font-weight="700" fill="#1A2B4A">Her iki gen–hastalık ilişkisi geçerli mi?</text>
  <text x="102" y="175" font-size="9" fill="#2E3440">Fenotip, allelik gereksinim ve gen düzeyi kanıt ayrı sınanır.</text>

  <rect x="56" y="196" width="408" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <circle cx="80" cy="220" r="12" fill="#D97706"/>
  <text x="80" y="225" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="102" y="215" font-size="10" font-weight="700" fill="#B45309">Tek-lokuslu açıklama gerçekten yetersiz mi?</text>
  <text x="102" y="231" font-size="9" fill="#2E3440">Kapsama, faz, CNV/SV, splice, mozaiklik ve fenokopi gözden geçirilir.</text>

  <rect x="56" y="252" width="408" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <circle cx="80" cy="276" r="12" fill="#D97706"/>
  <text x="80" y="281" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="102" y="271" font-size="10" font-weight="700" fill="#B45309">Popülasyon ve iki-lokuslu segregasyon destekliyor mu?</text>
  <text x="102" y="287" font-size="9" fill="#2E3440">Rastlantısal eşleşme, soy, yaş, penetrans ve sağlıklı akrabalar hesaba katılır.</text>

  <rect x="56" y="308" width="408" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
  <circle cx="80" cy="332" r="12" fill="#2563EB"/>
  <text x="80" y="337" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="102" y="327" font-size="10" font-weight="700" fill="#1D4ED8">Bağımsız aile veya kohortta tekrar var mı?</text>
  <text x="102" y="343" font-size="9" fill="#2E3440">Aynı gen çifti ve uyumlu fenotip akraba olmayan olgularda yeniden görülür.</text>

  <rect x="56" y="364" width="408" height="48" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="80" cy="388" r="12" fill="#1D4ED8"/>
  <text x="80" y="393" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="102" y="383" font-size="10" font-weight="700" fill="#1D4ED8">WT / A / B / A+B ortak-etki deneyi yapıldı mı?</text>
  <text x="102" y="399" font-size="9" fill="#2E3440">Birleşimin modele özgü ek veya eşik-aşan etkisi doğrudan sınanır.</text>

  <rect x="56" y="420" width="408" height="48" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <circle cx="80" cy="444" r="12" fill="#B91C1C"/>
  <text x="80" y="449" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="102" y="439" font-size="10" font-weight="700" fill="#B91C1C">Dual tanı ve modifier modeli dışlandı mı?</text>
  <text x="102" y="455" font-size="9" fill="#2E3440">Poligenik arka plan ve rastlantısal ikinci VUS da rakip açıklamalardır.</text>

  <rect x="496" y="80" width="364" height="410" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="508" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="518" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="536" y="105" font-size="13" font-weight="700" fill="#B91C1C">ACMG/AMP kapsam sınırı</text>

  <rect x="512" y="124" width="332" height="78" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="524" y="143" font-size="10" font-weight="700" fill="#1A2B4A">Kılavuzun gerçek kapsamı</text>
  <text x="524" y="160" font-size="9.5" fill="#2E3440">Özellikle Mendelci hastalıklarda varyant sınıflandırması;</text>
  <text x="524" y="175" font-size="9.5" fill="#2E3440">çok-genli Mendelci olmayan kompleks hastalıklar kapsam dışıdır.</text>
  <text x="524" y="190" font-size="9" font-style="italic" fill="#64748B">Aday genlerde ayrıca sakınım istenir (Richards ve ark., 2015).</text>

  <rect x="512" y="216" width="332" height="66" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="524" y="236" font-size="10" font-weight="700" fill="#B91C1C">Varyant sınıfı ≠ çift-lokus nedenselliği</text>
  <text x="524" y="253" font-size="9" fill="#2E3440">A ve B ayrı sınıflandırılır; ancak bu iki etiket, A+B'nin</text>
  <text x="524" y="267" font-size="9" fill="#2E3440">belirli fenotipi birlikte oluşturduğunu kendiliğinden kanıtlamaz.</text>

  <rect x="512" y="296" width="332" height="66" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="524" y="316" font-size="10" font-weight="700" fill="#B91C1C">Segregasyon iki lokus üzerinden okunur</text>
  <text x="524" y="333" font-size="9" fill="#2E3440">Tek-varyant taşıyıcısı “uyumsuz” diye otomatik elenmez;</text>
  <text x="524" y="347" font-size="9" fill="#2E3440">yaş, penetrans, fenokopi ve eksik genotipleme birlikte incelenir.</text>

  <rect x="512" y="376" width="332" height="82" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="524" y="396" font-size="10" font-weight="700" fill="#1D4ED8">Raporlama ilkesi</text>
  <text x="524" y="413" font-size="9" fill="#2E3440">Her varyantın sınıfını ve gen–hastalık bağlamını ayrı yaz;</text>
  <text x="524" y="427" font-size="9" fill="#2E3440">çift-lokus hipotezini kanıt basamaklarıyla ayrıca açıkla.</text>
  <text x="524" y="445" font-size="9" font-weight="700" fill="#1D4ED8">Eksik kanıt varsa: “aday/olası digenik model”.</text>

  <rect x="40" y="508" width="820" height="112" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="518" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="533" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="80" y="533" font-size="13" font-weight="700" fill="#2563EB">Genetik danışmada ne söylenir?</text>

  <rect x="56" y="548" width="256" height="56" rx="8" fill="#F8FAFC" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="184" y="566" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">ZORUNLU DİGENİK</text>
  <text x="68" y="582" font-size="9" fill="#2E3440">Aileye özgü iki-lokus aktarımı hesaplanır;</text>
  <text x="68" y="596" font-size="9" fill="#2E3440">sonuç bazı eşleşmelerde %25 olabilir.</text>

  <rect x="322" y="548" width="256" height="56" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="566" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">OLİGOGENİK / MODIFIER</text>
  <text x="334" y="582" font-size="9" fill="#2E3440">Düzenlenmeye özgü doğrulanmış ampirik veri</text>
  <text x="334" y="596" font-size="9" fill="#2E3440">yoksa genel bir yüzde verilmez.</text>

  <rect x="588" y="548" width="256" height="56" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="716" y="566" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">HER İKİSİNDE</text>
  <text x="600" y="582" font-size="9" fill="#2E3440">Genotipik aktarımı klinik riske eşitlemeden</text>
  <text x="600" y="596" font-size="9" fill="#2E3440">penetrans, bağlantı ve belirsizliği yaz.</text>

  <text x="40" y="646" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Altı basamak bir puan toplamı değildir. Kanıtlar birlikte zorunlu digenik modeli rakip açıklamalardan daha iyi desteklemiyorsa sonuç “aday/olası” düzeyinde kalır.</text>
  <text x="860" y="670" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Schäffer (2013); MacArthur ve ark. (2014); Richards ve ark. (2015)</text>
</svg>
