<svg viewBox="0 0 900 545" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="545" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A2B4A">Şekil 12.3 — VAF, yöntem duyarlılığı ve doku seçimi: mozaikliği neden kaçırırız?</text>
  <text x="40" y="56" font-size="12" fill="#64748B">Mozaik bir varyant, yanlış dokuda veya yeterince derin olmayan bir yöntemle bakıldığında var olduğu hâlde raporda görünmez.</text>

  <!-- ============ PANEL A ============ -->
  <rect x="40" y="80" width="410" height="260" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="80" y="105" font-size="13" font-weight="700" fill="#2563EB">VAF nedir? Okumaların yüzdesi</text>
  <text x="52" y="124" font-size="9.5" fill="#64748B">Dizileme okumalarının kaçında varyant alel görülüyor?</text>

  <line x1="228" y1="146" x2="228" y2="286" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="135" y="158" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Konstitüsyonel heterozigot</text>
  <text x="333" y="158" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Mozaik varyant</text>

  <!-- Sol: 20 okuma, 10 mutant -->
  <g>
    <rect x="70" y="170" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="181" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="192" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="203" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="214" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="225" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="236" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="247" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="258" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="70" y="269" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="132" y="170" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="181" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="192" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="203" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="214" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="225" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="236" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="247" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="258" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="132" y="269" width="52" height="7" rx="2" fill="#93A9CE"/>
  </g>

  <!-- Sağ: 20 okuma, 2 mutant -->
  <g>
    <rect x="268" y="170" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="268" y="181" width="52" height="7" rx="2" fill="#B91C1C"/>
    <rect x="268" y="192" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="203" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="214" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="225" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="236" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="247" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="258" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="268" y="269" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="170" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="181" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="192" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="203" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="214" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="225" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="236" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="247" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="258" width="52" height="7" rx="2" fill="#93A9CE"/>
    <rect x="330" y="269" width="52" height="7" rx="2" fill="#93A9CE"/>
  </g>

  <text x="135" y="298" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">VAF ≈ %50</text>
  <text x="333" y="298" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">VAF ≈ %10</text>
  <text x="135" y="313" font-size="9" fill="#64748B" text-anchor="middle">tüm hücrelerde tek kopya</text>
  <text x="333" y="313" font-size="9" fill="#64748B" text-anchor="middle">hücrelerin ≈%20'sinde</text>

  <text x="52" y="332" font-size="9" fill="#475569">Heterozigot bir varyantta VAF, varyantı taşıyan hücre oranının yaklaşık YARISIDIR.</text>

  <!-- ============ PANEL B ============ -->
  <rect x="470" y="80" width="390" height="260" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="482" y="90" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="492" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="510" y="105" font-size="13" font-weight="700" fill="#2563EB">Yöntemin saptama tabanı</text>
  <text x="482" y="124" font-size="9.5" fill="#64748B">Temsilî sınırlar — laboratuvara ve derinliğe göre değişir.</text>
  <text x="482" y="143" font-size="9" fill="#B45309">Düşük VAF'lı varyant, yöntem yeterince derin değilse GÖRÜNMEZ.</text>

  <text x="482" y="172" font-size="9.5" font-weight="700" fill="#2E3440">ddPCR / UMI derin dizileme — ≥%0,1</text>
  <rect x="620" y="178" width="220" height="16" rx="4" fill="#2563EB"/>

  <text x="482" y="211" font-size="9.5" font-weight="700" fill="#2E3440">Derin hedefli panel &gt;1000× — ≥%1</text>
  <rect x="701" y="217" width="139" height="16" rx="4" fill="#2563EB"/>

  <text x="482" y="250" font-size="9.5" font-weight="700" fill="#2E3440">Standart WES/panel ~100× — ≥%10</text>
  <rect x="783" y="256" width="57" height="16" rx="4" fill="#D97706"/>

  <text x="482" y="289" font-size="9.5" font-weight="700" fill="#2E3440">Sanger dizileme — ≥%15–20</text>
  <rect x="807" y="295" width="33" height="16" rx="4" fill="#B91C1C"/>

  <line x1="620" y1="318" x2="845" y2="318" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="620" y1="318" x2="620" y2="323" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="701" y1="318" x2="701" y2="323" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="783" y1="318" x2="783" y2="323" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="840" y1="318" x2="840" y2="323" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="620" y="333" font-size="9" fill="#64748B" text-anchor="middle">%0,1</text>
  <text x="701" y="333" font-size="9" fill="#64748B" text-anchor="middle">%1</text>
  <text x="783" y="333" font-size="9" fill="#64748B" text-anchor="middle">%10</text>
  <text x="843" y="333" font-size="9" fill="#64748B" text-anchor="end">%50</text>
  <text x="482" y="333" font-size="9" fill="#94A3B8">saptanabilir VAF →</text>

  <!-- ============ PANEL C ============ -->
  <rect x="40" y="355" width="820" height="120" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="52" y="365" width="20" height="20" rx="5" fill="#1A2B4A"/>
  <text x="62" y="380" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="80" y="380" font-size="13" font-weight="700" fill="#2563EB">Hangi dokuda bakmalı? — lezyonun bulunduğu dokuda</text>

  <rect x="58" y="396" width="150" height="44" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="133" y="414" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Kan</text>
  <text x="133" y="429" font-size="9" fill="#2E3440" text-anchor="middle">gonozomal şüphesi</text>

  <rect x="218" y="396" width="150" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="293" y="414" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Deri (lezyonlu)</text>
  <text x="293" y="429" font-size="9" fill="#2E3440" text-anchor="middle">Blaschko/pigment lezyonu</text>

  <rect x="378" y="396" width="150" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="453" y="414" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Fibroblast kültürü</text>
  <text x="453" y="429" font-size="9" fill="#2E3440" text-anchor="middle">lezyonlu deriden</text>

  <rect x="538" y="396" width="150" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="613" y="414" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Etkilenmiş doku</text>
  <text x="613" y="429" font-size="9" fill="#2E3440" text-anchor="middle">cerrahi/biyopsi örneği</text>

  <rect x="698" y="396" width="150" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="773" y="414" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">Bukkal / idrar</text>
  <text x="773" y="429" font-size="9" fill="#2E3440" text-anchor="middle">girişimsel olmayan tarama</text>

  <text x="52" y="462" font-size="9.5" fill="#475569">Kural: kanda negatiflik mozaikliği DIŞLAMAZ. Lezyon nerede ise doku oradan alınmalı, yöntem de o VAF'ı görecek derinlikte seçilmelidir.</text>

  <text x="40" y="500" font-size="11.5" font-style="italic" fill="#475569">Öğreti: Mozaiklikte negatif sonuç iki farklı şey demek olabilir — "varyant yok" ya da "varyant vardı ama bakılan dokuda/derinlikte görünmedi".</text>
  <text x="40" y="516" font-size="11.5" font-style="italic" fill="#475569">Bu ikisini ayırt edemeyen bir rapor, klinik olarak yorumlanamaz.</text>
  <text x="860" y="534" font-size="9.5" fill="#94A3B8" text-anchor="end">Kaynaklar: Biesecker &amp; Spinner (2013); Checri ve ark. (2023)</text>
</svg>
