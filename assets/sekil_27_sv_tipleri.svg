<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B4A">Yapısal varyant (SV) tipleri — referans diziye göre değişim</text>

  <!-- Reference -->
  <text x="40" y="78" font-size="11" font-weight="700" fill="#1A2B4A">Referans</text>
  <text x="40" y="92" font-size="9" fill="#64748B">(normal)</text>
  <g>
    <rect x="300" y="64" width="40" height="26" rx="4" fill="#2563EB"/><text x="320" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
    <rect x="344" y="64" width="40" height="26" rx="4" fill="#64748B"/><text x="364" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>
    <rect x="388" y="64" width="40" height="26" rx="4" fill="#D97706"/><text x="408" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C</text>
    <rect x="432" y="64" width="40" height="26" rx="4" fill="#93C5FD"/><text x="452" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">D</text>
  </g>
  <line x1="40" y1="108" x2="860" y2="108" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Deletion -->
  <text x="40" y="146" font-size="11.5" font-weight="700" fill="#B91C1C">Delesyon</text>
  <rect x="300" y="132" width="40" height="26" rx="4" fill="#2563EB"/><text x="320" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <rect x="344" y="132" width="40" height="26" rx="4" fill="#64748B"/><text x="364" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>
  <rect x="388" y="132" width="40" height="26" rx="4" fill="#ffffff" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="3 2"/><text x="408" y="150" text-anchor="middle" font-size="11" fill="#B91C1C">✗</text>
  <rect x="432" y="132" width="40" height="26" rx="4" fill="#93C5FD"/><text x="452" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">D</text>
  <text x="500" y="143" font-size="10" font-weight="600" fill="#2E3440">C kaybı → tek kopya → doz %50</text>
  <text x="500" y="157" font-size="9" fill="#64748B">haploinsufficiency (Bölüm 3)</text>

  <!-- Duplication -->
  <text x="40" y="202" font-size="11.5" font-weight="700" fill="#B45309">Duplikasyon</text>
  <rect x="300" y="188" width="40" height="26" rx="4" fill="#2563EB"/><text x="320" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <rect x="344" y="188" width="40" height="26" rx="4" fill="#64748B"/><text x="364" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>
  <rect x="388" y="188" width="40" height="26" rx="4" fill="#D97706"/><text x="408" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C</text>
  <rect x="432" y="188" width="40" height="26" rx="4" fill="#D97706"/><text x="452" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C</text>
  <rect x="476" y="188" width="40" height="26" rx="4" fill="#93C5FD"/><text x="496" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">D</text>
  <text x="544" y="199" font-size="10" font-weight="600" fill="#2E3440">C fazladan → 3 kopya → doz %150</text>
  <text x="544" y="213" font-size="9" fill="#64748B">artmış doz / triplosensitivite (Bölüm 4)</text>

  <!-- Inversion -->
  <text x="40" y="258" font-size="11.5" font-weight="700" fill="#1A2B4A">İnversiyon</text>
  <rect x="300" y="244" width="40" height="26" rx="4" fill="#2563EB"/><text x="320" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <rect x="344" y="244" width="40" height="26" rx="4" fill="#D97706"/><text x="364" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C</text>
  <rect x="388" y="244" width="40" height="26" rx="4" fill="#64748B"/><text x="408" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>
  <rect x="432" y="244" width="40" height="26" rx="4" fill="#93C5FD"/><text x="452" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">D</text>
  <text x="364" y="236" text-anchor="middle" font-size="8.5" fill="#64748B">↺ B–C ters döndü</text>
  <text x="500" y="255" font-size="10" font-weight="600" fill="#2E3440">Dengeli: doz değişmez</text>
  <text x="500" y="269" font-size="9" fill="#64748B">ama kırılma noktası geni bölebilir</text>

  <!-- Translocation -->
  <text x="40" y="314" font-size="11.5" font-weight="700" fill="#1A2B4A">Translokasyon</text>
  <rect x="300" y="300" width="40" height="26" rx="4" fill="#2563EB"/><text x="320" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <rect x="344" y="300" width="40" height="26" rx="4" fill="#64748B"/><text x="364" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">B</text>
  <rect x="388" y="300" width="40" height="26" rx="4" fill="#B91C1C"/><text x="408" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Y</text>
  <rect x="432" y="300" width="40" height="26" rx="4" fill="#B91C1C"/><text x="452" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Z</text>
  <text x="408" y="292" text-anchor="middle" font-size="8.5" fill="#B91C1C">başka kromozom</text>
  <text x="500" y="311" font-size="10" font-weight="600" fill="#2E3440">Parça başka kromozoma taşındı</text>
  <text x="500" y="325" font-size="9" fill="#64748B">kırılma noktası: gen kesintisi / füzyon</text>

  <!-- footer -->
  <rect x="40" y="356" width="820" height="74" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="450" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#1A2B4A">İki büyük kategori: dengesiz (doz değişir) vs dengeli (doz değişmez)</text>
  <text x="450" y="398" text-anchor="middle" font-size="10" fill="#2E3440">Dengesiz: delesyon/duplikasyon → kopya sayısı değişir (CNV). Dengeli: inversiyon/translokasyon → toplam DNA aynı.</text>
  <text x="450" y="416" text-anchor="middle" font-size="10" fill="#2E3440">Ayrıca insersiyon ve kompleks yeniden düzenlenmeler vardır; dengeli SV'ler bile kırılma noktasında gen bozabilir veya pozisyon etkisi yapabilir (→ Şekil 28).</text>
</svg>
